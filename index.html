        <script>

                    "Xiamen": "厦门", "Fuzhou": "福州", "Jinan": "济南", "Hefei": "合肥",
                    "Kunming": "昆明", "Guilin": "桂林", "Harbin": "哈尔滨", "Shenyang": "沈阳",
                    "Changchun": "长春", "Shijiazhuang": "石家庄", "Taiyuan": "太原", "Nanchang": "南昌",
                    "Guiyang": "贵阳", "Nanning": "南宁", "Haikou": "海口", "Lanzhou": "兰州",
                    "Xining": "西宁", "Yinchuan": "银川", "Urumqi": "乌鲁木齐", "Lhasa": "拉萨",

                    "Dongguan": "东莞", "Zhuhai": "珠海", "Quanzhou": "泉州", "Wenzhou": "温州"
                };
                var WMO = {
                    0: ["☀️", "晴", "今天阳光正好，出门走走晒晒太阳吧~"],
                    1: ["🌤️", "基本晴", "天气不错，适合出门走走~"],
                    2: ["⛅", "多云", "云比较多，但天气舒适，适合外出~"],
                    3: ["☁️", "阴", "天有点阴，心情也要保持阳光哦~"],
                    45: ["🌫️", "雾", "有雾，出门注意安全~"],
                    48: ["🌫️", "雾凇", "有雾凇，景色很美但注意保暖~"],
                    51: ["🌦️", "毛毛雨", "下小雨了，记得带把伞☔"],
                    53: ["🌦️", "小雨", "下小雨了，出门记得带伞☔"],

                    61: ["🌧️", "小雨", "下雨了，记得带伞☔"],
                    63: ["🌧️", "中雨", "雨不小，路上注意安全~"],
                    65: ["🌧️", "大雨", "雨很大，尽量待在室内吧~"],
                    71: ["🌨️", "小雪", "下雪了，路滑注意安全，记得保暖❄️"],
                    73: ["🌨️", "中雪", "雪不小，多穿点别冻着~"],
                    75: ["❄️", "大雪", "大雪纷飞，注意保暖别感冒~"],
                    80: ["🌦️", "阵雨", "有阵雨，出门带伞准没错~"],
                    81: ["🌧️", "阵雨", "有阵雨，出门带伞吧~"],
                    82: ["⛈️", "强阵雨", "雷阵雨，尽量别出门~"],
                    95: ["⛈️", "雷阵雨", "打雷了，注意安全远离空旷处~"],
                    96: ["⛈️", "雷阵雨", "雷阵雨伴有冰雹，注意安全~"],
                    99: ["⛈️", "强雷暴", "强雷暴天气，待在室内更安全~"]
                };
                function cnCity(n) { return CN_CITY[n] || n; }
                function tipFor(code, temp, min, max) {
                    var base = WMO[code] ? WMO[code][2] : "今天也要元气满满哦~";
                    var t = Math.round(temp);
                    if (t >= 32) return base + " 高温" + t + "°，注意防暑多喝水🥵";
                    if (t <= 5) return base + " 气温" + t + "°，挺冷的，多穿点保暖🧥";
                    if (min !== null && max !== null) return base + " 今天" + Math.round(min) + "~" + Math.round(max) + "°，注意增减衣物🍃";
                    return base;
                }
                var widget = document.getElementById('weather-widget');
                var msgEl = document.getElementById('weather-msg');
                var hideTimer = null;
                function showBar(html) {
                    msgEl.innerHTML = html;
                    widget.classList.add('show');
                    clearTimeout(hideTimer);
                    hideTimer = setTimeout(function () {
                        widget.classList.remove('show');
                    }, 7000);
                }
                function fetchWeather(lat, lon, cityName) {
                    var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
                        "&longitude=" + lon +
                        "&current=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m" +
                        "&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto";
                    fetch(url).then(function (r) { return r.json(); }).then(function (d) {
                        var c = d.current;
                        var daily = d.daily;
                        var code = c.weather_code;
                        var icon = (WMO[code] || ["☁️"])[0];
                        var desc = (WMO[code] || ["", "天气"])[1];
                        var tip = tipFor(code, c.temperature_2m, daily.temperature_2m_min[0], daily.temperature_2m_max[0]);
                        var html = '<div class="w-line1">👋 欢迎来自 <b>' + cityName + '</b> 的访客</div>' +
                            '<div class="w-line2">' + icon + ' ' + Math.round(c.temperature_2m) + '° ' + desc + '</div>' +
                            '<div class="w-line3">' + tip + '</div>';
                        showBar(html);
                    }).catch(function () { showBar('👋 欢迎来到 AJX 的小站~'); });
                }
                function fallback() {
                // ipwho.is 兜底：显示访客城市+天气
                fetch('https://ipwho.is/').then(function (r) { return r.json(); }).then(function (j) {
                    if (j && j.success && j.city) {
                        var city = cnCity(j.city);
                        fetchWeather(j.latitude, j.longitude, city);
                    } else { showBar('👋 欢迎来到 AJX 的小站~'); }
                }).catch(function () { showBar('👋 欢迎来到 AJX 的小站~'); });
            }
            // ===== MD5 实现（腾讯签名要求 MD5） =====
            function md5(s) {
                function RL(v, n) { return (v << n) | (v >>> (32 - n)); }
                function AU(lX, lY) {
                    var lX4, lY4, lX8, lY8, r;
                    lX8 = (lX & 0x80000000); lY8 = (lY & 0x80000000);
                    lX4 = (lX & 0x40000000); lY4 = (lY & 0x40000000);
                    r = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
                    if (lX4 & lY4) return (r ^ 0x80000000 ^ lX8 ^ lY8);
                    if (lX4 | lY4) { if (r & 0x40000000) return (r ^ 0xC0000000 ^ lX8 ^ lY8); else return (r ^ 0x40000000 ^ lX8 ^ lY8); } else return (r ^ lX8 ^ lY8);
                }
                var F = function (x, y, z) { return (x & y) | ((~x) & z); };
                var G = function (x, y, z) { return (x & z) | (y & (~z)); };
                var H = function (x, y, z) { return (x ^ y ^ z); };
                var I = function (x, y, z) { return (y ^ (x | (~z))); };
                var FF = function (a, b, c, d, x, s, ac) { a = AU(a, AU(AU(F(b, c, d), x), ac)); return AU(RL(a, s), b); };
                var GG = function (a, b, c, d, x, s, ac) { a = AU(a, AU(AU(G(b, c, d), x), ac)); return AU(RL(a, s), b); };
                var HH = function (a, b, c, d, x, s, ac) { a = AU(a, AU(AU(H(b, c, d), x), ac)); return AU(RL(a, s), b); };
                var II = function (a, b, c, d, x, s, ac) { a = AU(a, AU(AU(I(b, c, d), x), ac)); return AU(RL(a, s), b); };
                function CWA(str) {
                    var lWordCount, lMessageLength = str.length, t1 = lMessageLength + 8, t2 = (t1 - (t1 % 64)) / 64, lNumberOfWords = (t2 + 1) * 16, lWordArray = new Array(lNumberOfWords - 1), lBytePosition = 0, lByteCount = 0;
                    while (lByteCount < lMessageLength) { lWordCount = (lByteCount - (lByteCount % 4)) / 4; lBytePosition = (lByteCount % 4) * 8; lWordArray[lWordCount] = (lWordArray[lWordCount] | (str.charCodeAt(lByteCount) << lBytePosition)); lByteCount++; }
                    lWordCount = (lByteCount - (lByteCount % 4)) / 4; lBytePosition = (lByteCount % 4) * 8;
                    lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
                    lWordArray[lNumberOfWords - 2] = lMessageLength << 3; lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
                    return lWordArray;
                }
                function UE(str) { str = str.replace(/\r\n/g, "\n"); var u = ""; for (var n = 0; n < str.length; n++) { var c = str.charCodeAt(n); if (c < 128) { u += String.fromCharCode(c); } else if ((c > 127) && (c < 2048)) { u += String.fromCharCode((c >> 6) | 192); u += String.fromCharCode((c & 63) | 128); } else { u += String.fromCharCode((c >> 12) | 224); u += String.fromCharCode(((c >> 6) & 63) | 128); u += String.fromCharCode((c & 63) | 128); } } return u; }
                var x = CWA(UE(s));
                var a = 0x67452301, b = 0xEFCDAB89, c = 0x98BADCFE, d = 0x10325476;
                var S = [7,12,17,22,5,9,14,20,4,11,16,23,6,10,15,21];
                var K = [0xD76AA478,0xE8C7B756,0x242070DB,0xC1BDCEEE,0xF57C0FAF,0x4787C62A,0xA8304613,0xFD469501,0x698098D8,0x8B44F7AF,0xFFFF5BB1,0x895CD7BE,0x6B901122,0xFD987193,0xA679438E,0x49B40821,0xF61E2562,0xC040B340,0x265E5A51,0xE9B6C7AA,0xD62F105D,0x02441453,0xD8A1E681,0xE7D3FBC8,0x21E1CDE6,0xC33707D6,0xF4D50D87,0x455A14ED,0xA9E3E905,0xFCEFA3F8,0x676F02D9,0x8D2A4C8A,0xFFFA3942,0x8771F681,0x6D9D6122,0xFDE5380C,0xA4BEEA44,0x4BDECFA9,0xF6BB4B60,0xBEBFBC70,0x289B7EC6,0xEAA127FA,0xD4EF3085,0x04881D05,0xD9D4D039,0xE6DB99E5,0x1FA27CF8,0xC4AC5665,0xF4292244,0x432AFF97,0xAB9423A7,0xFC93A039,0x655B59C3,0x8F0CCC92,0xFFEFF47D,0x85845DD1,0x6FA87E4F,0xFE2CE6E0,0xA3014314,0x4E0811A1,0xF7537E82,0xBD3AF235,0x2AD7D2BB,0xEB86D391];
                for (var k = 0; k < x.length; k += 16) {
                    var AA = a, BB = b, CC = c, DD = d;
                    for (var i = 0; i < 64; i++) {
                        var f, g;
                        if (i < 16) { f = F(b, c, d); g = i; }
                        else if (i < 32) { f = G(b, c, d); g = (5 * i + 1) % 16; }
                        else if (i < 48) { f = H(b, c, d); g = (3 * i + 5) % 16; }
                        else { f = I(b, c, d); g = (7 * i) % 16; }
                        var oldA = a, oldB = b, oldC = c, oldD = d;
                        var s = S[Math.floor(i / 16) * 4 + (i % 4)];
                        var tmp = AU(oldA, AU(f, AU(x[k + g], AU(0, K[i]))));
                        a = oldD; d = oldC; c = oldB;
                        b = AU(oldB, RL(tmp, s));
                    }
                    a = AU(a, AA); b = AU(b, BB); c = AU(c, CC); d = AU(d, DD);
                }
                function hex(n) { var h = ""; for (var i = 0; i < 4; i++) { h += ((n >> (i * 8)) & 255).toString(16).padStart(2, '0'); } return h; }
                return hex(a) + hex(b) + hex(c) + hex(d);
            }
            function locate() {
                var QQ_KEY = '2OOBZ-BSY6M-SS362-6AT56-32XZE-KHFXZ', QQ_SK = 'ozFKOpSc3b078f0qQEdjlKZyPoObVca5';
                var done = false, cb = 'qqloc' + Date.now();
                function cleanup() { try { delete window[cb]; if (scr && scr.parentNode) scr.parentNode.removeChild(scr); } catch (e) {} }
                window[cb] = function (res) {
                    cleanup();
                    if (done) return; done = true;
                    if (res && res.status === 0 && res.result) {
                        var r = res.result, ad = r.ad_info || {};
                        var cityName = ad.city || ad.province || '未知';
                        if (r.location && r.location.lat) fetchWeather(r.location.lat, r.location.lng, cityName);
                        else fallback();
                    } else { fallback(); }
                };
                // 腾讯 MD5 签名：md5(路径?参数SK) 参数值不编码
                var path = '/ws/location/v1/ip';
                var rawParams = { key: QQ_KEY, output: 'jsonp', callback: cb };
                var keys = Object.keys(rawParams).sort();
                var qs = keys.map(function (k) { return k + '=' + rawParams[k]; }).join('&');
                var sig = md5(path + '?' + qs + QQ_SK);
                var scr = null;
                try {
                    scr = document.createElement('script');
                    scr.src = 'https://apis.map.qq.com' + path + '?' + qs + '&sig=' + sig;
                    scr.onerror = function () { cleanup(); if (!done) { done = true; fallback(); } };
                    document.head.appendChild(scr);
                } catch (e) { fallback(); }
                setTimeout(function () { if (!done) { done = true; cleanup(); fallback(); } }, 8000);
            }
            locate();
            })();
        </script>
