<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>诊断</title>
<style>
body{background:#0f1115;color:#d8e0ea;font:13px/1.7 -apple-system,"PingFang SC",monospace;padding:16px;margin:0}
h3{font-size:14px;color:#7dd3fc;margin:18px 0 6px;border-bottom:1px solid #1e2733;padding-bottom:4px}
.k{color:#5a6675}
.v{color:#f0f4f8}
.ok{color:#4ade80}
.no{color:#f87171}
pre{background:#161b22;padding:9px;border-radius:5px;overflow-x:auto;font-size:11.5px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div id="out"></div>
<script>
var API='https://ajx-stats.haiteluo.xyz';
var out=document.getElementById('out');
function sec(t){var h=document.createElement('h3');h.textContent=t;out.appendChild(h);}
function row(k,v,cls){var d=document.createElement('div');d.innerHTML='<span class="k">'+k+'</span> <span class="v '+(cls||'')+'">'+v+'</span>';out.appendChild(d);}
function pre(t){var p=document.createElement('pre');p.textContent=t;out.appendChild(p);}

sec('会话状态');
try{
  row('ajx_ld_reload =', sessionStorage.getItem('ajx_ld_reload')||'(空)');
  row('ajx_dev_cache =', sessionStorage.getItem('ajx_dev_cache')||'(空)');
}catch(e){row('sessionStorage','不可用','no');}

sec('第一步：fetch /whoami（当前这把请求）');
fetch(API+'/whoami',{credentials:'include',cache:'no-store'})
.then(function(r){return r.json();})
.then(function(d){
  row('ok =', d.ok, d.ok?'ok':'no');
  row('model =', d.model===''||d.model==null?'(空) '+d.model:d.model, d.model?'ok':'no');
  row('modelName =', d.modelName||'(空)', d.modelName?'ok':'no');
  row('platformVersion =', d.platformVersion||'(空)', d.platformVersion?'ok':'no');
  sec('原始返回');
  pre(JSON.stringify(d,null,2));

  sec('第二步：该不该 reload');
  var done=null;
  try{done=sessionStorage.getItem('ajx_ld_reload');}catch(e){}
  if(done==='1'){
    row('已经 reload 过一次了','→ 说明 reload 无效，Edge 确实不给型号','no');
  }else{
    row('尚未 reload','→ 点下面按钮 reload，看第二次是否能拿到','');
    var b=document.createElement('button');
    b.textContent='执行 reload 测试';
    b.style.cssText='margin-top:10px;padding:9px 16px;background:#2563eb;color:#fff;border:0;border-radius:6px;font-size:13px';
    b.onclick=function(){
      try{sessionStorage.setItem('ajx_ld_reload','1');}catch(e){}
      location.reload();
    };
    out.appendChild(b);
  }
})
.catch(function(e){
  row('fetch 失败', String(e), 'no');
  sec('注意');
  pre('如果这里失败，说明 API 域名在你网络下不通。\n那就不是型号问题，是网络问题。');
});

sec('环境');
row('UA =','', '');
pre(navigator.userAgent);
row('platform =', navigator.platform||'(空)');
if(navigator.userAgentData){
  row('uaData.brands =','', '');
  pre(JSON.stringify(navigator.userAgentData.brands));
  navigator.userAgentData.getHighEntropyValues(['model','platformVersion'])
  .then(function(h){
    row('getHighEntropy.model =', h.model===''?'(空字符串)':h.model, h.model?'ok':'no');
    row('getHighEntropy.platformVersion =', h.platformVersion||'(空)', h.platformVersion?'ok':'no');
  });
}else{
  row('navigator.userAgentData','不存在','no');
}
</script>
</body>
</html>
