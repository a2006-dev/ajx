<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>停云 · TIME LOUNGE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  height:100%;
  height:100dvh;            /* 移动端完整视口，全屏时盖住状态栏 */
  overflow:hidden;
  overscroll-behavior:none;
}
/* 全屏态：尽量铺满屏幕 */
body:fullscreen, body:-webkit-full-screen { width:100vw; height:100vh; }
:fullscreen { background:#000; }
body {
  background:#0a0e14; color:#e8eef8;
  font-family:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  position:fixed; inset:0;
}
#dust { position:fixed; inset:0; z-index:0; display:block; }
.earth {
  position:fixed; inset:0; z-index:1;
  width:100%; height:100%;
  display:block; pointer-events:none;
}
/* 运行时去掉遮挡地球的变量 */
.vignette {
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%, transparent 30%, rgba(4,7,12,.34) 66%, rgba(3,5,9,.82) 100%);
}
.night .vignette { background:radial-gradient(ellipse at 50% 46%, transparent 22%, rgba(2,4,8,.60) 62%, rgba(1,2,5,.94) 100%); }
.night .clock { opacity:.72; }
.night .earth { opacity:.62; }

.stage {
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom));
}
.center {
  flex:1 1 auto; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; min-height:0; text-align:center;
}
.poem {
  font-size:clamp(10px,1.5vw,13px); font-weight:300;
  letter-spacing:.44em; text-indent:.44em;
  color:rgba(150,178,222,.42);
  margin-bottom:clamp(10px,2.6vh,26px);
}
.poem .dot { margin:0 .5em; opacity:.4; }
.clock {
  font-size:clamp(58px,17.5vw,190px); font-weight:200;
  font-family:'Didot','Bodoni MT','Georgia','Songti SC','STSong','STZhongsong','Noto Serif SC',serif;
  font-variant-numeric:tabular-nums;
  letter-spacing:.02em; line-height:.94; color:#f6f9ff;
  text-shadow:0 2px 40px rgba(6,12,26,.85), 0 0 70px rgba(8,16,34,.7), 0 0 130px rgba(110,160,255,.16);
  transition:opacity 1.2s ease;
}
.clock .colon { animation:colonPulse 2s ease-in-out infinite; display:inline-block; }
@keyframes colonPulse { 0%,100%{opacity:.35;} 50%{opacity:1;} }
.clock .sec { font-size:.56em; color:rgba(200,220,255,.72); letter-spacing:.02em; }
.date {
  margin-top:clamp(10px,2.2vh,22px); font-size:clamp(11px,1.7vw,15px);
  font-weight:300; letter-spacing:.30em; text-indent:.30em;
  color:rgba(178,200,238,.50);
}
.stay {
  margin-top:clamp(8px,1.8vh,16px); font-size:11px; font-weight:300;
  letter-spacing:.30em; text-indent:.30em; color:rgba(150,175,215,.30);
  font-variant-numeric:tabular-nums; transition:opacity .8s ease;
}
.stay b { font-weight:300; color:rgba(180,200,240,.52); letter-spacing:.12em; }

.dock {
  flex:0 0 auto; width:min(430px,100%);
  transition:opacity .7s cubic-bezier(.19,1,.22,1), transform .7s cubic-bezier(.19,1,.22,1);
}
body.idle .dock { opacity:0; transform:translateY(18px); pointer-events:none; }
body.idle .stay { opacity:0; }
body.idle .corner { opacity:0; pointer-events:none; }

.mini {
  position:relative; overflow:hidden;
  display:flex; align-items:center; gap:10px;
  height:58px; padding:0 8px 0 9px; border-radius:999px;
  background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.028));
  border:1px solid rgba(150,190,255,.18);
  -webkit-backdrop-filter:blur(22px) saturate(1.3); backdrop-filter:blur(22px) saturate(1.3);
  box-shadow:0 8px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.10);
  cursor:pointer;
  transition:background .35s, border-color .35s, box-shadow .35s, transform .35s;
}
.mini:hover {
  background:linear-gradient(180deg, rgba(255,255,255,.105), rgba(255,255,255,.045));
  border-color:rgba(160,200,255,.34);
  box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
}
/* 胶囊内的上一首/下一首 */
.mbtn {
  flex:none; width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; color:rgba(214,228,255,.72);
  cursor:pointer; transition:all .25s ease;
}
.mbtn:hover { background:rgba(120,165,255,.20); color:#fff; }
.mbtn:active { transform:scale(.90); }
.mbtn svg { width:13px; height:13px; }
.mini .mv {
  flex:none; width:40px; height:40px; border-radius:50%;
  background:radial-gradient(circle at 32% 30%, #2a3242, #0d1119 72%);
  border:1px solid rgba(160,195,255,.30);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.05);
  animation:spin 7s linear infinite;
}
.mini .mv img { width:66%; height:66%; border-radius:50%; object-fit:cover; }
.mv.paused { animation-play-state:paused; }
.mini .mtxt { flex:1; min-width:0; text-align:left; }
.mini .mname {
  font-size:13px; font-weight:500; letter-spacing:.03em;
  color:rgba(240,246,255,.96);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mini .mart {
  margin-top:1px; font-size:9.5px; font-weight:300; letter-spacing:.14em;
  color:rgba(160,186,228,.55);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.mini .mbar {
  position:absolute; left:14%; right:14%; bottom:0; height:1.5px;
  border-radius:2px; background:rgba(122,162,255,.16); overflow:hidden;
}
.mini .mbar i {
  display:block; height:100%; width:0;
  background:linear-gradient(90deg, rgba(140,180,255,.9), rgba(190,215,255,.95));
  border-radius:2px; transition:width .25s linear;
}
.mplay {
  flex:none; width:38px; height:38px; border-radius:50%;
  border:1px solid rgba(160,200,255,.42);
  background:linear-gradient(135deg, rgba(120,170,255,.42), rgba(90,140,240,.18));
  color:#f2f8ff;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 0 20px rgba(110,160,255,.32), inset 0 1px 0 rgba(255,255,255,.24);
  transition:all .25s ease;
}
.mplay:hover {
  background:linear-gradient(135deg, rgba(140,185,255,.58), rgba(110,160,250,.28));
  box-shadow:0 0 28px rgba(120,170,255,.5), inset 0 1px 0 rgba(255,255,255,.3);
}
.mplay:active { transform:scale(.92); }
.mplay svg { width:15px; height:15px; margin-left:1px; }

.corner { position:fixed; z-index:6; display:flex; gap:8px; transition:opacity .7s ease; }
.corner.tr { top:max(16px, env(safe-area-inset-top)); right:16px; }
.corner.tl { top:max(16px, env(safe-area-inset-top)); left:16px; }
.ico-btn {
  width:38px; height:38px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.045); border:1px solid rgba(122,162,255,.14);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  color:rgba(214,228,255,.78); cursor:pointer; text-decoration:none;
  transition:all .3s ease;
}
.ico-btn:hover { background:rgba(110,160,255,.2); border-color:rgba(150,190,255,.5); color:#fff; }
.ico-btn svg { width:15px; height:15px; }
.ico-btn.on { color:#9fc6ff; border-color:rgba(150,190,255,.5); background:rgba(110,160,255,.16); }

.sheet {
  position:fixed; z-index:7; left:50%; bottom:0; width:min(430px,100%);
  transform:translate(-50%,110%);
  transition:transform .55s cubic-bezier(.19,1,.22,1), opacity .4s ease;
  opacity:0; pointer-events:none;
  padding:16px 16px max(18px, env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;
  background:rgba(12,17,26,.86);
  border:1px solid rgba(122,162,255,.16); border-bottom:none;
  -webkit-backdrop-filter:blur(28px) saturate(1.2); backdrop-filter:blur(28px) saturate(1.2);
  box-shadow:0 -14px 60px rgba(0,0,0,.6);
}
.sheet.open { transform:translate(-50%,0); opacity:1; pointer-events:auto; }
.sheet .grab {
  width:38px; height:4px; border-radius:99px;
  background:rgba(160,190,240,.28); margin:0 auto 12px; cursor:pointer;
}
.sheet .player {
  width:100%; margin:0; padding:0;
  background:transparent; border:none; box-shadow:none;
  -webkit-backdrop-filter:none; backdrop-filter:none; border-radius:0;
  display:flex; flex-direction:column; gap:0; text-align:left;
}
.player-top { display:flex; align-items:center; gap:12px; }
.discWrap { position:relative; flex:none; width:58px; height:58px; }
.disc {
  width:100%; height:100%; border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #262d3d, #0d1119 70%);
  border:1px solid rgba(150,180,255,.28);
  box-shadow:0 5px 24px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.03);
  display:flex; align-items:center; justify-content:center;
  animation:spin 3s linear infinite;
}
.disc.paused { animation-play-state:paused; }
@keyframes spin { to { transform:rotate(360deg); } }
.disc .cover { width:54%; height:54%; border-radius:50%; object-fit:cover; box-shadow:inset 0 0 0 2px rgba(255,255,255,.22); }
.discWrap .spindle {
  position:absolute; top:50%; left:50%; width:11px; height:11px; border-radius:50%;
  background:#eef4ff; transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(255,255,255,.65); z-index:2;
  border:3px solid rgba(0,0,0,.4);
}
.p-main { flex:1; min-width:0; }
.p-name { font-size:14px; font-weight:400; letter-spacing:.04em; color:#f2f6ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-artist { margin-top:2px; font-size:10px; font-weight:300; letter-spacing:.14em; color:rgba(170,196,236,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-prog { margin-top:9px; }
.p-prog input[type=range] { -webkit-appearance:none; appearance:none; width:100%; height:4px; border-radius:999px; background:rgba(122,162,255,.2); outline:none; cursor:pointer; }
.p-prog input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%; background:#cfe0ff; box-shadow:0 0 10px rgba(120,165,255,.75); border:none; }
.p-prog input[type=range]::-moz-range-thumb { width:12px; height:12px; border-radius:50%; background:#cfe0ff; border:none; }
.p-time { margin-top:6px; display:flex; justify-content:space-between; align-items:baseline; font-family:'SF Mono','Menlo','Consolas',ui-monospace,monospace; font-size:11.5px; font-weight:500; letter-spacing:.05em; color:rgba(206,224,255,.9); font-variant-numeric:tabular-nums; }
.p-time .dur { margin-left:auto; }
.p-time .sep { color:rgba(122,162,255,.45); margin:0 4px; }
.p-lyric {
  position:relative; margin:13px 4px 3px; height:132px; max-height:132px; overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, transparent, #000 24%, #000 76%, transparent);
  mask-image:linear-gradient(to bottom, transparent, #000 24%, #000 76%, transparent);
}
.p-lyric .l-inner { position:absolute; left:0; right:0; top:0; will-change:transform; transition:transform .5s cubic-bezier(.19,1,.22,1); }
.p-lyric .l-group { transition:transform .35s ease; padding:5px 0; }
.p-lyric .l-line { text-align:center; font-size:13px; font-weight:300; letter-spacing:.05em; color:rgba(170,196,236,.32); transition:color .35s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-lyric .l-tr { text-align:center; margin-top:3px; font-size:9px; font-weight:300; color:rgba(170,196,236,.38); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.p-lyric .l-group.on { transform:scale(1.055); }
.p-lyric .l-group.on .l-line { color:#f4f8ff; font-weight:500; letter-spacing:.07em; text-shadow:0 0 28px rgba(140,175,255,.6); }
.p-lyric .l-group.on .l-tr { color:rgba(200,220,255,.6); }
.p-lyric .l-group.preview .l-line { color:rgba(205,224,255,.6); }
.p-ctl { margin-top:11px; display:flex; align-items:center; justify-content:center; gap:3px; flex-wrap:nowrap; }
.pc { display:inline-flex; align-items:center; justify-content:center; padding:7px; border-radius:50%; background:transparent; border:none; color:#cfe0ff; cursor:pointer; transition:all .25s ease; }
.pc:hover { background:rgba(120,165,255,.18); }
.pc.act { color:#8ec2ff; }
.pc.main { width:40px; height:40px; background:linear-gradient(135deg, rgba(120,165,255,.35), rgba(120,165,255,.12)); border:1px solid rgba(150,190,255,.4); box-shadow:0 0 22px rgba(120,165,255,.3); }
.pc.main:hover { background:linear-gradient(135deg, rgba(120,165,255,.5), rgba(120,165,255,.2)); }
.pc svg { width:15px; height:15px; }
.pc.main svg { width:17px; height:17px; }

.iUp { opacity:0; transform:translate3d(0,26px,0); transition:all 1.6s cubic-bezier(.19,1,.22,1); }
.iUp.up { opacity:1; transform:translate3d(0,0,0); }

@media (max-height:560px) {
  .poem { display:none; }
  .clock { font-size:clamp(44px,13vh,96px); }
  .date { margin-top:8px; }
  .stay { display:none; }
  .mini { height:46px; }
  .p-lyric { height:96px; max-height:96px; }
  .sheet { padding-top:12px; }
}
@media (max-height:420px) {
  .date { display:none; }
  .clock { font-size:clamp(38px,15vh,76px); }
  .p-lyric { height:72px; max-height:72px; }
}
@media (max-width:520px) and (orientation:portrait) {
  .clock { font-size:clamp(62px,21vw,118px); }
  .stage { padding-left:14px; padding-right:14px; }
}
@media (min-width:900px) {
  .clock { font-size:clamp(120px,13vw,210px); }
  .dock { width:min(460px,100%); }
  .corner.tr { top:26px; right:26px; }
  .corner.tl { top:26px; left:26px; }
}
@supports not (backdrop-filter: blur(1px)) {
  .mini, .sheet, .ico-btn { background:rgba(12,17,26,.92); }
}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<canvas class="earth" id="earth"></canvas>
<div class="vignette"></div>

<div class="corner tl">
  <a class="ico-btn" href="./3d.html" title="返回入口">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </a>
</div>

<div class="corner tr">
  <button class="ico-btn" id="btnNight" title="夜间模式">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="ico-btn" id="btnLand" title="横屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.2"/><path d="M6 20h12" stroke-width="1.6"/></svg>
  </button>
  <button class="ico-btn" id="btnFs" title="全屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
  </button>
</div>

<div class="stage">
  <div class="center">
    <div class="poem iUp">霭霭停云<span class="dot">·</span>濛濛时雨</div>
    <div class="clock iUp" id="clock">--:--:--</div>
    <div class="date iUp" id="date">----</div>
    <div class="stay iUp">已停留 <b id="stay">00:00:00</b></div>
  </div>

  <div class="dock iUp">
    <div class="mini" id="mini">
      <div class="mv paused" id="mv"><img id="mvCover" src="./images/savoir.jpg" alt=""></div>
      <div class="mtxt">
        <div class="mname" id="mName">When the Summer Ends</div>
        <div class="mart" id="mArt">Savoir Adore</div>
      </div>
      <button class="mbtn" id="mPrev" title="上一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="mbtn" id="mPrev" title="上一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20" fill="currentColor" stroke="none"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
      </button>
      <button class="mplay" id="mPlay" title="播放/暂停">
        <svg id="mIcPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>
        <svg id="mIcPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="mbtn" id="mNext" title="下一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <button class="mbtn" id="mNext" title="下一首">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4" fill="currentColor" stroke="none"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
      </button>
      <div class="mbar"><i id="mBar"></i></div>
    </div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"></div>
  <div class="player" id="player">
    <div class="player-top">
      <div class="discWrap">
        <div class="disc paused" id="disc">
          <img class="cover" id="cover" src="./images/savoir.jpg" alt="cover">
        </div>
        <div class="spindle"></div>
      </div>
      <div class="p-main">
        <div class="p-name" id="pName">When the Summer Ends</div>
        <div class="p-artist" id="pArtist">Savoir Adore</div>
        <div class="p-prog">
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="p-time">
          <span id="cur">0:00</span><span class="sep">/</span><span class="dur" id="dur">0:00</span>
        </div>
      </div>
    </div>
    <div class="p-lyric" id="pLyric">
      <div class="l-inner" id="lInner"></div>
    </div>
    <div class="p-ctl">
      <button class="pc" id="btnFile" title="上传本地音乐"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
      <button class="pc" id="btnTr" title="翻译"><span style="font-size:12px;font-weight:500;">译</span></button>
      <button class="pc act" id="btnRepeat" title="循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <button class="pc" id="btnPrev" title="上一首"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>

    ctx.restore();

    /* 球体轮廓细线 */
    ctx.beginPath(); ctx.arc(CX, CY, RAD, 0, 7);
    ctx.strokeStyle = 'rgba(150,200,255,0.28)';
    ctx.lineWidth = Math.max(0.8, RAD * 0.004);
    ctx.stroke();
  }

  var lastT = 0;
  function loop(t) {
    if (!alive) return;
    /* 用真实时间推进，刷新率高低都一致 */
    if (!lastT) lastT = t;
    var dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;
    spin += SPEED * dt * 60;
    if (spin > Math.PI * 2) spin -= Math.PI * 2;
    draw();
    raf = requestAnimationFrame(loop);
  }

  return {
    init: function (el) {
      canvas = el;
      if (!canvas || !canvas.getContext) return;
      ctx = canvas.getContext('2d');
      resize();
      window.addEventListener('resize', function () {
        resize();
      });
      /* 页面不可见时停掉，省电（挂机场景很重要） */
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          alive = false;
          if (raf) cancelAnimationFrame(raf);
        } else if (!alive) {
          alive = true; lastT = 0;
          raf = requestAnimationFrame(loop);
        }
      });
      raf = requestAnimationFrame(loop);
    },
    polygons: polygons
  };
})();




/* ========== 1. 星尘粒子循环动画 ========== */
(function () {
  var c = document.getElementById('dust');
  if (!c) return;
  var x = c.getContext('2d');
  var w = 0, h = 0, ps = [];
  function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
  size();
  var N = Math.max(40, Math.min(150, Math.floor(w * h / 11000)));
  for (var i = 0; i < N; i++) {
    ps.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.2 + 0.5,
      vx: (Math.random() - 0.5) * 0.22,
      vy: -(Math.random() * 0.5 + 0.12),
      a: Math.random() * 0.5 + 0.12,
      ph: Math.random() * Math.PI * 2
    });
  }
  var mx = -1, my = -1;
  addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
  addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) { mx = e.touches[0].clientX; my = e.touches[0].clientY; } }, { passive: true });
  var t = 0;
  function frame() {
    t += 0.016;
    x.clearRect(0, 0, w, h);
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#080c14');
    g.addColorStop(0.55, '#0a101e');
    g.addColorStop(1, '#101426');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
      if (mx > 0) {
        var dx = mx - p.x, dy = my - p.y, d2 = dx * dx + dy * dy;
        if (d2 < 14400 && d2 > 1) { var d = Math.sqrt(d2); p.x -= dx / d * 0.4; p.y -= dy / d * 0.4; }
      }
      var al = p.a * (0.55 + 0.45 * Math.sin(t * 1.4 + p.ph));
      x.beginPath();
      x.arc(p.x, p.y, p.r, 0, 6.2832);
      x.fillStyle = 'rgba(182,206,255,' + al.toFixed(3) + ')';
      x.fill();
    }
    var cg = x.createRadialGradient(w / 2, h * 0.42, 10, w / 2, h * 0.42, w * 0.55);
    cg.addColorStop(0, 'rgba(96,142,255,' + (0.05 + 0.02 * Math.sin(t)).toFixed(3) + ')');
    cg.addColorStop(1, 'rgba(96,142,255,0)');
    x.fillStyle = cg; x.fillRect(0, 0, w, h);
    requestAnimationFrame(frame);
  }
  frame();
  addEventListener('resize', size);
})();

/* ========== 2. 大号时钟 + 挂机时长 ========== */
(function () {
  var clock = document.getElementById('clock');
  var dateEl = document.getElementById('date');
  var stayEl = document.getElementById('stay');
  var start = Date.now();
  var week = ['日', '一', '二', '三', '四', '五', '六'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    clock.innerHTML =
      pad(d.getHours()) + '<span class="colon">:</span>' + pad(d.getMinutes()) +
      '<span class="sec">:' + pad(d.getSeconds()) + '</span>';
    dateEl.textContent = d.getFullYear() + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 星期' + week[d.getDay()];
    var s = Math.floor((Date.now() - start) / 1000);
    stayEl.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
})();

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setMeta() {
    var t = tracks[idx];
    elCover.src = t.cover;
    elCover.alt = t.name;
    elName.textContent = t.name;
    elArtist.textContent = t.artist;
    renderLyric();
  }

  /* ===== 歌词自适应缩放 =====
     原理：先让所有歌词行回到基准字号并测量自然宽度，取最宽的一行算出统一缩放比例，
           再整体应用。这样所有行等高，滚动居中才准确。
           若缩到最小字号仍超宽，该行再单独兜底缩小。 */
  var fitTimer = 0, fitRetry = 0;

  /* 用 Range 精确测量文本真实宽度。
     注意：.l-line 是块级元素，scrollWidth 返回的是元素宽度（撑满容器），
     而非文本宽度，会导致误判为溢出。Range 取的是内联文本的实际排版宽度。 */
  function textWidth(el) {
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var w = r.getBoundingClientRect().width;
      if (w > 0) return w;
    } catch (e) {}
    return el.scrollWidth || el.offsetWidth || 0;
  }

  function fitOne(el, avail) {
    var w = textWidth(el);
    if (w > avail && w > 0) {
      var fs = parseFloat(el.style.fontSize) || 13;
      fs = fs * avail / w;
      if (fs < 6) fs = 6;
      el.style.fontSize = fs.toFixed(2) + 'px';
      el.style.letterSpacing = '0';
    }
  }

  function fitLyrics() {
    if (!elLyric) return;
    var box = elLyric.parentElement || elLyric;
    var avail = (box.clientWidth || box.offsetWidth || 0) - 8;
    if (avail <= 30) { scheduleFit(80); return; }

    var mains = elLyric.querySelectorAll('.l-line');
    var trs = elLyric.querySelectorAll('.l-tr');
    var i, el, w, maxMain = 0, maxTr = 0;

    for (i = 0; i < mains.length; i++) {
      el = mains[i];
      el.style.fontSize = '13px';
      el.style.letterSpacing = '.05em';
      w = textWidth(el);
      if (w > maxMain) maxMain = w;
    }
    for (i = 0; i < trs.length; i++) {
      el = trs[i];
      el.style.fontSize = '9px';
      el.style.letterSpacing = '.02em';
      w = textWidth(el);
      if (w > maxTr) maxTr = w;
    }

    /* 主歌词：最小 9px；翻译行：最小 7px（各自独立缩放，保证可读性） */
    var sMain = 1, sTr = 1;
    if (maxMain > avail) sMain = avail / maxMain;
    if (maxTr > avail) sTr = avail / maxTr;
    if (sMain > 1) sMain = 1;
    if (sTr > 1) sTr = 1;
    if (sMain < 9 / 13) sMain = 9 / 13;
    if (sTr < 7 / 9) sTr = 7 / 9;

    var mainFs = (13 * sMain).toFixed(2);
    var trFs = (9 * sTr).toFixed(2);

    for (i = 0; i < mains.length; i++) {
      el = mains[i];
      el.style.fontSize = mainFs + 'px';
      el.style.letterSpacing = (sMain < 0.999 ? '0' : '.05em');
      el.style.padding = (sMain < 0.999 ? '3px 0' : '5px 0');
      fitOne(el, avail);
    }
    for (i = 0; i < trs.length; i++) {
      el = trs[i];
      el.style.fontSize = trFs + 'px';
      el.style.letterSpacing = (sTr < 0.999 ? '0' : '.02em');
      el.style.padding = (sTr < 0.999 ? '0 0 3px' : '0 0 5px');
      fitOne(el, avail);
    }
  }

  /* 布局未就绪时重试（容器宽度为 0 的情况） */
  function scheduleFit(delay) {
    if (fitTimer) clearTimeout(fitTimer);
    fitTimer = setTimeout(function () {
      fitTimer = 0;
      var box = elLyric.parentElement || elLyric;
      var w = (box.clientWidth || box.offsetWidth || 0) - 8;
      if (w <= 30 && fitRetry < 30) { fitRetry++; scheduleFit(80); return; }
      fitRetry = 0;
      fitLyrics();
      if (audio && audio.currentTime) updateLyric(audio.currentTime);
    }, delay || 0);
  }

  function renderLyric() {
    var t = tracks[idx];
    if (!elLyric) return;
    elLyric.innerHTML = '';
    var lines = t.lyric;
    if (!lines || !lines.length) {
      var pre = document.createElement('div');
      pre.className = 'l-line';
      pre.textContent = '· · ·';
      elLyric.appendChild(pre);
      return;
    }
    for (var i = 0; i < lines.length; i++) {
      var g = document.createElement('div');
      g.className = 'l-group';
      var li = document.createElement('div');
      li.className = 'l-line';
      li.textContent = lines[i].l;
      g.appendChild(li);
      if (tr && lines[i].c) {
        var trDiv = document.createElement('div');
        trDiv.className = 'l-tr';
        trDiv.textContent = lines[i].c;
        g.appendChild(trDiv);
      }
      elLyric.appendChild(g);
    }
    /* 全部插入 DOM 后再测量缩放（此前在未入 DOM 时测量，导致 scrollWidth=0 而跳过缩放） */
    scheduleFit(0);
  }

  function updateLyric(tm) {
    var t = tracks[idx];
    if (!elLyric || !t.lyric || !t.lyric.length) return;
    var groups = elLyric.querySelectorAll('.l-group');
    if (!groups.length) return;
    var idxLine = 0;
    for (var i = 0; i < t.lyric.length; i++) {
      if (tm >= t.lyric[i].t) idxLine = i; else break;
    }
    for (var k = 0; k < groups.length; k++) {
      groups[k].classList.remove('on', 'preview');
      if (k === idxLine) groups[k].classList.add('on');
      else if (k === idxLine + 1) groups[k].classList.add('preview');
    }
    // 动态测量，确保当前句在歌词区严格垂直居中
    var inner = elLyric;
    var boxEl = elLyric.parentElement || elLyric; // .p-lyric 可视容器
    var boxH = boxEl.clientHeight || boxEl.offsetHeight || 104;
    var cur = groups[idxLine] || groups[0];
    var offTop = cur.offsetTop || 0;
    if (!offTop) { // 兜底：累加各行实际高度
      offTop = 0;
      for (var k2 = 0; k2 < idxLine; k2++) offTop += groups[k2].offsetHeight;
    }
    var curH = cur.offsetHeight || 27; // offsetHeight 不含 transform scale，避免漂移
    var y = -offTop + (boxH - curH) / 2; // 使当前句在可视区居中
    inner.style.transform = 'translateY(' + y + 'px)';
  }

  function playState() {
    elDisc.classList.toggle('paused', !on);
    icPlay.style.display = on ? 'none' : 'block';
    icPause.style.display = on ? 'block' : 'none';
    if (playerEl) playerEl.classList.toggle('playing', on);
  }

  function load(n) {
    idx = ((n % tracks.length) + tracks.length) % tracks.length;
    setMeta();
    audio.src = tracks[idx].src;
    audio.load();
    if (on) audio.play().catch(function () { on = false; playState(); });
  }

  function next() {
    if (shuffle) {
      var r;
      do { r = Math.floor(Math.random() * tracks.length); } while (r === idx && tracks.length > 1);
      load(r);
    } else {
      load(idx + 1);
    }
  }

  setMeta();
  load(0);

  audio.addEventListener('loadedmetadata', function () {
    elDur.textContent = fmt(audio.duration);

    if (!audio.duration) return;
    elCur.textContent = fmt(audio.currentTime);
    elSeek.value = audio.currentTime;
    var pct = (audio.currentTime / audio.duration) * 100;
    if (elSeek) elSeek.style.background = 'linear-gradient(to right, rgba(122,162,255,.9) ' + pct + '%, rgba(122,162,255,.2) ' + pct + '%)';

  });
  audio.addEventListener('ended', function () {
    if (repeat) { audio.currentTime = 0; audio.play().catch(function () { }); }
    else { next(); }

  audio.addEventListener('error', function () { if (on) next(); });

  elPlay.addEventListener('click', function () {
    on = !on;
    if (on) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { on = false; playState(); });
    } else { audio.pause(); }
    playState();
  });
  elNext.addEventListener('click', function () { next(); });
  elPrev.addEventListener('click', function () { load(idx - 1); });

  elRepeat.addEventListener('click', function () {
    repeat = !repeat;
    elRepeat.classList.toggle('act', repeat);
  });
  elShuffle.addEventListener('click', function () {
    shuffle = !shuffle;

  elFile.addEventListener('click', function () { if (fileInput) fileInput.click(); });
  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var url = URL.createObjectURL(f);
    var nm = (f.name || 'Local').replace(/\.[^.]+$/, '') || 'Local';
    var cv = tracks[idx] ? tracks[idx].cover : './images/savoir.jpg';
    tracks.push({ src: url, name: nm, artist: '本地音乐', cover: cv, lyric: null });
    localIdx = tracks.length - 1;
    on = true;
    load(localIdx);
    playState();
  });
  // 收起/展开切换：收缩按钮充当开关，点击黑胶也可展开
  var sheetEl = document.getElementById('sheet');
  function setFold(on) {
    if (!sheetEl) return;
    if (on) sheetEl.classList.add('open'); else sheetEl.classList.remove('open');
    if (elFold) {
      elFold.title = on ? '收起' : '展开';

      elFold.innerHTML = on

        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/></svg>';
    }
  }
  elFold.addEventListener('click', function (e) {
    e.stopPropagation();
    setFold(!(sheetEl && sheetEl.classList.contains('open')));
  });
  /* 点抓手、点 sheet 外部，都收起 */
  var grabEl = document.getElementById('grab');
  if (grabEl) grabEl.addEventListener('click', function () { setFold(false); });
  document.addEventListener('pointerdown', function (e) {
    if (!sheetEl || !sheetEl.classList.contains('open')) return;
    if (e.target.closest && e.target.closest('#sheet')) return;
    if (e.target.closest && e.target.closest('.corner')) return;
    if (e.target.closest && e.target.closest('.dock')) return;

  });

  elSeek.addEventListener('input', function () {
    if (audio.duration) {
      audio.currentTime = elSeek.value;
      var p2 = (elSeek.value / audio.duration) * 100;
      elSeek.style.background = 'linear-gradient(to right, rgba(122,162,255,.9) ' + p2 + '%, rgba(122,162,255,.2) ' + p2 + '%)';
    }
  });

  // 尺寸变化时重新适配歌词字号（容器宽度、折叠/展开、横屏等都会触发）
  addEventListener('resize', function () {

  // 首次布局完成后再适配一次（保证首帧即正确，无需等待整首播放）
  addEventListener('load', function () { scheduleFit(0); });
  setTimeout(function () { scheduleFit(0); }, 120);
  setTimeout(function () { scheduleFit(0); }, 600);

  // 播放器容器尺寸变化时自动重算（折叠/展开/横屏切换）
  if (window.ResizeObserver && elLyric && elLyric.parentElement) {
    try {
      var ro = new ResizeObserver(function () { scheduleFit(0); });
      ro.observe(elLyric.parentElement);

  on = false;
  playState();
})();

/* ========== 5. 入场动画（全站统一 .iUp） ========== */
(function () {
  var els = Array.prototype.slice.call(document.querySelectorAll('.iUp'));
  var t = 0, d = 150;
  els.forEach(function (e) {
    setTimeout(function () { e.classList.add('up'); }, t);
    t += d;
  });
})();
/* ========== 6. 停云挂机层 ========== */
(function () {
  var body = document.body;
  var mini = document.getElementById('mini');
  var mPlay = document.getElementById('mPlay');
  var mName = document.getElementById('mName');
  var mArt = document.getElementById('mArt');
  var mBar = document.getElementById('mBar');
  var mCover = document.getElementById('mvCover');
  var mv = document.getElementById('mv');
  var icPlay = document.getElementById('mIcPlay');
  var icPause = document.getElementById('mIcPause');
  var sheet = document.getElementById('sheet');

  /* ---- 静默 3.2 秒 → 隐藏控制层 ---- */
  var idleTimer = null;
  function wake() {
    body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (sheet && sheet.classList.contains('open')) return;
      body.classList.add('idle');
    }, 3200);
  }
  ['pointermove', 'pointerdown', 'wheel', 'touchstart', 'keydown', 'focus'].forEach(function (ev) {
    document.addEventListener(ev, wake, { passive: true });
  });
  wake();

  /* ---- 夜间自动调暗（22:00 ~ 06:59），可手动切换 ---- */
  var btnNight = document.getElementById('btnNight');
  var manualNight = null;
  function hourNight() {
    var h = new Date().getHours();
    return h >= 22 || h < 7;
  }
  function applyNight() {
    var on = manualNight === null ? hourNight() : manualNight;
    body.classList.toggle('night', on);
    if (btnNight) btnNight.classList.toggle('on', on);
  }
  applyNight();
  setInterval(applyNight, 60000);
  if (btnNight) btnNight.addEventListener('click', function () {
    manualNight = !body.classList.contains('night');
    applyNight();
    wake();
  });

  /* ---- 地球 ---- */
  var earthEl = document.getElementById('earth');
  if (earthEl && typeof EARTH !== 'undefined') EARTH.init(earthEl);

  /* ---- 横屏按钮 ---- */
  var btnLand = document.getElementById('btnLand');
  if (btnLand) btnLand.addEventListener('click', function () {
    if (!isFs()) toggleFs();
    var so = screen.orientation;
    if (so && so.lock) {
      so.lock('landscape').catch(function () { });
    } else {
      /* 不支持旋转锁定时，提示手动横屏 */
      body.classList.add('rotHint');
      setTimeout(function () { body.classList.remove('rotHint'); }, 1600);
    }
    wake();
  });

  /* ---- 全屏 ---- */
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function toggleFs() {
    if (isFs()) {
      var ex = document.exitFullscreen || document.webkitExitFullscreen;
      if (ex) ex.call(document);
    } else {
      var el = document.documentElement;
      var fn = el.requestFullscreen || el.webkitRequestFullscreen;
      if (fn) { var r = fn.call(el); if (r && r.catch) r.catch(function () { }); }
    }
  }
  var btnFs = document.getElementById('btnFs');
  if (btnFs) btnFs.addEventListener('click', function () { toggleFs(); wake(); });

  /* 双击空白进入全屏 */
  var lastTap = 0;
  document.addEventListener('click', function (e) {
    if (e.target.closest && (e.target.closest('.dock') || e.target.closest('.sheet') || e.target.closest('.corner'))) return;
    var now = Date.now();
    if (now - lastTap < 320) { toggleFs(); lastTap = 0; }
    else lastTap = now;
  });

  /* ---- 迷你条：点开完整播放器，播放键直通主按钮 ---- */
  if (mini) mini.addEventListener('click', function (e) {
    if (e.target.closest && e.target.closest('#mPlay')) return;
    if (sheet) sheet.classList.add('open');
    wake();
  });
  if (mPlay) mPlay.addEventListener('click', function (e) {
    e.stopPropagation();
    var bp = document.getElementById('btnPlay');
    if (bp) bp.click();
    wake();
  });

  /* ---- 从主播放器同步状态 ---- */
  function sync() {
    var pn = document.getElementById('pName');
    var pa = document.getElementById('pArtist');
    var cv = document.getElementById('cover');
    var dsc = document.getElementById('disc');
    if (pn && mName) mName.textContent = pn.textContent;
    if (pa && mArt) mArt.textContent = pa.textContent;
    if (cv && mCover && cv.src) mCover.src = cv.src;
    var playing = dsc && !dsc.classList.contains('paused');
    if (mv) mv.classList.toggle('paused', !playing);
    if (icPlay) icPlay.style.display = playing ? 'none' : '';
    if (icPause) icPause.style.display = playing ? '' : 'none';
    var seek = document.getElementById('seek');
    if (seek && mBar) {
      var mx = parseFloat(seek.max) || 0;
      var v = parseFloat(seek.value) || 0;
      mBar.style.width = mx > 0 ? ((v / mx) * 100).toFixed(1) + '%' : '0%';
    }
  }
  setInterval(sync, 400);
  sync();

  /* ---- 键盘 ---- */
  document.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.key === ' ' || e.code === 'Space') {
      e.preventDefault();
      var bp = document.getElementById('btnPlay');
      if (bp) bp.click();
    } else if (e.key === 'ArrowLeft') {
      var pv = document.getElementById('btnPrev'); if (pv) pv.click();
    } else if (e.key === 'ArrowRight') {
      var nx = document.getElementById('btnNext'); if (nx) nx.click();
    } else if (e.key === 'f' || e.key === 'F') {
      toggleFs();
    }
  });
})();
</script>
</body>
</html>
