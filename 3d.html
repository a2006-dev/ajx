<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="AJX 入口">
<title>AJX · 入口</title>
<link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
<link rel="icon" href="./favicon.ico">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #0b0e14;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
        -webkit-tap-highlight-color: transparent;
        background:
            radial-gradient(ellipse 60% 50% at 18% 18%, rgba(3,169,244,.16), transparent 60%),
            radial-gradient(ellipse 55% 45% at 82% 26%, rgba(244,65,165,.14), transparent 60%),
            radial-gradient(ellipse 60% 50% at 50% 92%, rgba(0,255,157,.12), transparent 60%),
            linear-gradient(165deg, #0b0e14 0%, #131c33 52%, #191a2b 100%);
    }

    /* 背景星点 */
    .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
            radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.55) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 78% 32%, rgba(255,255,255,.4) 50%, transparent 51%),
            radial-gradient(1px 1px at 42% 63%, rgba(0,255,157,.45) 50%, transparent 51%),
            radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.3) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 26% 86%, rgba(255,255,255,.35) 50%, transparent 51%),
            radial-gradient(1px 1px at 62% 12%, rgba(3,169,244,.4) 50%, transparent 51%);
        animation: twinkle 7s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
        from { opacity: .45; }
        to   { opacity: .95; }
    }

    /* ===================== 舞台 ===================== */
    /* 高度只决定「主卡垂直居中区」，不参与横向定位 */
    .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 320px;
        margin: 0 auto;
    }

    /* 单张卡：绝对定位，中心点由 JS 写入 left/top（已含 transform 偏移） */
    .card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 210px;
        height: 270px;
        margin-left: -105px;      /* 以自身中心为原点 */
        margin-top: -135px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        border-radius: 22px;
        text-decoration: none;
        color: #fff;
        background: rgba(255, 255, 255, .06);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, .16);
        box-shadow: 0 18px 46px rgba(0, 0, 0, .46), inset 0 1px 0 rgba(255, 255, 255, .1);
        overflow: hidden;
        cursor: pointer;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        transition: transform .48s cubic-bezier(.22, .61, .36, 1),
                    opacity .48s ease,
                    filter .3s ease,
                    border-color .3s ease,
                    box-shadow .3s ease;
    }

    /* 卡面右上角高光 */
    .card::before {
        content: "";
        position: absolute;
        top: -52px;
        right: -52px;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, .2), transparent 70%);
        pointer-events: none;
    }

    /* 主题色 */
    .card[data-theme="fire"]   { border-color: rgba(255, 95, 109, .45); box-shadow: 0 18px 46px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.1), 0 0 28px rgba(255,95,109,.22); }
    .card[data-theme="stats"]  { border-color: rgba(0, 198, 255, .45);  box-shadow: 0 18px 46px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.1), 0 0 28px rgba(0,198,255,.22); }
    .card[data-theme="heart"]  { border-color: rgba(255, 125, 165, .45); box-shadow: 0 18px 46px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.12), 0 0 28px rgba(255,125,165,.24); }
    .card[data-theme="log"]    { border-color: rgba(61, 220, 132, .45);  box-shadow: 0 18px 46px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.12), 0 0 28px rgba(61,220,132,.24); }
    .card[data-theme="music"]  { border-color: rgba(167, 139, 250, .45); box-shadow: 0 18px 46px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.12), 0 0 28px rgba(167,139,250,.24); }

    .card[data-theme="fire"]  .ico { color: #ff8a80; }
    .card[data-theme="stats"] .ico { color: #80d8ff; }
    .card[data-theme="heart"] .ico { color: #ff9db9; }
    .card[data-theme="log"]   .ico { color: #8ef0b5; }
    .card[data-theme="music"] .ico { color: #c4b5fd; }

    .card[data-theme="fire"]  .nm { color: #ff8a80; }
    .card[data-theme="stats"] .nm { color: #80d8ff; }
    .card[data-theme="heart"] .nm { color: #ff9db9; }
    .card[data-theme="log"]   .nm { color: #8ef0b5; }
    .card[data-theme="music"] .nm { color: #c4b5fd; }

    .ico { width: 52px; height: 52px; display: block; }
    .ico svg { width: 100%; height: 100%; display: block; }

    .nm {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: .06em;
        white-space: nowrap;
    }
    .ds {
        font-size: 11px;
        letter-spacing: .22em;
        color: rgba(255, 255, 255, .42);
        text-transform: uppercase;
    }

    /* 居中主卡 */
    .card.is-main {
        border-color: rgba(255, 255, 255, .5);
        filter: brightness(1.1);
    }
    @media (hover: hover) {
        .card:hover {
            filter: brightness(1.18);
            border-color: rgba(255, 255, 255, .58);
        }
    }
    .card:active { filter: brightness(1.26); }

    /* ===================== 控制条 ===================== */
    .controls {
        position: relative;
        z-index: 3;
        display: flex;
        align-items: center;
        gap: 22px;
        margin-top: 8px;
    }

    .ctrl {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .18);
        background: rgba(255, 255, 255, .06);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: rgba(255, 255, 255, .8);
        font-size: 17px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .25s, border-color .25s, color .25s, transform .2s;
        -webkit-tap-highlight-color: transparent;
    }
    .ctrl:hover {
        background: rgba(255, 255, 255, .14);
        border-color: rgba(255, 255, 255, .4);
        color: #fff;
    }
    .ctrl:active { transform: scale(.92); }

    /* 分页圆点 */
    .dots {
        display: flex;
        align-items: center;
        gap: 9px;
    }
    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: rgba(255, 255, 255, .22);
        cursor: pointer;
        transition: background .3s, width .3s, border-radius .3s;
        -webkit-tap-highlight-color: transparent;
    }
    .dot.is-on {
        width: 22px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .8);
    }

    /* 返回主页 */
    .back {
        position: fixed;
        top: 22px;
        left: 24px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        font-size: 13px;
        color: rgba(255, 255, 255, .62);
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        background: rgba(255, 255, 255, .05);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        transition: color .25s, border-color .25s, background .25s;
        -webkit-tap-highlight-color: transparent;
    }
    .back:hover {
        color: #fff;
        border-color: rgba(255, 255, 255, .4);
        background: rgba(255, 255, 255, .12);
    }
    .back .arw { font-size: 15px; line-height: 1; }

    .hint {
        position: relative;
        z-index: 3;
        margin-top: 24px;
        font-size: 12px;
        letter-spacing: .16em;
        color: rgba(255, 255, 255, .3);
        text-align: center;
        padding: 0 20px;
    }

    /* ===================== 响应式 ===================== */
    @media (max-width: 620px) {
        .stage { height: 280px; }
        .card {
            width: 160px;
            height: 206px;
            margin-left: -80px;
            margin-top: -103px;
            gap: 10px;
            border-radius: 18px;
        }
        .ico { width: 42px; height: 42px; }
        .nm { font-size: 15px; }
        .ds { font-size: 10px; letter-spacing: .18em; }
        .ctrl { width: 42px; height: 42px; font-size: 15px; }
        .controls { gap: 16px; }
        .hint { margin-top: 20px; font-size: 11px; }
        .back { top: 16px; left: 16px; padding: 8px 14px; font-size: 12px; }
    }

    /* 入场：从下往上浮现 */
    .rise {
        opacity: 0;
        transform: translateY(26px);
        transition: opacity .7s ease, transform .7s cubic-bezier(.19, 1, .22, 1);
    }
    .rise.up {
        opacity: 1;
        transform: translateY(0);
    }
</style>
</head>
<body>

<div class="stars"></div>

<a class="back rise" href="./index.html"><span class="arw">‹</span> 返回主页</a>

<!-- 卡片位置全部由 JS 计算；主卡永远在舞台正中 -->
<div class="stage rise" id="stage">
    <a class="card" data-theme="fire" href="./New-Year-fireworks.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="currentColor" opacity=".92"/><path d="M18.4 13.6L18.9 16.1L21.4 16.6L18.9 17.1L18.4 19.6L17.9 17.1L15.4 16.6L17.9 16.1L18.4 13.6Z" fill="currentColor" opacity=".68"/>
            </svg>
        </span>
        <span class="nm">新年烟花</span>
        <span class="ds">New Year</span>
    </a>

    <a class="card" data-theme="stats" href="./ybp.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="4" rx="1.6" fill="currentColor" opacity=".92"/><rect x="3" y="11" width="18" height="4" rx="1.6" fill="currentColor" opacity=".68"/><rect x="3" y="18" width="11" height="4" rx="1.6" fill="currentColor" opacity=".45"/>
            </svg>
        </span>
        <span class="nm">站点统计</span>
        <span class="ds">Stats</span>
    </a>

    <a class="card" data-theme="heart" href="./heart.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
            </svg>
        </span>
        <span class="nm">心迹 Heart</span>
        <span class="ds">Heart</span>
    </a>

    <a class="card" data-theme="log" href="./logcatcher.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6h16M4 12h16M4 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.4" cy="18" r="1.8" fill="currentColor"/>
            </svg>
        </span>
        <span class="nm">LogCatcher</span>
        <span class="ds">Log</span>
    </a>

    <a class="card" data-theme="music" href="./music.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18.5V5.5L20 3v13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor" opacity=".92"/><circle cx="17.5" cy="16.5" r="2.5" fill="currentColor" opacity=".92"/>
            </svg>
        </span>
        <span class="nm">停云</span>
        <span class="ds">Lounge</span>
    </a>
</div>

<div class="controls rise">
    <button class="ctrl" id="prev" type="button" aria-label="上一张">‹</button>
    <div class="dots" id="dots"></div>
    <button class="ctrl" id="next" type="button" aria-label="下一张">›</button>
</div>

<div class="hint rise">点击中间的卡片进入 · 两侧卡片点击可切换到它</div>

<script>
(function () {
    'use strict';

    var stage = document.getElementById('stage');
    if (!stage) return;

    var cards = Array.prototype.slice.call(stage.querySelectorAll('.card'));
    var total = cards.length;
    if (!total) return;

    var prevBtn = document.getElementById('prev');
    var nextBtn = document.getElementById('next');
    var dotBox = document.getElementById('dots');

    /* =========================================================
       唯一状态：focus = 哪一张卡居中（0 ~ total-1）
       ========================================================= */
    var focus = 0;

    /* 相对偏移，归一化到 [-half, half]，5 张 → [-2, 2] */
    function offsetOf(i) {
        var half = Math.floor(total / 2);
        var d = i - focus;
        while (d > half) d -= total;
        while (d <= -half - 1) d += total;
        return d;
    }

    /* =========================================================
       布局参数：只跟屏宽有关
       mainW  = 主卡宽
       sideX  = 侧卡中心距主卡中心的水平距离
       sideS  = 侧卡缩放
       ========================================================= */
    function metrics() {
        var w = window.innerWidth;
        var compact = w < 620;
        var mainW = compact ? 160 : 210;

        // 侧卡中心距离：主卡半宽 + 侧卡半宽*侧卡缩放 + 间距
        var sideS = compact ? 0.70 : 0.72;
        var gapPx = compact ? 14 : 26;
        var sideX = (mainW / 2) + (mainW * sideS / 2) + gapPx;

        // 侧卡外边缘必须落在屏内：中心 + 缩放后半宽 <= w/2 - 8
        var maxSide = (w / 2) - 8 - (mainW * sideS / 2);

        /* 关键：只有屏幕真的放得下「主卡 + 一张侧卡 + 间隙」时才显示侧卡。
           判据 —— maxSide 必须 >= 主卡半宽 + 间隙（否则侧卡会压到主卡上）。 */
        var needSide = mainW / 2 + (mainW * sideS / 2) + gapPx;
        var showSide = maxSide >= needSide;

        if (showSide && sideX > maxSide) sideX = maxSide;

        return {
            mainW: mainW,
            sideX: sideX,
            sideS: sideS,
            showSide: showSide,
            // 更远的两张（±2）放到屏幕外淡出，只做视觉纵深
            farX: sideX * 1.72,
            farS: sideS * 0.72,
            compact: compact
        };
    }

    function layout() {
        var m = metrics();
        var half = Math.max(Math.floor(total / 2), 1);

        cards.forEach(function (card, i) {
            var off = offsetOf(i);
            var abs = Math.abs(off);
            var x, sc, op, z;

            if (off === 0) {
                x = 0; sc = 1; op = 1; z = 50;
            } else if (!m.showSide) {
                /* 窄屏：侧卡完全不显示（几何上放不下），
                   只留极淡的残影贴在屏幕边缘之外，不会遮挡也不会抢事件 */
                x = (off > 0 ? 1 : -1) * (window.innerWidth * 0.5 + m.mainW);
                sc = m.sideS; op = 0; z = 20;
            } else if (abs === 1) {
                x = (off > 0 ? 1 : -1) * m.sideX;
                sc = m.sideS; op = 0.62; z = 40;
            } else {
                x = (off > 0 ? 1 : -1) * m.farX;
                sc = m.farS; op = 0.24; z = 30;
            }

            // 侧卡略微下沉，形成纵深
            var y = abs === 0 ? 0 : (abs === 1 ? 10 : 18);

            card.style.transform =
                'translate(' + x.toFixed(1) + 'px,' + y + 'px) scale(' + sc.toFixed(3) + ')';
            card.style.opacity = op.toFixed(2);
            card.style.zIndex = z;

            // 只有主卡和左右侧卡可点，更远的不可点（避免抢事件）
            card.style.pointerEvents =
                (abs === 0 || (m.showSide && abs === 1)) ? 'auto' : 'none';

            // 只有主卡带 is-main（高亮）
            if (off === 0) {
                card.classList.add('is-main');
                // 主卡无障碍：告诉读屏这是当前项
                card.setAttribute('aria-current', 'page');
            } else {
                card.classList.remove('is-main');
                card.removeAttribute('aria-current');
            }
        });

        Array.prototype.forEach.call(dotBox.children, function (d, i) {
            if (i === focus) d.classList.add('is-on');
            else d.classList.remove('is-on');
        });
    }

    /* 切换：唯一改状态的入口 */
    function go(delta) {
        var next = (focus + delta) % total;
        if (next < 0) next += total;
        focus = next;
        layout();
    }
    function goTo(i) {
        if (i === focus) return;
        focus = ((i % total) + total) % total;
        layout();
    }

    /* ---- 圆点 ---- */
    for (var i = 0; i < total; i++) {
        var b = document.createElement('button');
        b.className = 'dot';
        b.type = 'button';
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 个：' + (cards[i].querySelector('.nm') || {}).textContent);
        (function (idx) {
            b.addEventListener('click', function () { goTo(idx); });
        })(i);
        dotBox.appendChild(b);
    }

    /* ---- 按钮 ---- */
    if (prevBtn) prevBtn.addEventListener('click', function () { go(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function () { go(1); });

    /* ---- 键盘 ---- */
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') go(-1);
        else if (e.key === 'ArrowRight') go(1);
        else if (e.key === 'Enter' && document.activeElement === document.body) {
            var main = cards[focus];
            if (main) window.location.href = main.getAttribute('href');
        }
    });

    /* =========================================================
       点击：
         主卡 → 不拦截，交给原生 <a href> 跳转（最可靠）
         侧卡 → 拦截默认跳转，只切到它
       ========================================================= */
    cards.forEach(function (card, i) {
        card.addEventListener('click', function (e) {
            if (i === focus) return;          // 主卡：走浏览器默认跳转
            e.preventDefault();
            goTo(i);
        });
    });

    /* ---- 视口变化重排 ---- */
    var rtimer = null;
    window.addEventListener('resize', function () {
        clearTimeout(rtimer);
        rtimer = setTimeout(layout, 120);
    });

    /* ---- 首次布局 + 入场 ---- */
    layout();

    var riseEls = Array.prototype.slice.call(document.querySelectorAll('.rise'));
    var t = 0;
    riseEls.forEach(function (el) {
        (function (node, delay) {
            setTimeout(function () { node.classList.add('up'); }, delay);
        })(el, t);
        t += 130;
    });

    setTimeout(layout, 60);
})();
</script>

</body>
</html>
