<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AJX 入口">
<title>AJX · 入口</title>
<link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
<link rel="icon" href="./favicon.ico">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #0b0e14;
        overflow-x: hidden;          /* 任何时候都不许横向滚动 */
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        position: relative;
        -webkit-tap-highlight-color: transparent;
        background:
            radial-gradient(ellipse 60% 50% at 18% 18%, rgba(3,169,244,.16), transparent 60%),
            radial-gradient(ellipse 55% 45% at 82% 26%, rgba(244,65,165,.14), transparent 60%),
            radial-gradient(ellipse 60% 50% at 50% 92%, rgba(0,255,157,.12), transparent 60%),
            linear-gradient(165deg, #0b0e14 0%, #131c33 52%, #191a2b 100%);
    }

    .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
            radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.55) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 78% 32%, rgba(255,255,255,.4) 50%, transparent 51%),
            radial-gradient(1px 1px at 42% 63%, rgba(0,255,157,.45) 50%, transparent 51%),
            radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.3) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 26% 86%, rgba(255,255,255,.35) 50%, transparent 51%),
            radial-gradient(1px 1px at 62% 12%, rgba(3,169,244,.4) 50%, transparent 51%);
        animation: twinkle 7s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
        from { opacity: .45; }
        to   { opacity: .95; }
    }

    /* ============ 舞台：占满整屏，点它以外的地方都算空白 ============ */
    .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: pan-y;
    }

    /* ============ 卡片 ============ */
    .card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 168px;
        height: 220px;
        margin-left: -84px;
        margin-top: -110px;
        border-radius: 22px;
        text-decoration: none;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(24, 30, 48, .82);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        backdrop-filter: blur(16px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, .16);
        box-shadow: 0 18px 46px rgba(0, 0, 0, .5);
        overflow: hidden;
        cursor: pointer;
        transform-origin: 50% 130%;        /* B 的弧线圆心：卡片下方 */
        will-change: transform, opacity;
        backface-visibility: hidden;
        transition: transform .52s cubic-bezier(.22, .61, .36, 1),
                    opacity .4s ease,
                    box-shadow .3s ease,
                    border-color .3s ease;
    }
    .dragging .card { transition: none; }

    .card::before {
        content: "";
        position: absolute;
        top: -50px;
        right: -50px;
        width: 145px;
        height: 145px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 70%);
        pointer-events: none;
    }

    .card[data-theme="fire"]  { border-color: rgba(255, 95, 109, .5); }
    .card[data-theme="stats"] { border-color: rgba(0, 198, 255, .5); }
    .card[data-theme="heart"] { border-color: rgba(255, 125, 165, .5); }
    .card[data-theme="log"]   { border-color: rgba(61, 220, 132, .5); }
    .card[data-theme="music"] { border-color: rgba(167, 139, 250, .5); }

    .ico { width: 44px; height: 44px; display: block; }
    .ico svg { width: 100%; height: 100%; display: block; }

    .card[data-theme="fire"]  .ico { color: #ff8a80; }
    .card[data-theme="stats"] .ico { color: #80d8ff; }
    .card[data-theme="heart"] .ico { color: #ff9db9; }
    .card[data-theme="log"]   .ico { color: #8ef0b5; }
    .card[data-theme="music"] .ico { color: #c4b5fd; }

    .nm {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .05em;
        white-space: nowrap;
    }
    .card[data-theme="fire"]  .nm { color: #ff8a80; }
    .card[data-theme="stats"] .nm { color: #80d8ff; }
    .card[data-theme="heart"] .nm { color: #ff9db9; }
    .card[data-theme="log"]   .nm { color: #8ef0b5; }
    .card[data-theme="music"] .nm { color: #c4b5fd; }

    .ds {
        font-size: 10px;
        letter-spacing: .22em;
        color: rgba(255, 255, 255, .4);
        text-transform: uppercase;
    }

    /* 展开后居中那张 */
    .card.is-on {
        border-color: rgba(255, 255, 255, .62) !important;
        box-shadow: 0 26px 64px rgba(0, 0, 0, .62), 0 0 44px rgba(120, 190, 255, .22);
    }

    /* ============ 底部 ============ */
    .foot {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 13px;
        min-height: 76px;
    }
    .dots {
        display: flex;
        align-items: center;
        gap: 9px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity .4s ease .1s, transform .4s ease .1s;
        pointer-events: none;
    }
    .spread .dots { opacity: 1; transform: none; pointer-events: auto; }
    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: rgba(255, 255, 255, .22);
        cursor: pointer;
        transition: background .3s, width .3s, border-radius .3s;
        -webkit-tap-highlight-color: transparent;
    }
    .dot.is-on { width: 22px; border-radius: 4px; background: rgba(255, 255, 255, .82); }

    .hint {
        font-size: 12px;
        letter-spacing: .14em;
        color: rgba(255, 255, 255, .34);
        min-height: 18px;
    }

    .back {
        position: fixed;
        top: 20px;
        left: 18px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 15px;
        font-size: 13px;
        color: rgba(255, 255, 255, .6);
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        background: rgba(255, 255, 255, .05);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        -webkit-tap-highlight-color: transparent;
        transition: color .25s, border-color .25s, background .25s;
    }
    .back:hover { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.12); }

    @media (max-width: 480px) {
        .stage { height: 380px; }
        .card { width: 148px; height: 194px; margin-left: -74px; margin-top: -97px; border-radius: 19px; gap: 10px; }
        .ico { width: 38px; height: 38px; }
        .nm { font-size: 13.5px; }
    }

    .rise {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity .7s ease, transform .7s cubic-bezier(.19, 1, .22, 1);
    }
    .rise.up { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="stars"></div>

<a class="back rise" href="./index.html"><span>‹</span> 返回主页</a>

<div class="stage rise" id="stage">
    <a class="card" data-theme="fire" data-i="0" href="./New-Year-fireworks.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="currentColor" opacity=".92"/><path d="M18.4 13.6L18.9 16.1L21.4 16.6L18.9 17.1L18.4 19.6L17.9 17.1L15.4 16.6L17.9 16.1L18.4 13.6Z" fill="currentColor" opacity=".68"/>
            </svg>
        </span>
        <span class="nm">新年烟花</span>
        <span class="ds">New Year</span>
    </a>

    <a class="card" data-theme="stats" data-i="1" href="./ybp.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="4" width="18" height="4" rx="1.6" fill="currentColor" opacity=".92"/><rect x="3" y="11" width="18" height="4" rx="1.6" fill="currentColor" opacity=".68"/><rect x="3" y="18" width="11" height="4" rx="1.6" fill="currentColor" opacity=".45"/>
            </svg>
        </span>
        <span class="nm">站点统计</span>
        <span class="ds">Stats</span>
    </a>

    <a class="card" data-theme="heart" data-i="2" href="./heart.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
            </svg>
        </span>
        <span class="nm">心迹 Heart</span>
        <span class="ds">Heart</span>
    </a>

    <a class="card" data-theme="log" data-i="3" href="./logcatcher.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6h16M4 12h16M4 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.4" cy="18" r="1.8" fill="currentColor"/>
            </svg>
        </span>
        <span class="nm">LogCatcher</span>
        <span class="ds">Log</span>
    </a>

    <a class="card" data-theme="music" data-i="4" href="./music.html">
        <span class="ico">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18.5V5.5L20 3v13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor" opacity=".92"/><circle cx="17.5" cy="16.5" r="2.5" fill="currentColor" opacity=".92"/>
            </svg>
        </span>
        <span class="nm">停云</span>
        <span class="ds">Lounge</span>
    </a>
</div>

<div class="foot rise">
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">点一下展开</div>
</div>

<script>
(function () {
    'use strict';

    var stage = document.getElementById('stage');
    if (!stage) return;

    var cards = Array.prototype.slice.call(stage.querySelectorAll('.card'));
    var total = cards.length;
    if (!total) return;

    var dotBox = document.getElementById('dots');
    var hintEl = document.getElementById('hint');

    /* =========================================================
       state: 'folded' 扇面折叠（整块是一个按钮）
              'spread' 展开（可横滑、居中卡可点）
       ========================================================= */
    var state = 'folded';
    var index = Math.floor(total / 2);   // 默认中间那张
    var dragDX = 0;
    var dragging = false;

    /* ---------------- 尺寸 ---------------- */
    function metrics() {
        var w = window.innerWidth;
        /* 卡宽不再写死，而是让给"三张不重叠"这个硬约束：
           3 张并排需要  w >= 3*cardW + 2*gap + 16(边距)
           反解 cardW = (w - 2*gap - 16) / 3，再夹到一个好看的上限。
           这样手机上卡自动变小，但永远不会互相压住。 */
        var gapPx = w < 400 ? 10 : 14;
        var maxByFit3 = (w - 2 * gapPx - 16) / 3;
        var cardW = Math.min(w < 481 ? 150 : 172, maxByFit3);
        cardW = Math.max(cardW, 96);                       // 别小到看不清
        var cardH = Math.round(cardW * (220 / 168));        // 保持原比例

        /* 展开态：每张卡之间必须有清晰间隙，绝不重叠。
           最外侧卡（index±2）右边缘 <= w - 8
             w/2 + 2*step + cardW/2 + 8 <= w   →   step <= (w/2 - cardW/2 - 8)/2
           同时相邻卡之间留 gapPx 的空隙
             step >= cardW + gapPx
           两个条件冲突时（超窄屏）优先保证"不重叠"，
           宁可让最外侧卡略微贴边也不能压在一起。 */
        /* 不重叠口径：相邻中心距 step >= 卡宽 + 间隙 */
        var noOverlap = cardW + gapPx;

        /* 屏内可视口径：最外侧卡右边缘 <= w - 8
           若一屏放 3 张（index±1）：w/2 + step + cardW/2 + 8 <= w  →  step <= w/2 - cardW/2 - 8
           若一屏放 5 张（index±2）：w/2 + 2*step + cardW/2 + 8 <= w  →  step <= (w/2 - cardW/2 - 8)/2 */
        var fit3 = w / 2 - cardW / 2 - 8;
        var fit5 = fit3 / 2;

        var step, visible;
        if (noOverlap <= fit5) {
            step = noOverlap; visible = 5;    // 大屏：5 张全摆下
        } else {
            step = noOverlap; visible = 3;    // 常规：一屏 3 张，靠拖动换
        }

        return {
            w: w, cardW: cardW, cardH: cardH,
            step: step, visible: visible
        };
    }

    /* ---------------- 布局 ---------------- */
    function layout() {
        var m = metrics();

        if (state === 'folded') {
            /* B 的扇面：五张卡以底部为圆心，散开一个 16° 的小扇形。
               中间那张角度 0（正对用户），两侧依次 ±4°、±8°，
               层层叠压但有扇骨般的错落感 —— 不是完全重合的一沓。 */
            cards.forEach(function (c, i) {
                var off = i - index;
                off = ((off % total) + total) % total;
                if (off > total / 2) off -= total;      // 归一化到 [-2, 2]

                var deg = off * 4.5;                     // 每张差 4.5°
                var lift = Math.abs(off) * 0;            // 不额外抬升，靠旋转形成扇面
                var sc = 1 - Math.abs(off) * 0.028;
                c.style.transform =
                    'translate(0,' + lift + 'px) rotate(' + deg.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
                c.style.opacity = (1 - Math.abs(off) * 0.13).toFixed(2);
                c.style.zIndex = 30 - Math.abs(off);
                c.style.pointerEvents = 'auto';          // 整块都能点（点了只展开）
                c.classList.remove('is-on');
            });
            return;
        }

        /* 展开态：以选中卡为中心向两侧排开，间距 = 卡宽 + 间隙，绝不重叠。
           off 做环形归一化，所以首尾也能接上（拖到第 5 张右边是第 1 张）。 */
        var half = Math.floor(total / 2);
        cards.forEach(function (c, i) {
            var off = i - index;
            off = ((off % total) + total) % total;
            if (off > half) off -= total;                 // → [-2, 2]

            var x = off * m.step + dragDX;
            var inView = Math.abs(off) <= (m.visible - 1) / 2;

            var op = off === 0 ? 1 : (Math.abs(off) === 1 ? 0.82 : 0.5);

            c.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0) scale(1)';
            c.style.opacity = op.toFixed(2);
            c.style.zIndex = 50 - Math.abs(off);
            c.style.pointerEvents = 'auto';
            if (off === 0 && !dragging) c.classList.add('is-on');
            else c.classList.remove('is-on');
        });

        Array.prototype.forEach.call(dotBox.children, function (d, i) {
            if (i === index) d.classList.add('is-on');
            else d.classList.remove('is-on');
        });
    }

    /* ---------------- 展开 / 收起 ---------------- */
    function spread() {
        state = 'spread';
        document.body.classList.add('spread');
        stage.classList.add('spread');
        hintEl.textContent = '左右滑动选择 · 点中间那张进入 · 点空白收起';
        dragDX = 0;
        layout();
    }

    function fold() {
        state = 'folded';
        dragDX = 0;
        dragging = false;
        document.body.classList.remove('spread');
        stage.classList.remove('spread');
        stage.classList.remove('dragging');
        hintEl.textContent = '点一下展开';
        layout();
    }

    function goTo(i) {
        index = ((i % total) + total) % total;
        dragDX = 0;
        layout();
    }

    /* ---------------- 圆点 ---------------- */
    for (var i = 0; i < total; i++) {
        var b = document.createElement('button');
        b.className = 'dot';
        b.type = 'button';
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
        (function (idx) {
            b.addEventListener('click', function (e) {
                e.stopPropagation();
                if (state === 'folded') { spread(); return; }
                goTo(idx);
            });
        })(i);
        dotBox.appendChild(b);
    }

    /* =========================================================
       手势 + 点击
       统一用一套逻辑：
         按下记录起点
         移动超过 10px → 标记 moved（这次手势不再算点击）
         抬起时：
           - moved 且是横向拖动 → 换卡
           - 没 moved → 当成点击，按点击规则处理
       ========================================================= */
    var startX = 0, startY = 0, moved = false, lockDir = null;

    function onDown(e) {
        var p = e.touches ? e.touches[0] : e;
        startX = p.clientX;
        startY = p.clientY;
        moved = false;
        lockDir = null;
        dragDX = 0;
        if (state === 'spread') {
            dragging = true;
            stage.classList.add('dragging');
        }
    }

    function onMove(e) {
        if (!startX && !startY) return;
        var p = e.touches ? e.touches[0] : e;
        var dx = p.clientX - startX;
        var dy = p.clientY - startY;

        if (Math.abs(dx) > 10 || Math.abs(dy) > 10) moved = true;
        if (state !== 'spread') return;

        if (!lockDir) {
            if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
            lockDir = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            if (lockDir === 'y') {
                dragging = false;
                stage.classList.remove('dragging');
                return;
            }
        }
        if (lockDir !== 'x') return;

        dragDX = dx;
        layout();
        if (e.cancelable) e.preventDefault();
    }

    function onUp(e) {
        var wasSpread = (state === 'spread');
        var wasDragging = dragging;
        dragging = false;
        stage.classList.remove('dragging');

        if (wasSpread && wasDragging) {
            var m = metrics();
            var jump = Math.round(dragDX / m.step);
            if (jump !== 0) {
                index = ((index - jump) % total + total) % total;
            }
            dragDX = 0;
            layout();
        }

        if (moved) {                    // 拖过就不当点击
            startX = startY = 0;
            return;
        }

        /* ---- 没拖动 → 按点击处理 ---- */
        var t = e.target;
        var cardEl = t && t.closest ? t.closest('.card') : null;

        if (state === 'folded') {
            spread();                   // 折叠态：点哪里都只展开
        } else if (!cardEl) {
            fold();                     // 展开态：点空白 → 收起
        } else {
            var ci = parseInt(cardEl.getAttribute('data-i'), 10);
            if (ci === index) {
                window.location.href = cardEl.getAttribute('href');   // 居中卡 → 跳转
            } else {
                goTo(ci);               // 非居中卡 → 只切过去
            }
        }
        startX = startY = 0;
    }

    if (window.PointerEvent) {
        stage.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
    } else {
        stage.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        stage.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    }

    /* 卡片本身禁止默认跳转（跳转在 onUp 里手动做，保证拖动不会误触发） */
    cards.forEach(function (card) {
        card.addEventListener('click', function (e) { e.preventDefault(); });
    });

    /* 键盘 */
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { fold(); return; }
        if (state !== 'spread') {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spread(); }
            return;
        }
        if (e.key === 'ArrowLeft') goTo(index - 1);
        else if (e.key === 'ArrowRight') goTo(index + 1);
    });

    var rt = null;
    window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(layout, 120);
    });

    layout();
    var t = 0;
    Array.prototype.slice.call(document.querySelectorAll('.rise')).forEach(function (el) {
        (function (node, delay) {
            setTimeout(function () { node.classList.add('up'); }, delay);
        })(el, t);
        t += 130;
    });
    setTimeout(layout, 60);
})();
</script>

</body>
</html>
