    #weather-card-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 9999;
        width: fit-content;
        opacity: 0;
        transform: translateY(-8px);
        transition: opacity .5s, transform .5s;
    }
    #weather-card-container.show {
        opacity: 1;
        transform: translateY(0);
    }
    #weather-card-container .cardContainer {
        width: fit-content;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    #weather-card-container .card {
        position: relative;
        width: 220px;
        height: 250px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        padding: 20px 10px;
        border-radius: 10px;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        background-color: rgba(65, 65, 65, 0.308);
        border: 1px solid rgba(255, 255, 255, 0.089);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
    }
    #weather-card-container .city {
        font-weight: 700;
        font-size: 0.9em;
        letter-spacing: 1.2px;
        color: white;
    }
    #weather-card-container .weather {
        font-weight: 500;
        font-size: 0.7em;
        letter-spacing: 1.2px;
        color: rgb(197, 197, 197);
    }
    #weather-card-container .temp {
        font-size: 1.8em;
        color: white;
    }
    #weather-card-container .minmaxContainer {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    #weather-card-container .min,
    #weather-card-container .max {
        width: 50%;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        padding: 0px 20px;
        gap: 4px;
    }
    #weather-card-container .max {
        align-items: flex-start;
        border-left: 2px solid white;
    }
    #weather-card-container .maxHeading,
    #weather-card-container .minHeading {
        font-size: 0.7em;
        font-weight: 600;
        color: white;
    }
    #weather-card-container .maxTemp,
    #weather-card-container .minTemp {
        font-size: 0.6em;
        font-weight: 500;
        color: rgb(197, 197, 197);
    }
    #weather-card-container .cardContainer::before {
        width: 100px;
        height: 100px;
        content: "";
        position: absolute;
        background-color: rgb(144, 161, 255);
        z-index: -1;
        border-radius: 50%;
        left: 100px;
        top: 50px;
        transition: all 1s;
    }
    #weather-card-container .cardContainer:hover::before {
        transform: translate(-50px, 50px);
    }
    #weather-card-container .w-icon {
        width: 50px;
        height: 50px;
        color: #fff;
        margin: 4px 0;
        display: block;
    }
    #weather-card-container .m-col {
        display: contents;
    }
    #weather-card-container .chev {
        display: none;
    }
    #weather-card-container .weather-drawer {
        display: none;
    }
    @media (max-width: 768px) {
        #weather-card-container {
            top: 10px;
            right: 10px;
            left: auto;
            width: calc(100vw - 20px);
            max-width: 320px;
            transform: none;
            transform-origin: top right;
        }
        #weather-card-container.show {
            transform: none;
        }
        #weather-card-container .cardContainer {
            display: block;
            width: 100%;
        }
        #weather-card-container .card {
            width: fit-content;
            max-width: 100%;
            height: 62px;
            box-sizing: border-box;
            flex-direction: row;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 16px;
        }
        #weather-card-container .m-col {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 2px;
            min-width: 0;
        }
        #weather-card-container .city {
            font-size: 0.98em;
            margin: 0;
        }
        #weather-card-container .weather {
            font-size: 0.68em;
            margin: 0;
            letter-spacing: .4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }
        #weather-card-container .w-icon {
            width: 30px;
            height: 30px;
            margin: 0;
            flex: none;
        }
        #weather-card-container .temp {
            font-size: 1.55em;
            margin-left: auto;
            white-space: nowrap;
            line-height: 1;
        }
        #weather-card-container .minmaxContainer {
            display: none;
        }
        #weather-card-container .chev {
            display: inline-block;
            flex: none;
            font-size: 1.1em;
            line-height: 1;
            color: rgba(255,255,255,.75);
            transform: rotate(0deg);
            transition: transform .35s;
            margin-left: 2px;
            cursor: pointer;
        }
        #weather-card-container .chev.rot {
            transform: rotate(180deg);
        }
        #weather-card-container .cardContainer::before {
            display: none;
        }
        #weather-card-container .weather-drawer {
            display: block;
            width: 100%;
            box-sizing: border-box;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transform: translateY(-8px);
            margin-top: 0;
            transition: max-height .5s cubic-bezier(.19,1,.22,1), opacity .4s, transform .4s, margin-top .4s;
            background-color: rgba(65, 65, 65, 0.4);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
        }
        #weather-card-container .weather-drawer.open {
            max-height: 300px;
            opacity: 1;
            transform: translateY(0);
            margin-top: 8px;
        }
        #weather-card-container .d-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 18px;
            padding: 14px 16px;
        }
        #weather-card-container .d-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78em;
            color: rgba(255,255,255,.72);
            letter-spacing: .3px;
        }
        #weather-card-container .d-item b {
            color: #fff;
            font-weight: 600;
            font-size: 1.05em;
        }
    }
    @media (max-width: 400px) {
        #weather-card-container {
            top: 8px;
            right: 8px;
            width: calc(100vw - 16px);
            max-width: 280px;
        }
        #weather-card-container .card {
            height: 56px;
            padding: 6px 12px;
        }
        #weather-card-container .temp {
            font-size: 1.35em;
        }
        #weather-card-container .weather {
            max-width: 100px;
        }
    }
    /* ===== Uiverse 社交卡片 (from Uiverse.io by vinodjangid07) ===== */
        .uiverse-social.card {
            width: fit-content;
            height: fit-content;
            background-color: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            gap: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            border-radius: 16px;
        }
        .uiverse-social .socialContainer {
            width: 46px;
            height: 46px;
            background-color: rgba(44, 44, 44, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition-duration: 0.3s;
            border-radius: 12px;
            text-decoration: none;
            cursor: pointer;
        }
        .uiverse-social .containerOne:hover { background-color: #c71d23; transition-duration: 0.3s; }
        .uiverse-social .containerTwo:hover { background-color: #24292e; transition-duration: 0.3s; }
        .uiverse-social .containerThree:hover { background-color: #12b7f5; transition-duration: 0.3s; }
        .uiverse-social .socialContainer:active {
            transform: scale(0.9);
            transition-duration: 0.3s;
        }
        .uiverse-social .socialSvg {
            width: 17px;
            font-size: 21px;
            color: #fff;
            line-height: 1;
        }
        .uiverse-social .socialSvg path { fill: rgb(255, 255, 255); }
        .uiverse-social .socialContainer:hover .socialSvg {
            animation: slide-in-top 0.3s both;
        }
        @keyframes slide-in-top {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @media (max-width: 768px) {
            .uiverse-social.card { padding: 10px 12px; gap: 10px; border-radius: 12px; }
            .uiverse-social .socialContainer { width: 40px; height: 40px; border-radius: 10px; }
            .uiverse-social .socialSvg { font-size: 19px; }
        }
        /* ===== kirzin 流光总入口按钮 ===== */
        .hero-entry {
            position: relative;
            display: inline-block;
            padding: 0;
            margin: 0;
            border: none;
            border-radius: 30px;
            overflow: hidden;
            text-decoration: none;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(90deg, #03a9f4, #f441a5, #ffeb3b, #03a9f4);
            background-size: 300%;
            transition: all 0.3s ease;
            z-index: 1;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .hero-entry span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 15em;
            height: 3.2em;
            line-height: 1;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            border-radius: 30px;
            background: rgba(13, 17, 23, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #fff;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }
        .hero-entry::before {
            content: "";
            position: absolute;
            inset: -5px;
            border-radius: 35px;
            background: linear-gradient(90deg, #03a9f4, #f441a5, #ffeb3b, #03a9f4);
            background-size: 300%;
            filter: blur(20px);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 0;
        }
        .hero-entry:hover {
            animation: heroAni 8s linear infinite;
        }
        .hero-entry:hover::before {
            opacity: 1;
            animation: heroAni 8s linear infinite;
        }
        .hero-entry:hover span {
            color: #fff;
        }
        @keyframes heroAni {
            0% { background-position: 0%; }
            100% { background-position: 300%; }
        }
        @media (max-width: 560px) {
            .hero-entry span { width: 12em; height: 2.8em; font-size: 0.9rem; }
        }

</head>
