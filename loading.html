<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>停云 · 正在进入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#0d1117;
  color:#e6edf3;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
/* 背景星点 */
.stars{position:fixed;inset:0;pointer-events:none}
.stars i{
  position:absolute;width:2px;height:2px;border-radius:50%;
  background:#8b98a8;opacity:.5;
  animation:tw 3s ease-in-out infinite;
}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.75}}

.wrap{position:relative;text-align:center;z-index:2}

/* 球体下落 loader */
.ball{
  width:44px;height:44px;border-radius:50%;
  margin:0 auto 26px;
  background:radial-gradient(circle at 32% 30%,#7dd3fc,#3b82f6 45%,#1e3a8a 100%);
  box-shadow:0 0 26px rgba(59,130,246,.55);
  animation:drop 1.15s cubic-bezier(.34,1.3,.64,1) infinite;
}
@keyframes drop{
  0%{transform:translateY(-46px) scale(.86);opacity:.3}
  45%{transform:translateY(0) scale(1);opacity:1}
  62%{transform:translateY(0) scale(1.12,.88)}
  80%{transform:translateY(-14px) scale(.96)}
  100%{transform:translateY(-46px) scale(.86);opacity:.3}
}
/* 地面阴影 */
.shadow{
  width:52px;height:9px;border-radius:50%;
  margin:0 auto 30px;
  background:radial-gradient(ellipse,rgba(59,130,246,.42),transparent 72%);
  animation:sh 1.15s cubic-bezier(.34,1.3,.64,1) infinite;
}
@keyframes sh{
  0%{transform:scale(.55);opacity:.16}
  45%{transform:scale(1);opacity:.55}
  62%{transform:scale(1.14);opacity:.62}
  100%{transform:scale(.55);opacity:.16}
}

.title{font-size:19px;letter-spacing:.16em;font-weight:500;color:#dbe4ee}
.sub{margin-top:11px;font-size:12.5px;color:#6b7684;letter-spacing:.1em;min-height:18px}
.bar{
  margin:26px auto 0;width:150px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.08);overflow:hidden;
}
.bar i{
  display:block;height:100%;width:0;border-radius:2px;
  background:linear-gradient(90deg,#3b82f6,#7dd3fc);
  transition:width .35s ease;
}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="wrap">
  <div class="ball"></div>
  <div class="shadow"></div>
  <div class="title">停 云</div>
  <div class="sub" id="sub">站点数据加载中</div>
  <div class="bar"><i id="prog"></i></div>
</div>

<script>
(function(){
  var API = 'https://ajx-stats.haiteluo.xyz';
  var sub = document.getElementById('sub');
  var prog = document.getElementById('prog');

  /* 星点 */
  (function(){
    var box = document.getElementById('stars');
    for (var i = 0; i < 46; i++) {
      var s = document.createElement('i');
      s.style.left = (Math.random()*100).toFixed(2) + '%';
      s.style.top = (Math.random()*100).toFixed(2) + '%';
      s.style.animationDelay = (Math.random()*3).toFixed(2) + 's';
      box.appendChild(s);
    }
  })();

  function setSub(t){ if (sub) sub.textContent = t; }
  function setProg(p){ if (prog) prog.style.width = p + '%'; }

  var t0 = Date.now();
  var RELOAD_KEY = 'ajx_ld_reload';
  var CACHE_KEY  = 'ajx_dev_cache';

  /* 跳转，带最小停留时长让动画看得见 */
  function go(){
    var wait = Math.max(0, 620 - (Date.now() - t0));
    setTimeout(function(){
      location.replace('./ybp.html');
    }, wait);
  }

  setProg(18);

  /* 读已有的缓存（同会话内二次进入直接跳） */
  try {
    var cached = sessionStorage.getItem(CACHE_KEY);
    if (cached) {
      setSub('正在进入');
      setProg(100);
      go();
      return;
    }
  } catch (e) {}

  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 3200);

  setProg(34);

  fetch(API + '/whoami', {
    credentials: 'include',
    cache: 'no-store',
    signal: ctrl ? ctrl.signal : undefined
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    clearTimeout(timer);
    setProg(72);
    var model = (d && d.model) || '';
    var pv    = (d && d.platformVersion) || '';
    var pnm   = (d && d.platformName) || '';

    if (model || pv) {
      /* 拿到型号 —— 存下来，跳转后 ybp.html 直接用 */
      try {
        sessionStorage.setItem(CACHE_KEY, JSON.stringify({
          model: model,
          modelName: (d && d.modelName) || '',
          pv: pv,
          platform: pnm,
          t: Date.now()
        }));
        sessionStorage.removeItem(RELOAD_KEY);
      } catch (e) {}
      setSub('识别完成');
      setProg(100);
      go();
    } else {
      /* 首次没拿到 —— 说明 Accept-CH 刚下发，reload 一次即可拿到 */
      var done = false;
      try { done = sessionStorage.getItem(RELOAD_KEY) === '1'; } catch (e) {}
      if (!done) {
        try { sessionStorage.setItem(RELOAD_KEY, '1'); } catch (e) {}
        setSub('正在识别设备');
        setProg(52);
        setTimeout(function(){ location.reload(); }, 260);
      } else {
        /* reload 过了还是没有 —— 放弃，直接进页面，别卡住用户 */
        try { sessionStorage.removeItem(RELOAD_KEY); } catch (e) {}
        setSub('正在进入');
        setProg(100);
        go();
      }
    }
  })
  .catch(function(){
    clearTimeout(timer);
    setSub('正在进入');
    setProg(100);
    go();
  });
})();
</script>
</body>
</html>
