<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="description" content="AJX 入口">
<title>AJX · 入口</title>
<link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
<link rel="icon" href="./favicon.ico">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        width: 100%;
        min-height: 100%;
        background: #0b0e14;
        /* 关键：任何时候都不许横向滚动 */
        overflow-x: hidden;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100svh;
        position: relative;
        -webkit-tap-highlight-color: transparent;
        background:
            radial-gradient(ellipse 60% 50% at 18% 18%, rgba(3,169,244,.16), transparent 60%),
            radial-gradient(ellipse 55% 45% at 82% 26%, rgba(244,65,165,.14), transparent 60%),
            radial-gradient(ellipse 60% 50% at 50% 92%, rgba(0,255,157,.12), transparent 60%),
            linear-gradient(165deg, #0b0e14 0%, #131c33 52%, #191a2b 100%);
    }

    /* 背景星点 */
    .stars {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        background-image:
            radial-gradient(1px 1px at 12% 22%, rgba(255,255,255,.55) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 78% 32%, rgba(255,255,255,.4) 50%, transparent 51%),
            radial-gradient(1px 1px at 42% 63%, rgba(0,255,157,.45) 50%, transparent 51%),
            radial-gradient(1px 1px at 88% 78%, rgba(255,255,255,.3) 50%, transparent 51%),
            radial-gradient(1.4px 1.4px at 26% 86%, rgba(255,255,255,.35) 50%, transparent 51%),
            radial-gradient(1px 1px at 62% 12%, rgba(3,169,244,.4) 50%, transparent 51%);
        animation: twinkle 7s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
        from { opacity: .45; }
        to   { opacity: .95; }
    }

    /* ============ 舞台 ============ */
    .stage {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 380px;
        display: flex;
        align-items: center;
        justify-content: center;
        /* 只接收纵向手势，横向留给卡片拖动 */
        touch-action: pan-y;
    }
    .stage.grab { cursor: grab; }
    .stage.grabbing { cursor: grabbing; }

    /* ============ 卡片 ============ */
    .card {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 172px;
        height: 228px;
        margin-left: -86px;
        margin-top: -114px;
        border-radius: 22px;
        text-decoration: none;
        color: #fff;
        background: rgba(20, 26, 42, .72);
        -webkit-backdrop-filter: blur(16px) saturate(150%);
        backdrop-filter: blur(16px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, .16);
        box-shadow: 0 18px 46px rgba(0, 0, 0, .5);
        overflow: hidden;
        cursor: pointer;
        transform-origin: 50% 50%;
        will-change: transform, opacity;
        backface-visibility: hidden;
        transition: transform .46s cubic-bezier(.22, .61, .36, 1),
                    opacity .46s ease,
                    box-shadow .3s ease,
                    border-color .3s ease;
    }
    /* 拖动中即时跟随，不要过渡 */
    .stage.dragging .card { transition: none; }

    .face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 13px;
        padding: 18px 12px;
    }

    /* 卡面右上角高光 */
    .card::before {
        content: "";
        position: absolute;
        top: -50px;
        right: -50px;
        width: 145px;
        height: 145px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, .18), transparent 70%);
        pointer-events: none;
    }

    /* 叠放时露出的边缘，做出"一沓卡"的厚度 */
    .edge {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        border: 1px solid rgba(255, 255, 255, .1);
        pointer-events: none;
        opacity: 0;
        transition: opacity .35s ease;
    }
    .folded .edge { opacity: 1; }

    /* 主题色 */
    .card[data-theme="fire"]  { border-color: rgba(255, 95, 109, .5); }
    .card[data-theme="stats"] { border-color: rgba(0, 198, 255, .5); }
    .card[data-theme="heart"] { border-color: rgba(255, 125, 165, .5); }
    .card[data-theme="log"]   { border-color: rgba(61, 220, 132, .5); }
    .card[data-theme="music"] { border-color: rgba(167, 139, 250, .5); }

    .ico { width: 46px; height: 46px; display: block; }
    .ico svg { width: 100%; height: 100%; display: block; }

    .card[data-theme="fire"]  .ico { color: #ff8a80; }
    .card[data-theme="stats"] .ico { color: #80d8ff; }
    .card[data-theme="heart"] .ico { color: #ff9db9; }
    .card[data-theme="log"]   .ico { color: #8ef0b5; }
    .card[data-theme="music"] .ico { color: #c4b5fd; }

    .nm {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: .05em;
        white-space: nowrap;
    }
    .card[data-theme="fire"]  .nm { color: #ff8a80; }
    .card[data-theme="stats"] .nm { color: #80d8ff; }
    .card[data-theme="heart"] .nm { color: #ff9db9; }
    .card[data-theme="log"]   .nm { color: #8ef0b5; }
    .card[data-theme="music"] .nm { color: #c4b5fd; }

    .ds {
        font-size: 10px;
        letter-spacing: .22em;
        color: rgba(255, 255, 255, .4);
        text-transform: uppercase;
    }

    /* 展开后当前选中的那张 */
    .card.is-on {
        border-color: rgba(255, 255, 255, .62) !important;
        box-shadow: 0 26px 64px rgba(0, 0, 0, .62), 0 0 44px rgba(120, 190, 255, .2);
    }

    /* ============ 控制区 ============ */
    .controls {
        position: relative;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: 6px;
        min-height: 84px;
    }
    .dots {
        display: flex;
        align-items: center;
        gap: 9px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity .4s ease, transform .4s ease;
        pointer-events: none;
    }
    .spread .dots { opacity: 1; transform: none; pointer-events: auto; }
    .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        border: none;
        padding: 0;
        background: rgba(255, 255, 255, .22);
        cursor: pointer;
        transition: background .3s, width .3s, border-radius .3s;
        -webkit-tap-highlight-color: transparent;
    }
    .dot.is-on {
        width: 22px;
        border-radius: 4px;
        background: rgba(255, 255, 255, .82);
    }

    .hint {
        font-size: 12px;
        letter-spacing: .14em;
        color: rgba(255, 255, 255, .34);
        text-align: center;
        min-height: 18px;
        transition: color .3s;
    }

    /* 返回按钮 */
    .back {
        position: fixed;
        top: 20px;
        left: 18px;
        z-index: 5;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 15px;
        font-size: 13px;
        color: rgba(255, 255, 255, .6);
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, .14);
        border-radius: 999px;
        background: rgba(255, 255, 255, .05);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        -webkit-tap-highlight-color: transparent;
        transition: color .25s, border-color .25s, background .25s;
    }
    .back:hover { color: #fff; border-color: rgba(255,255,255,.4); background: rgba(255,255,255,.12); }

    /* 收起按钮：展开后出现在顶部 */
    .fold {
        position: fixed;
        top: 20px;
        right: 18px;
        z-index: 5;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, .14);
        background: rgba(255, 255, 255, .05);
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        color: rgba(255, 255, 255, .7);
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transform: scale(.85);
        -webkit-tap-highlight-color: transparent;
        transition: opacity .35s ease, transform .35s ease, background .25s;
    }
    .spread .fold { opacity: 1; pointer-events: auto; transform: none; }

    /* 移动端微调 */
    @media (max-width: 480px) {
        .stage { height: 340px; }
        .card { width: 150px; height: 200px; margin-left: -75px; margin-top: -100px; border-radius: 19px; }
        .ico { width: 40px; height: 40px; }
        .nm { font-size: 14px; }
    }

    /* 入场浮现 */
    .rise {
        opacity: 0;
        transform: translateY(24px);
        transition: opacity .7s ease, transform .7s cubic-bezier(.19, 1, .22, 1);
    }
    .rise.up { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div class="stars"></div>

<a class="back rise" href="./index.html"><span>‹</span> 返回主页</a>
<button class="fold" id="fold" type="button" aria-label="收起卡片">⌄</button>

<div class="stage rise folded" id="stage">
    <a class="card" data-theme="fire" data-i="0" href="./New-Year-fireworks.html">
        <span class="face">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L13.5 8.5L20 10L13.5 11.5L12 18L10.5 11.5L4 10L10.5 8.5L12 2Z" fill="currentColor" opacity=".92"/><path d="M18.4 13.6L18.9 16.1L21.4 16.6L18.9 17.1L18.4 19.6L17.9 17.1L15.4 16.6L17.9 16.1L18.4 13.6Z" fill="currentColor" opacity=".68"/>
                </svg>
            </span>
            <span class="nm">新年烟花</span>
            <span class="ds">New Year</span>
        </span>
        <span class="edge"></span>
    </a>

    <a class="card" data-theme="stats" data-i="1" href="./ybp.html">
        <span class="face">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="4" width="18" height="4" rx="1.6" fill="currentColor" opacity=".92"/><rect x="3" y="11" width="18" height="4" rx="1.6" fill="currentColor" opacity=".68"/><rect x="3" y="18" width="11" height="4" rx="1.6" fill="currentColor" opacity=".45"/>
                </svg>
            </span>
            <span class="nm">站点统计</span>
            <span class="ds">Stats</span>
        </span>
        <span class="edge"></span>
    </a>

    <a class="card" data-theme="heart" data-i="2" href="./heart.html">
        <span class="face">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z" fill="currentColor"/>
                </svg>
            </span>
            <span class="nm">心迹 Heart</span>
            <span class="ds">Heart</span>
        </span>
        <span class="edge"></span>
    </a>

    <a class="card" data-theme="log" data-i="3" href="./logcatcher.html">
        <span class="face">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4 6h16M4 12h16M4 18h9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="18.4" cy="18" r="1.8" fill="currentColor"/>
                </svg>
            </span>
            <span class="nm">LogCatcher</span>
            <span class="ds">Log</span>
        </span>
        <span class="edge"></span>
    </a>

    <a class="card" data-theme="music" data-i="4" href="./music.html">
        <span class="face">
            <span class="ico">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 18.5V5.5L20 3v13.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18.5" r="2.5" fill="currentColor" opacity=".92"/><circle cx="17.5" cy="16.5" r="2.5" fill="currentColor" opacity=".92"/>
                </svg>
            </span>
            <span class="nm">停云</span>
            <span class="ds">Lounge</span>
        </span>
        <span class="edge"></span>
    </a>
</div>

<div class="controls rise">
    <div class="dots" id="dots"></div>
    <div class="hint" id="hint">点一下展开</div>
</div>

<script>
(function () {
    'use strict';

    var stage = document.getElementById('stage');
    if (!stage) return;

    var cards = Array.prototype.slice.call(stage.querySelectorAll('.card'));
    var total = cards.length;
    if (!total) return;

    var dotBox = document.getElementById('dots');
    var hintEl = document.getElementById('hint');
    var foldBtn = document.getElementById('fold');

    /* =========================================================
       两个状态：
         folded  叠着，整叠是一个按钮
         spread  展开，可横滑，选中卡可点
       索引 index 只在 spread 时有意义
       ========================================================= */
    var state = 'folded';
    var index = 2;            // 默认选中正中间那张
    var dragDX = 0;           // 拖动中的位移
    var dragging = false;

    /* ---------- 尺寸 ---------- */
    function metrics() {
        var w = window.innerWidth;
        var small = w < 481;
        // 超窄屏单独降一档，否则 index±2 的两张卡挤不下
        var tiny = w < 345;
        var cardW = tiny ? 128 : (small ? 150 : 172);
        var cardH = tiny ? 172 : (small ? 200 : 228);
        // 展开时卡与卡的水平间距：保证最外侧不出屏
        // 最外侧中心 = w/2 + 2*step，要求 w/2 + 2*step + cardW/2 <= w - 8
        // 间距上限：最外侧卡（index±2）右边缘必须留在屏内
        var step = (w / 2 - cardW / 2 - 8) / 2;
        // 间距下限：至少留一点错位，让人看得出是排开的（不能为负）
        step = Math.max(step, Math.min(cardW * 0.72, w * 0.14));
        return { w: w, cardW: cardW, cardH: cardH, step: step, small: small };
    }

    /* ---------- 布局 ---------- */
    function layout() {
        var m = metrics();

        if (state === 'folded') {
            /* 叠放：每张往上挪一点点、缩一点点，形成一沓
               最上面那张始终是 index 对应的卡 */
            var order = [];
            for (var k = 0; k < total; k++) {
                order.push((index + k) % total);      // index 在最底，往后依次压上去
            }
            order.forEach(function (ci, layer) {
                var c = cards[ci];
                var lift = layer * 7;                  // 每层上移
                var sc = 1 - layer * 0.035;
                c.style.transform = 'translateY(' + (-lift) + 'px) scale(' + sc.toFixed(3) + ')';
                c.style.opacity = (1 - layer * 0.1).toFixed(2);
                c.style.zIndex = 10 + layer;
                c.style.pointerEvents = (layer === total - 1) ? 'auto' : 'none';
                c.classList.remove('is-on');
            });
        } else {
            /* 展开：以选中卡为中心排开，拖动时叠加 dragDX */
            cards.forEach(function (c, i) {
                var off = i - index;
                var x = off * m.step + dragDX;
                var abs = Math.abs(off + dragDX / m.step);
                var sc = 1 - Math.min(abs, 2) * 0.06;
                c.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,0) scale(' + sc.toFixed(3) + ')';
                c.style.opacity = (off === 0 && !dragging) ? 1 : (Math.abs(off) <= 1 ? '.82' : '.55');
                c.style.zIndex = 50 - Math.abs(off);
                c.style.pointerEvents = 'auto';
                if (off === 0 && !dragging) c.classList.add('is-on');
                else c.classList.remove('is-on');
            });
        }

        // 圆点
        Array.prototype.forEach.call(dotBox.children, function (d, i) {
            if (i === index) d.classList.add('is-on');
            else d.classList.remove('is-on');
        });
    }

    /* ---------- 展开 / 收起 ---------- */
    function spread() {
        state = 'spread';
        stage.classList.remove('folded');
        stage.classList.add('spread');
        document.body.classList.add('spread');
        hintEl.textContent = '左右滑动选择 · 点中间那张进入';
        dragDX = 0;
        layout();
    }

    function fold() {
        state = 'folded';
        dragDX = 0;
        stage.classList.remove('spread');
        stage.classList.add('folded');
        document.body.classList.remove('spread');
        hintEl.textContent = '点一下展开';
        layout();
    }

    /* ---------- 选到某一张 ---------- */
    function goTo(i) {
        index = ((i % total) + total) % total;
        dragDX = 0;
        layout();
    }

    /* ---------- 圆点 ---------- */
    for (var i = 0; i < total; i++) {
        var b = document.createElement('button');
        b.className = 'dot';
        b.type = 'button';
        b.setAttribute('aria-label', '第 ' + (i + 1) + ' 张');
        (function (idx) {
            b.addEventListener('click', function (e) {
                e.stopPropagation();
                if (state === 'folded') { spread(); return; }
                goTo(idx);
            });
        })(i);
        dotBox.appendChild(b);
    }

    /* =========================================================
       点击
       ========================================================= */
    cards.forEach(function (card, i) {
        card.addEventListener('click', function (e) {
            if (state === 'folded') {
                /* 叠着时：任何位置点击都只做"展开"，绝不跳转 */
                e.preventDefault();
                spread();
                return;
            }
            /* 展开时：
               - 点的是当前选中那张 → 放行，走原生 <a href> 跳转
               - 点的是别张 → 只把它选过来，不跳 */
            if (i !== index) {
                e.preventDefault();
                goTo(i);
            }
        });
    });

    /* 折叠态下点空白处也能展开（提升命中率） */
    stage.addEventListener('click', function (e) {
        if (state === 'folded' && !e.target.closest('.card')) {
            spread();
        }
    });

    /* 收起按钮 */
    if (foldBtn) foldBtn.addEventListener('click', function (e) {
        e.preventDefault();
        fold();
    });

    /* =========================================================
       左右拖动（仅在展开态）
       ========================================================= */
    var startX = 0, startY = 0, decided = false, lockDir = null;

    function onDown(e) {
        if (state !== 'spread') return;
        var p = e.touches ? e.touches[0] : e;
        startX = p.clientX;
        startY = p.clientY;
        dragging = true;
        decided = false;
        lockDir = null;
        dragDX = 0;
        stage.classList.add('dragging');
    }

    function onMove(e) {
        if (!dragging || state !== 'spread') return;
        var p = e.touches ? e.touches[0] : e;
        var dx = p.clientX - startX;
        var dy = p.clientY - startY;

        if (!decided) {
            if (Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
            decided = true;
            lockDir = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            if (lockDir === 'y') {           // 纵向手势交还页面
                dragging = false;
                stage.classList.remove('dragging');
                return;
            }
        }
        if (lockDir !== 'x') return;

        var m = metrics();
        dragDX = dx;
        // 阻尼：拖到最外侧之外时减速
        layout();
        if (e.cancelable) e.preventDefault();
    }

    function onUp() {
        if (!dragging) return;
        dragging = false;
        stage.classList.remove('dragging');
        var m = metrics();
        var move = Math.round(dragDX / m.step);
        if (move !== 0) {
            var next = index - move;         // 往左拖 → 看右边的卡
            index = ((next % total) + total) % total;
        }
        dragDX = 0;
        layout();
    }

    if (window.PointerEvent) {
        stage.addEventListener('pointerdown', onDown);
        window.addEventListener('pointermove', onMove, { passive: false });
        window.addEventListener('pointerup', onUp);
        window.addEventListener('pointercancel', onUp);
    } else {
        stage.addEventListener('touchstart', onDown, { passive: true });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);
        stage.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
    }

    /* 键盘 */
    window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { fold(); return; }
        if (state !== 'spread') {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); spread(); }
            return;
        }
        if (e.key === 'ArrowLeft') goTo(index - 1);
        else if (e.key === 'ArrowRight') goTo(index + 1);
    });

    /* 视口变化 */
    var rt = null;
    window.addEventListener('resize', function () {
        clearTimeout(rt);
        rt = setTimeout(layout, 120);
    });

    /* 首次布局 + 入场 */
    layout();
    var t = 0;
    Array.prototype.slice.call(document.querySelectorAll('.rise')).forEach(function (el) {
        (function (node, delay) {
            setTimeout(function () { node.classList.add('up'); }, delay);
        })(el, t);
        t += 130;
    });
    setTimeout(layout, 60);
})();
</script>

</body>
</html>
