<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<link rel="manifest" href="./manifest-music.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="停云">
<title>停云 · TIME LOUNGE</title>
<style>
/* ============ 停云 TIME LOUNGE · 重写版 ============ */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height:100%; width:100%;
  overflow:hidden; overscroll-behavior:none;
  background:#080b11;
}

body {
  color:#e9eef7;
  font-family:'Helvetica Neue','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  position:fixed; inset:0;
}

/* ---------- 背景层 ---------- */
#bg {
  position:fixed; inset:0; z-index:0;
  display:block; pointer-events:none;
}

/* 背景只有一个很淡的渐变罩，不做任何模糊 */
#veil {
  position:fixed; inset:0; z-index:1;
  pointer-events:none;
  background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 32%, rgba(3,5,9,.34) 78%, rgba(2,3,6,.62) 100%);
  transition:background 1.2s ease;
}

/* ---------- 主舞台 ---------- */
#stage {
  position:fixed; inset:0; z-index:3;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:max(20px, env(safe-area-inset-top)) 22px max(20px, env(safe-area-inset-bottom));
}

/* ============ 核心：单句歌词 ============ */
#lyricBox {
  flex:1 1 auto;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  width:100%; min-height:0;
  text-align:center;
  position:relative;
}

/* 歌词区上下渐隐遮罩，让前后句自然消失 */
#lyricBox::before,
#lyricBox::after {
  content:''; position:absolute; left:0; right:0; height:22%;
  pointer-events:none; z-index:2;
}
#lyricBox::before { top:0; background:linear-gradient(180deg, rgba(8,11,17,.92), rgba(8,11,17,0)); }
#lyricBox::after { bottom:0; background:linear-gradient(0deg, rgba(8,11,17,.92), rgba(8,11,17,0)); }

#lyricNow {
  position:relative; z-index:3;
  font-size:clamp(19px, 5.2vw, 34px);
  font-weight:500;
  line-height:1.55;
  letter-spacing:.04em;
  color:#ffffff;
  max-width:min(760px, 88vw);
  text-wrap:balance;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .42s ease, transform .42s cubic-bezier(.22,1,.36,1);
  will-change:opacity, transform;
}
#lyricNow.show { opacity:1; transform:translateY(0); }

/* 上一句（很淡，在上方） */
#lyricPrev {
  position:absolute; z-index:1;
  top:16%; left:50%; transform:translateX(-50%);
  font-size:clamp(13px, 3.4vw, 19px);
  font-weight:400; line-height:1.5;
  color:rgba(190,208,236,.30);
  max-width:min(700px, 84vw);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .42s ease;
}

/* 下一句（很淡，在下方） */
#lyricNext {
  position:absolute; z-index:1;
  bottom:16%; left:50%; transform:translateX(-50%);
  font-size:clamp(13px, 3.4vw, 19px);
  font-weight:400; line-height:1.5;
  color:rgba(190,208,236,.30);
  max-width:min(700px, 84vw);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:opacity .42s ease;
}

/* 译文（当前句下方一行） */
#lyricSub {
  position:absolute; z-index:3;
  top:calc(50% + clamp(26px, 6vw, 42px));
  left:50%; transform:translateX(-50%) translateY(6px);
  font-size:clamp(12px, 3vw, 16px);
  font-weight:300; line-height:1.5;
  letter-spacing:.05em;
  color:rgba(178,198,228,.62);
  max-width:min(700px, 86vw);
  text-wrap:balance;
  opacity:0;
  transition:opacity .42s ease, transform .42s cubic-bezier(.22,1,.36,1);
}
#lyricSub.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* 无歌词时显示歌名 */
#noLyric {
  position:relative; z-index:3;
  text-align:center;
  opacity:0; transition:opacity .5s ease;
}
#noLyric.show { opacity:1; }
#noLyric .nn { font-size:clamp(22px,6vw,40px); font-weight:300; letter-spacing:.02em; }
#noLyric .aa { margin-top:10px; font-size:clamp(12px,3vw,16px); color:rgba(170,190,220,.55); letter-spacing:.14em; }

/* ============ 顶部：时间 ============ */
#top {
  position:fixed; z-index:8;
  top:max(14px, env(safe-area-inset-top)); left:0; right:0;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}
#clock {
  font-size:clamp(15px, 4vw, 20px);
  font-weight:400;
  letter-spacing:.10em;
  color:rgba(236,244,255,.94);
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 6px rgba(0,0,0,.5);
}
#dateTxt {
  font-size:clamp(10px, 2.6vw, 12px);
  letter-spacing:.16em;
  color:rgba(190,208,232,.52);
}

/* ============ 底部：播放条 ============ */
#dock {
  position:fixed; z-index:8;
  left:50%; bottom:max(16px, env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:min(520px, calc(100vw - 28px));
  display:flex; flex-direction:column; gap:10px;
  padding:12px 14px;
  border-radius:22px;
  background:rgba(16,21,30,.62);
  border:1px solid rgba(255,255,255,.09);
  -webkit-backdrop-filter:blur(20px) saturate(1.15);
  backdrop-filter:blur(20px) saturate(1.15);
  box-shadow:0 12px 40px rgba(0,0,0,.44);
  transition:opacity .5s ease, transform .5s cubic-bezier(.22,1,.36,1);
}
body.idle #dock { opacity:0; transform:translateX(-50%) translateY(16px); pointer-events:none; }

#meta { display:flex; align-items:center; gap:10px; cursor:pointer; }
#cover {
  width:40px; height:40px; border-radius:11px;
  object-fit:cover; flex:0 0 auto;
  background:rgba(255,255,255,.06);
}
#metaTxt { min-width:0; flex:1 1 auto; }
#tName {
  font-size:14px; font-weight:500; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#tArtist {
  margin-top:3px; font-size:11px; letter-spacing:.06em;
  color:rgba(175,195,222,.58);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

#progWrap { display:flex; align-items:center; gap:9px; }
#tCur, #tDur {
  font-size:10px; color:rgba(170,190,218,.5);
  font-variant-numeric:tabular-nums; flex:0 0 auto; width:32px;
}
#tDur { text-align:right; }
#prog {
  flex:1 1 auto; height:16px; display:flex; align-items:center;
  cursor:pointer; touch-action:none;
}
#progTrack {
  position:relative; width:100%; height:3px; border-radius:99px;
  background:rgba(255,255,255,.14); overflow:hidden;
}
#progFill {
  position:absolute; left:0; top:0; bottom:0; width:0%;
  border-radius:99px;
  background:linear-gradient(90deg, #7aa2ff, #b8d0ff);
}

#ctrl { display:flex; align-items:center; justify-content:center; gap:clamp(12px,4vw,22px); }
.pc {
  border:none; background:transparent; color:rgba(214,228,255,.72);
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; flex:0 0 auto;
  transition:color .22s, background .22s, transform .18s;
}
.pc svg { width:18px; height:18px; display:block; }
.pc:active { transform:scale(.9); }
.pc.act { color:#9ec0ff; }
.pc.main {
  width:46px; height:46px;
  background:rgba(255,255,255,.10);
  color:#fff;
}
.pc.main svg { width:20px; height:20px; }

/* ============ 右上角功能按钮 ============ */
#corner {
  position:fixed; z-index:9;
  top:max(12px, env(safe-area-inset-top)); right:14px;
  display:flex; gap:7px;
  transition:opacity .5s ease;
}
body.idle #corner { opacity:0; pointer-events:none; }
.ib {
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.10);
  color:rgba(214,228,255,.76); cursor:pointer;
  transition:background .22s, color .22s, transform .18s;
}
.ib svg { width:16px; height:16px; display:block; }
.ib:active { transform:scale(.9); }
.ib.act { background:rgba(122,162,255,.26); color:#fff; border-color:rgba(150,190,255,.45); }

/* ============ 场景面板 ============ */
#panel {
  position:fixed; z-index:20;
  top:max(54px, calc(env(safe-area-inset-top) + 44px)); right:14px;
  width:236px; padding:13px;
  border-radius:18px;
  background:rgba(18,23,33,.94);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 46px rgba(0,0,0,.6);
  opacity:0; transform:translateY(-8px) scale(.97);
  pointer-events:none;
  transition:opacity .24s ease, transform .24s cubic-bezier(.22,1,.36,1);
}
#panel.open { opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
.pTitle {
  font-size:10px; letter-spacing:.18em; color:#8fa3bb;
  text-transform:uppercase; margin:0 0 9px 3px;
}
.pGrid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.pItem {
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:10px 4px 8px; border-radius:12px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.07);
  color:#c8d6e8; font-size:11px; cursor:pointer;
  transition:background .2s, border-color .2s, color .2s;
}
.pItem.act { background:rgba(122,162,255,.22); border-color:rgba(150,190,255,.5); color:#fff; }
.pItem span { font-size:10px; letter-spacing:.04em; }

/* 音量 */
.pVol { display:flex; align-items:center; gap:9px; margin-top:11px; padding:0 3px; }
.pVol span { font-size:10px; color:#8fa3bb; letter-spacing:.1em; flex:0 0 auto; }
#volRange {
  flex:1 1 auto; -webkit-appearance:none; appearance:none;
  height:3px; border-radius:99px; outline:none;
  background:rgba(255,255,255,.16);
}
#volRange::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:13px; height:13px; border-radius:50%;
  background:#b8d0ff; cursor:pointer;
}
#volRange::-moz-range-thumb {
  width:13px; height:13px; border:none; border-radius:50%;
  background:#b8d0ff; cursor:pointer;
}

/* ============ 横幅提示 ============ */
#toast {
  position:fixed; z-index:40;
  left:50%; bottom:120px;
  transform:translate(-50%,10px);
  padding:9px 17px; border-radius:12px;
  font-size:12.5px; color:#e9f1fb;
  background:rgba(22,28,40,.94);
  border:1px solid rgba(255,255,255,.12);
  opacity:0; pointer-events:none;
  transition:.3s;
  max-width:calc(100vw - 40px); text-align:center;
}
#toast.show { opacity:1; transform:translate(-50%,0); }

/* ============ 歌单抽屉 ============ */
#list {
  position:fixed; z-index:30;
  left:50%; bottom:0;
  width:min(520px, 100vw);
  max-height:68vh;
  transform:translate(-50%, 100%);
  border-radius:22px 22px 0 0;
  background:rgba(16,21,30,.97);
  border:1px solid rgba(255,255,255,.10); border-bottom:none;
  box-shadow:0 -16px 50px rgba(0,0,0,.6);
  display:flex; flex-direction:column;
  transition:transform .42s cubic-bezier(.19,1,.22,1);
  padding-bottom:env(safe-area-inset-bottom);
}
#list.open { transform:translate(-50%, 0); }
.lHead {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px 10px;
}
.lHead .lh { font-size:12px; letter-spacing:.16em; color:#8fa3bb; }
.lHead .lc { font-size:12px; color:#8fa3bb; cursor:pointer; padding:4px 8px; }
.lBody { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 8px 12px; }
.lItem {
  display:flex; align-items:center; gap:10px;
  padding:9px 10px; border-radius:11px;
  cursor:pointer;
  transition:background .2s;
}
.lItem.act { background:rgba(122,162,255,.16); }
.lItem img { width:36px; height:36px; border-radius:9px; object-fit:cover; flex:0 0 auto; }
.lItem .lt { min-width:0; flex:1 1 auto; }
.lItem .ln { font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lItem .la { font-size:11px; color:rgba(175,195,222,.55); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ============ 横屏布局 ============ */
@media (orientation: landscape) and (max-height: 560px) {
  #lyricNow { font-size:clamp(16px, 3.6vh, 26px); max-width:74vw; }
  #lyricPrev, #lyricNext { font-size:clamp(11px, 2.4vh, 15px); }
  #lyricSub { font-size:clamp(11px, 2.2vh, 14px); top:calc(50% + 30px); }
  #lyricPrev { top:12%; }
  #lyricNext { bottom:12%; }
  #dock { width:min(440px, 62vw); padding:9px 12px; bottom:max(8px, env(safe-area-inset-bottom)); }
  #cover { width:32px; height:32px; border-radius:9px; }
  #tName { font-size:12.5px; }
  #tArtist { font-size:10px; }
  .pc.main { width:40px; height:40px; }
  #ctrl { gap:12px; }
  #top { padding:0 14px; }
  #panel { top:max(46px, calc(env(safe-area-inset-top) + 38px)); }
}

/* ============ 极窄屏 ============ */
@media (max-width: 360px) {
  #lyricNow { font-size:18px; }
  #dock { padding:10px 11px; }
  #ctrl { gap:9px; }
  .pc { width:30px; height:30px; }
  .pc.main { width:42px; height:42px; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition-duration:.01ms !important; animation-duration:.01ms !important; }
}

</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="veil"></div>

<div id="stage">
  <div id="lyricBox">
    <div id="lyricPrev"></div>
    <div id="lyricNow"></div>
    <div id="lyricSub"></div>
    <div id="lyricNext"></div>
    <div id="noLyric">
      <div class="nn">停云</div>
      <div class="aa">TIME LOUNGE</div>
    </div>
  </div>
</div>

<div id="top">
  <div id="clock">--:--</div>
  <div id="dateTxt"></div>
</div>

<div id="corner">
  <button class="ib" id="btnScene" title="场景">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2"/><path d="M4.5 8.5h2.2l1.4-2h7.8l1.4 2h2.2a1.6 1.6 0 0 1 1.6 1.6v8.3a1.6 1.6 0 0 1-1.6 1.6H4.5a1.6 1.6 0 0 1-1.6-1.6V10.1a1.6 1.6 0 0 1 1.6-1.6z" transform="translate(0,-1.6)"/>
    </svg>
  </button>
  <button class="ib" id="btnList" title="歌单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="7" x2="15" y2="7"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17" x2="11" y2="17"/><circle cx="18" cy="16" r="2.6"/><path d="M20.6 16V8.4"/>
    </svg>
  </button>
  <button class="ib" id="btnFs" title="全屏">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
    </svg>
  </button>
</div>

<div id="panel">
  <div class="pTitle">环境场景</div>
  <div class="pGrid">
    <div class="pItem" data-scene="rain"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 14a4 4 0 0 1 .6-7.96A5.2 5.2 0 0 1 17.6 7.5 3.6 3.6 0 0 1 17.4 14"/><line x1="8" y1="17" x2="7" y2="20"/><line x1="12" y1="17" x2="11" y2="20"/><line x1="16" y1="17" x2="15" y2="20"/></svg><span>雨夜</span></div>
    <div class="pItem" data-scene="fire"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 4.2 5 8.6a5 5 0 0 1-10 0C7 8.4 12 3 12 3z"/><path d="M12 12.5a2 2 0 0 0-2 2 2 2 0 0 0 4 0 2 2 0 0 0-2-2z"/></svg><span>火堆</span></div>
    <div class="pItem" data-scene="waves"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 8.5c2.2 0 2.2 2 4.4 2s2.2-2 4.4-2 2.2 2 4.4 2 2.2-2 4.4-2"/><path d="M2 13.5c2.2 0 2.2 2 4.4 2s2.2-2 4.4-2 2.2 2 4.4 2 2.2-2 4.4-2"/><path d="M2 18.5c2.2 0 2.2 2 4.4 2s2.2-2 4.4-2 2.2 2 4.4 2 2.2-2 4.4-2"/></svg><span>海浪</span></div>
    <div class="pItem" data-scene="forest"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l6 8.5h-3.4l4.4 6H5l4.4-6H6z"/><line x1="12" y1="17" x2="12" y2="21.5"/></svg><span>林间</span></div>
  </div>
  <div class="pVol">
    <span>音量</span>
    <input type="range" id="volRange" min="0" max="100" value="55">
  </div>
</div>

<div id="dock">
  <div id="meta">
    <img id="cover" alt="">
    <div id="metaTxt">
      <div id="tName">未播放</div>
      <div id="tArtist">点击选择音乐</div>
    </div>
  </div>
  <div id="progWrap">
    <div id="tCur">0:00</div>
    <div id="prog"><div id="progTrack"><div id="progFill"></div></div></div>
    <div id="tDur">0:00</div>
  </div>
  <div id="ctrl">
    <button class="pc" id="btnShuffle" title="随机"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    <button class="pc" id="btnPrev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="18.5 19 8 12 18.5 5"/><rect x="4.5" y="5" width="2.2" height="14"/></svg></button>
    <button class="pc main" id="btnPlay" title="播放"><svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20"/></svg><svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6.5" y="5" width="3.6" height="14"/><rect x="13.9" y="5" width="3.6" height="14"/></svg></button>
    <button class="pc" id="btnNext" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5.5 5 16 12 5.5 19"/><rect x="17.3" y="5" width="2.2" height="14"/></svg></button>
    <button class="pc" id="btnRepeat" title="循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1.5 21 5.5 17 9.5"/><path d="M3 11V9.5a4 4 0 0 1 4-4h14"/><polyline points="7 22.5 3 18.5 7 14.5"/><path d="M21 13v1.5a4 4 0 0 1-4 4H3"/></svg></button>
  </div>
</div>

<div id="list">
  <div class="lHead">
    <div class="lh">播放列表</div>
    <div class="lc" id="listClose">收起</div>
  </div>
  <div class="lBody" id="listBody"></div>
</div>

<div id="toast"></div>


<script>
/* ===== 场景引擎 ===== */
/* ============================================================
   SCENE — 背景场景引擎（纯 canvas 实时绘制，无模糊）
   ============================================================ */
var SCENE = (function () {
  var cv, ctx, dpr = 1, W = 0, H = 0;
  var cur = 'rain', alive = false, raf = 0, lastT = 0;
  var parts = [];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    if (!cv) return;
    var w = window.innerWidth, h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.floor(w * dpr);
    cv.height = Math.floor(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  /* ---------------- 雨 ---------------- */
  function buildRain() {
    parts = [];
    var n = Math.round(W * H / 5200);
    n = Math.max(70, Math.min(240, n));
    for (var i = 0; i < n; i++) {
      var depth = Math.random();
      parts.push({
        x: rnd(-100, W + 100),
        y: rnd(-H, H),
        len: rnd(9, 24) * (0.45 + depth),
        sp: rnd(700, 1350) * (0.5 + depth),
        w: 0.5 + depth * 1.5,
        a: 0.10 + depth * 0.34
      });
    }
  }

  function drawRain(dt) {
    /* 夜色底 */
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0b1220');
    g.addColorStop(0.55, '#0e1728');
    g.addColorStop(1, '#080d16');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 远处朦胧光晕 */
    var rg = ctx.createRadialGradient(W * 0.72, H * 0.22, 0, W * 0.72, H * 0.22, Math.max(W, H) * 0.62);
    rg.addColorStop(0, 'rgba(66,104,168,.20)');
    rg.addColorStop(0.5, 'rgba(40,64,110,.08)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    /* 雨丝 */
    ctx.lineCap = 'round';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.strokeStyle = 'rgba(178,206,255,' + p.a + ')';
      ctx.lineWidth = p.w;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.len * 0.30, p.y + p.len);
      ctx.stroke();
      p.y += p.sp * dt;
      p.x -= p.sp * dt * 0.30;
      if (p.y > H + 40) { p.y = rnd(-160, -20); p.x = rnd(-60, W + 120); }
      if (p.x < -60) { p.x = W + rnd(0, 80); }
    }
  }

  /* ---------------- 火 ---------------- */
  function buildFire() {
    parts = [];
    for (var i = 0; i < 110; i++) {
      parts.push({
        x: rnd(-1, 1),
        y: rnd(0, 1),
        life: rnd(0, 1),
        sp: rnd(0.5, 1.5),
        sz: rnd(1.5, 5.5),
        drift: rnd(-0.3, 0.3)
      });
    }
  }

  function drawFire(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0806');
    g.addColorStop(0.5, '#120c08');
    g.addColorStop(1, '#1c1008');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var cx = W * 0.5, cy = H * 0.92;

    /* 底部大暖光 */
    var rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.72);
    rg.addColorStop(0, 'rgba(255,138,46,.34)');
    rg.addColorStop(0.35, 'rgba(214,86,20,.14)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    /* 火焰粒子 */
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.life += dt * p.sp * 0.55;
      if (p.life > 1) { p.life = 0; p.x = rnd(-1, 1); p.y = 0; }
      var t = p.life;
      var px = cx + p.x * W * 0.16 * (1 - t * 0.6) + p.drift * t * 40;
      var py = cy - t * H * 0.42;
      var a = (1 - t) * 0.7;
      var r = p.sz * (1 - t * 0.5);
      var col;
      if (t < 0.28) col = 'rgba(255,246,210,' + a + ')';
      else if (t < 0.55) col = 'rgba(255,186,74,' + a + ')';
      else if (t < 0.8) col = 'rgba(232,110,30,' + (a * 0.8) + ')';
      else col = 'rgba(150,52,18,' + (a * 0.5) + ')';
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(px, py, r, 0, 6.2832);
      ctx.fill();
    }
  }

  /* ---------------- 海 ---------------- */
  function buildWaves() {
    parts = [];
    for (var i = 0; i < 6; i++) {
      parts.push({ ph: rnd(0, 6.28), sp: rnd(0.28, 0.62), amp: rnd(8, 26), yo: i * 0.09 });
    }
  }

  function drawWaves(dt, t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#050b14');
    g.addColorStop(0.45, '#0a1826');
    g.addColorStop(1, '#081420');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 月光 */
    var rg = ctx.createRadialGradient(W * 0.5, H * 0.16, 0, W * 0.5, H * 0.16, Math.max(W, H) * 0.55);
    rg.addColorStop(0, 'rgba(150,196,255,.16)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < parts.length; i++) {
      var w = parts[i];
      w.ph += dt * w.sp;
      var baseY = H * (0.58 + w.yo);
      var amp = w.amp;
      ctx.beginPath();
      ctx.moveTo(0, H);
      for (var x = 0; x <= W; x += 8) {
        var y = baseY + Math.sin(x * 0.008 + w.ph) * amp + Math.sin(x * 0.021 + w.ph * 1.6) * (amp * 0.4);
        ctx.lineTo(x, y);
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      var shade = 0.055 + i * 0.028;
      ctx.fillStyle = 'rgba(120,172,232,' + shade + ')';
      ctx.fill();
    }
  }

  /* ---------------- 林 ---------------- */
  function buildForest() {
    parts = [];
    for (var i = 0; i < 46; i++) {
      parts.push({
        x: rnd(0, 1), h: rnd(0.22, 0.62), w: rnd(0.012, 0.036),
        a: rnd(0.18, 0.55), sw: rnd(0.25, 0.75), ph: rnd(0, 6.28)
      });
    }
    parts.sort(function (a, b) { return a.a - b.a; });
  }

  function drawForest(dt, t) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#08120f');
    g.addColorStop(0.5, '#0a1712');
    g.addColorStop(1, '#050c09');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    /* 林隙光 */
    var rg = ctx.createRadialGradient(W * 0.42, H * 0.18, 0, W * 0.42, H * 0.18, Math.max(W, H) * 0.6);
    rg.addColorStop(0, 'rgba(126,186,132,.17)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      var bx = p.x * W + Math.sin(t * p.sw + p.ph) * 6;
      var by = H;
      var hh = p.h * H;
      var hw = p.w * W * 3.2;
      ctx.fillStyle = 'rgba(14,32,24,' + p.a + ')';
      ctx.beginPath();
      ctx.moveTo(bx, by - hh);
      ctx.lineTo(bx - hw, by);
      ctx.lineTo(bx + hw, by);
      ctx.closePath();
      ctx.fill();
    }
  }

  /* ---------------- 主循环 ---------------- */
  function build() {
    if (cur === 'rain') buildRain();
    else if (cur === 'fire') buildFire();
    else if (cur === 'waves') buildWaves();
    else buildForest();
  }

  function frame(tms) {
    if (!alive) return;
    if (!lastT) lastT = tms;
    var dt = Math.min((tms - lastT) / 1000, 0.05);
    lastT = tms;
    var t = tms / 1000;

    if (cur === 'rain') drawRain(dt);
    else if (cur === 'fire') drawFire(dt);
    else if (cur === 'waves') drawWaves(dt, t);
    else drawForest(dt, t);

    raf = requestAnimationFrame(frame);
  }

  return {
    init: function (el) {
      cv = el; ctx = cv.getContext('2d');
      resize();
      alive = true;
      raf = requestAnimationFrame(frame);
    },
    set: function (name) {
      if (!name) return;
      cur = name;
      build();
    },
    resize: resize,
    current: function () { return cur; }
  };
})();

/* ============================================================
   NOISE — 环境音引擎（真实录音，无合成噪音）
   ============================================================ */
var NOISE = (function () {
  var ac = null, master = null;
  var on = false, vol = 0.55, cur = 'rain';
  var cache = {}, playing = null, playingName = null;

  var FILE = {
    rain:   './sfx/rain.mp3',
    fire:   './sfx/fire.mp3',
    waves:  './sfx/waves.mp3',
    forest: './sfx/forest.mp3'
  };

  function ensure() {
    if (ac) return ac;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = on ? vol : 0;
      master.connect(ac.destination);
    } catch (e) { ac = null; }
    return ac;
  }

  function load(name, cb) {
    if (cache[name]) { cb(cache[name]); return; }
    var url = FILE[name];
    if (!url) { cb(null); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.responseType = 'arraybuffer';
    xhr.onload = function () {
      if (xhr.status !== 200 && xhr.status !== 0) { cb(null); return; }
      ac.decodeAudioData(xhr.response, function (buf) {
        cache[name] = buf;
        cb(buf);
      }, function () { cb(null); });
    };
    xhr.onerror = function () { cb(null); };
    xhr.send();
  }

  function stopCurrent(fadeSec) {
    if (!playing) return;
    var p = playing;
    playing = null;
    try {
      var t = ac.currentTime;
      p.gain.gain.cancelScheduledValues(t);
      p.gain.gain.setValueAtTime(p.gain.gain.value, t);
      p.gain.gain.linearRampToValueAtTime(0.0001, t + (fadeSec || 0.8));
      setTimeout(function () {
        try { p.src.stop(); } catch (e) { }
        try { p.src.disconnect(); } catch (e) { }
      }, (fadeSec || 0.8) * 1000 + 120);
    } catch (e) { }
  }

  function play(name) {
    if (!ac || !on) return;
    if (playingName === name && playing) return;
    playingName = name;

    load(name, function (buf) {
      if (!buf) return;
      if (!on || playingName !== name) return;
      stopCurrent(0.9);

      var src = ac.createBufferSource();
      src.buffer = buf;
      src.loop = true;

      var g = ac.createGain();
      g.gain.value = 0.0001;
      src.connect(g);
      g.connect(master);
      src.start(0);

      var t = ac.currentTime;
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(1.0, t + 1.6);

      playing = { src: src, gain: g };
    });
  }

  return {
    init: function () { ensure(); },
    set: function (name) {
      cur = name;
      if (!on) return;
      ensure();
      if (!ac) return;
      if (ac.state === 'suspended') { try { ac.resume(); } catch (e) { } }
      play(name);
    },
    preload: function (name) { ensure(); if (ac) load(name, function () { }); },
    on: function () { return on; },
    current: function () { return cur; },
    volume: function (v) {
      vol = Math.max(0, Math.min(1, v));
      if (master && ac) {
        var t = ac.currentTime;
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(on ? vol : 0, t + 0.2);
      }
    },
    toggle: function (force) {
      ensure();
      if (!ac) return false;
      var want = (force === undefined) ? !on : !!force;
      if (want === on) return on;
      on = want;
      var t = ac.currentTime;
      if (on) {
        if (ac.state === 'suspended') { try { ac.resume(); } catch (e) { } }
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(0, t);
        master.gain.linearRampToValueAtTime(vol, t + 0.7);
        play(cur);
      } else {
        master.gain.cancelScheduledValues(t);
        master.gain.setValueAtTime(master.gain.value, t);
        master.gain.linearRampToValueAtTime(0, t + 0.5);
      }
      return on;
    }
  };
})();

    clockEl.textContent = (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;

  function showLine(i, animate) {
    var n = lyricLines.length;
    if (!n) return;
    if (i < 0) i = 0;
    if (i > n - 1) i = n - 1;

    var cur = lyricLines[i];
    var prev = i > 0 ? lyricLines[i - 1] : null;
    var next = i < n - 1 ? lyricLines[i + 1] : null;

    function apply() {
      lNow.textContent = cur.l || '';
      lPrev.textContent = prev ? (prev.l || '') : '';
      lNext.textContent = next ? (next.l || '') : '';
      if (cur.c) {
        lSub.textContent = cur.c;
        lSub.classList.add('show');
      } else {
        lSub.textContent = '';
        lSub.classList.remove('show');
      }
      lNow.classList.add('show');
    }

    if (!animate) { apply(); return; }

    /* 淡出 → 换词 → 淡入 */
    lNow.classList.remove('show');
    lSub.classList.remove('show');
    setTimeout(function () {
      apply();

    if (p && p.catch) p.catch(function () { });
  }

  function togglePlay() {
    if (!tracks.length) { toast('还没有歌曲'); return; }
    if (audio.paused) { doPlay(); }
    else { audio.pause(); }
  }

  function nextTrack(auto) {
    if (!tracks.length) return;
    if (shuffle) {
      var n = idx;
      if (tracks.length > 1) { while (n === idx) n = Math.floor(Math.random() * tracks.length); }
      loadTrack(n, true);
    } else {
      if (!auto && idx === tracks.length - 1 && !repeatAll) { loadTrack(0, false); return; }
      loadTrack(idx + 1, true);
    }
  }

  function prevTrack() {
    if (!tracks.length) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    loadTrack(idx - 1, true);
  }

  /* ---------- 音频事件 ---------- */
  audio.addEventListener('play', function () { playing = true; setPlayIcon(true); });
  audio.addEventListener('pause', function () { playing = false; setPlayIcon(false); });
  audio.addEventListener('loadedmetadata', function () { tDur.textContent = fmt(audio.duration); });
  audio.addEventListener('timeupdate', function () {
    if (!userSeek && audio.duration) {
      progFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
    }
    tCur.textContent = fmt(audio.currentTime);
    if (!userSeek) lyricTick(audio.currentTime);
  });
  audio.addEventListener('ended', function () {
    if (!repeatAll && !shuffle && idx === tracks.length - 1) { setPlayIcon(false); return; }
    nextTrack(true);
  });
  audio.addEventListener('error', function () { toast('这首歌加载失败'); });

  /* ---------- 进度条拖动 ---------- */
  function seekAt(clientX) {
    var r = prog.getBoundingClientRect();
    var p = (clientX - r.left) / r.width;
    p = Math.max(0, Math.min(1, p));
    if (audio.duration) { audio.currentTime = p * audio.duration; }
    progFill.style.width = (p * 100) + '%';
  }
  prog.addEventListener('pointerdown', function (e) {
    userSeek = true;
    seekAt(e.clientX);
    try { prog.setPointerCapture(e.pointerId); } catch (er) { }
  });
  prog.addEventListener('pointermove', function (e) {
    if (userSeek) seekAt(e.clientX);
  });
  prog.addEventListener('pointerup', function () {
    userSeek = false;
    lyrIdx = -2;
    if (audio.currentTime) lyricTick(audio.currentTime);
  });
  prog.addEventListener('pointercancel', function () { userSeek = false; });

  /* ---------- 按钮 ---------- */
  btnPlay.addEventListener('click', togglePlay);
  btnNext.addEventListener('click', function () { nextTrack(false); });
  btnPrev.addEventListener('click', prevTrack);

  btnShuffle.addEventListener('click', function () {
    shuffle = !shuffle;
    btnShuffle.classList.toggle('act', shuffle);
    toast(shuffle ? '随机播放' : '顺序播放');
  });

  btnRepeat.addEventListener('click', function () {
    repeatAll = !repeatAll;
    btnRepeat.classList.toggle('act', repeatAll);
    audio.loop = false;
    toast(repeatAll ? '循环播放' : '播完停止');
  });
  btnRepeat.classList.add('act');

  /* ---------- 场景面板 ---------- */
  function setScene(name, silent) {
    scene = name;
    if (typeof SCENE !== 'undefined') SCENE.set(name);
    if (typeof NOISE !== 'undefined') NOISE.set(name);
    var items = panel.querySelectorAll('.pItem');
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle('act', items[i].getAttribute('data-scene') === name);
    }
    try { localStorage.setItem('tl_scene', name); } catch (e) { }
    if (!silent) toast(sceneName(name));
  }
  function sceneName(n) {
    return { rain: '雨夜', fire: '火堆', waves: '海浪', forest: '林间' }[n] || n;
  }

  panel.querySelectorAll('.pItem').forEach(function (el) {
    el.addEventListener('click', function () {
      setScene(el.getAttribute('data-scene'));
    });
  });

  btnScene.addEventListener('click', function (e) {
    e.stopPropagation();
    panel.classList.toggle('open');
    btnScene.classList.toggle('act', panel.classList.contains('open'));
    wake();
  });

  /* 音量 */
  volRange.addEventListener('input', function () {
    var v = parseInt(volRange.value, 10) / 100;
    if (typeof NOISE !== 'undefined') NOISE.volume(v);
    try { localStorage.setItem('tl_vol', volRange.value); } catch (e) { }
  });
  volRange.addEventListener('click', function (e) { e.stopPropagation(); });

  /* ---------- 歌单 ---------- */
  function paintList() {
    listBody.innerHTML = '';
    tracks.forEach(function (t, i) {
      var d = document.createElement('div');
      d.className = 'lItem' + (i === idx ? ' act' : '');
      var img = document.createElement('img');
      img.src = t.cover || ''; img.alt = '';
      var box = document.createElement('div');
      box.className = 'lt';
      var nm = document.createElement('div'); nm.className = 'ln'; nm.textContent = t.name || '';
      var ar = document.createElement('div'); ar.className = 'la'; ar.textContent = t.artist || '';
      box.appendChild(nm); box.appendChild(ar);
      d.appendChild(img); d.appendChild(box);
      d.addEventListener('click', function () {
        loadTrack(i, true);
        closeList();
      });
      listBody.appendChild(d);
    });
  }

  function openList() { listEl.classList.add('open'); btnList.classList.add('act'); }
  function closeList() { listEl.classList.remove('open'); btnList.classList.remove('act'); }
  btnList.addEventListener('click', function (e) {
    e.stopPropagation();
    if (listEl.classList.contains('open')) closeList(); else openList();
    wake();
  });
  listClose.addEventListener('click', closeList);

  /* ---------- 全屏 ---------- */
  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
      document.mozFullScreenElement || document.msFullscreenElement);
  }

  function toggleFs() {
    var el = document.documentElement;
    try {
      if (isFs()) {
        var ex = document.exitFullscreen || document.webkitExitFullscreen ||
          document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) ex.call(document);
        return;
      }
      var rq = el.requestFullscreen || el.webkitRequestFullscreen ||
        el.mozRequestFullScreen || el.msRequestFullscreen;
      if (!rq) { toast('这个浏览器不支持全屏'); return; }
      var r = rq.call(el);
      if (r && r.catch) {
        r.catch(function () {
          toast('此浏览器拒绝了全屏（可“添加到主屏幕”获得无边效果）');
        });
      }
    } catch (e) {
      toast('此浏览器不支持全屏');
    }
  }
  btnFs.addEventListener('click', function (e) { e.stopPropagation(); toggleFs(); wake(); });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      document.body.classList.toggle('fs', isFs());
      btnFs.classList.toggle('act', isFs());
      setTimeout(function () { if (typeof SCENE !== 'undefined') SCENE.resize(); }, 120);
    });
  });

  /* ---------- 闲置自动隐藏 ---------- */
  var idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () {
      if (panel.classList.contains('open') || listEl.classList.contains('open')) return;
      document.body.classList.add('idle');
    }, 5200);
  }
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest || !e.target.closest('#panel')) panel.classList.remove('open');
    wake();
  });
  wake();

  /* ---------- 尺寸变化 ---------- */
  var rz = null;
  window.addEventListener('resize', function () {
    clearTimeout(rz);
    rz = setTimeout(function () {
      if (typeof SCENE !== 'undefined') SCENE.resize();
    }, 200);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { if (typeof SCENE !== 'undefined') SCENE.resize(); }, 320);
  });

  /* ---------- 初始化 ---------- */
  function boot() {
    /* 场景 */
    if (typeof SCENE !== 'undefined') { SCENE.init(bgCv); }

    var savedScene = 'rain', savedVol = '55';
    try {
      savedScene = localStorage.getItem('tl_scene') || 'rain';
      savedVol = localStorage.getItem('tl_vol') || '55';
    } catch (e) { }
    volRange.value = savedVol;
    if (typeof NOISE !== 'undefined') NOISE.volume(parseInt(savedVol, 10) / 100);
    setScene(savedScene, true);

    /* 默认载入第一首（不自动播，避免被浏览器拦） */
    if (tracks.length) loadTrack(0, false);
    setPlayIcon(false);

    wake();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
