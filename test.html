<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Worker 测试 V2</title>
<style>
body{background:#0f1115;color:#dfe6f0;font:15px/1.7 -apple-system,"PingFang SC",sans-serif;padding:16px;margin:0}
h1{font-size:17px;margin:0 0 14px}
.card{background:#171b22;border:1px solid #262d38;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #212833;font-size:14px}
.row:last-child{border:0}
.k{color:#8b98a9}
.v{color:#fff;font-weight:600;text-align:right;max-width:64%;word-break:break-all}
.ok{color:#4ade80}.er{color:#f87171}.wa{color:#fbbf24}
pre{background:#0b0e13;padding:10px;border-radius:8px;overflow:auto;font-size:12px;color:#9fb3c8;white-space:pre-wrap;word-break:break-all;margin:0}
h2{font-size:14px;color:#8b98a9;margin:0 0 8px;font-weight:600}
iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
</style>
</head>
<body>
<h1>Worker 测试 V2（iframe 导航方案）</h1>

<div class="card">
  <h2>第一步：fetch 直接问（预期拿不到型号）</h2>
  <div class="row"><span class="k">状态</span><span class="v" id="f1">等待</span></div>
  <div class="row"><span class="k">型号</span><span class="v" id="f2">—</span></div>
  <div class="row"><span class="k">系统版本</span><span class="v" id="f3">—</span></div>
</div>

<div class="card">
  <h2>第二步：iframe 导航（关键测试）</h2>
  <div class="row"><span class="k">postMessage</span><span class="v" id="g1">等待</span></div>
  <div class="row"><span class="k">iframe 报的型号</span><span class="v" id="g2">—</span></div>
  <div class="row"><span class="k">iframe 报的版本</span><span class="v" id="g3">—</span></div>
  <div class="row"><span class="k">cookie 已写入</span><span class="v" id="g4">—</span></div>
</div>

<div class="card">
  <h2>第三步：再 fetch（看 cookie 能不能带上）</h2>
  <div class="row"><span class="k">状态</span><span class="v" id="h1">等待</span></div>
  <div class="row"><span class="k">型号</span><span class="v" id="h2">—</span></div>
</div>

<div class="card">
  <div style="font-size:13px;color:#8b98a9;margin-bottom:8px">原始返回</div>
  <pre id="raw">—</pre>
</div>

<iframe id="navframe" src="about:blank"></iframe>

<script>
(function () {
  var API = 'https://ajx-stats.haiteluo.xyz';
  function $(id) { return document.getElementById(id); }
  function say(id, txt, cls) {
    var e = $(id); if (!e) return;
    e.textContent = txt;
    e.className = 'v' + (cls ? ' ' + cls : '');
  }

  /* ---------- 第一步 ---------- */
  fetch(API + '/whoami', { cache: 'no-store', credentials: 'include' })
    .then(function (r) { say('f1', 'HTTP ' + r.status, r.ok ? 'ok' : 'er'); return r.json(); })
    .then(function (d) {
      $('raw').textContent = JSON.stringify(d, null, 2);
      say('f2', d.model || '（空）', d.model ? 'ok' : 'er');
      say('f3', d.platformVersion || '（空）', d.platformVersion ? 'ok' : 'er');
    })
    .catch(function (e) { say('f1', '失败 ' + e.message, 'er'); });

  /* ---------- 第二步：iframe ---------- */
  var gotNav = false;
  window.addEventListener('message', function (ev) {
    var d = ev.data;
    if (!d || !d.ajxNav) return;
    gotNav = true;
    say('g1', '收到', 'ok');
    say('g2', d.model || '（空）', d.model ? 'ok' : 'er');
    say('g3', d.pv || '（空）', d.pv ? 'ok' : 'er');

    /* 看 cookie 有没有落到 haiteluo.xyz 域下 */
    var ck = document.cookie || '';
    say('g4', ck.indexOf('ajx_m') >= 0 ? '有（' + ck.slice(0, 40) + '...）' : '看不到（跨域，正常）',
        ck.indexOf('ajx_m') >= 0 ? 'ok' : 'wa');

    /* ---------- 第三步：cookie 已写，再问一次 ---------- */
    setTimeout(function () {
      fetch(API + '/whoami', { cache: 'no-store', credentials: 'include' })
        .then(function (r) { return r.json(); })
        .then(function (d2) {
          $('raw').textContent = JSON.stringify(d2, null, 2);
          say('h1', 'HTTP ok', 'ok');
          say('h2', d2.model || '（空）', d2.model ? 'ok' : 'er');
        })
        .catch(function (e) { say('h1', '失败 ' + e.message, 'er'); });
    }, 1200);
  });

  setTimeout(function () {
    $('navframe').src = API + '/nav';
  }, 400);

  setTimeout(function () {
    if (!gotNav) {
      say('g1', '超时未收到（可能被拦或已成功但无 postMessage）', 'wa');
    }
  }, 5000);
})();
</script>
</body>
</html>
