<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>停云</title>
<style>
/* 停云 —— 挂机页 */
:root{
  --ink:#e9eff8;
  --dim:rgba(206,220,238,.34);
  --dimmer:rgba(206,220,238,.18);
  --hair:rgba(200,222,245,.10);
  --ease:cubic-bezier(.23,1,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none;background:#0a0d12}
body{
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
  position:fixed;inset:0;
}

#rain{position:fixed;inset:0;z-index:0;display:block}
#fog{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(16,22,33,.42) 0%,rgba(12,16,24,.10) 38%,rgba(8,11,16,.30) 100%)}

/* ============ 主舞台 ============ */
#stage{
  position:fixed;inset:0;z-index:4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 28px;
  pointer-events:none;
  text-align:center;
}

/* 时间：主角，永不淡 */
#time{
  font-size:clamp(50px,18.6vw,128px);
  font-weight:300;
  line-height:1;
  letter-spacing:-.052em;
  font-variant-numeric:tabular-nums;
  color:var(--ink);
  white-space:nowrap;
}
#time .ss{
  font-size:.34em;
  font-weight:300;
  letter-spacing:-.02em;
  margin-left:.06em;
  opacity:.40;
  transition:opacity .5s var(--ease);
}
body.quiet #time .ss{opacity:0}

/* 日期 */
#date{
  margin-top:clamp(12px,3vw,20px);
  font-size:clamp(10px,2.7vw,12px);
  font-weight:400;
  letter-spacing:.20em;
  text-indent:.20em;
  color:var(--dim);
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}

/* 停留时长 */
#stay{
  margin-top:clamp(7px,1.8vw,10px);
  font-size:clamp(10px,2.7vw,12px);
  font-weight:400;
  letter-spacing:.10em;
  font-variant-numeric:tabular-nums;
  color:var(--dimmer);
  transition:opacity .5s var(--ease),transform .5s var(--ease);
}

/* 诗句 */
#verse{
  margin-top:clamp(26px,8vw,54px);
  font-size:clamp(11px,2.9vw,13px);
  font-weight:400;
  letter-spacing:.34em;
  text-indent:.34em;
  color:rgba(206,220,238,.15);
  transition:opacity .6s var(--ease),transform .6s var(--ease);
}

/* 歌词：次要 */
#lyric{
  margin-top:clamp(16px,4.4vw,26px);
  min-height:clamp(22px,6vw,32px);
  max-width:min(600px,86vw);
  font-size:clamp(15px,4.4vw,21px);
  font-weight:500;
  line-height:1.55;
  letter-spacing:-.008em;
  color:rgba(233,239,248,.72);
  transition:opacity .5s var(--ease);
}

/* 淡出组 */
body.quiet #date,
body.quiet #stay,
body.quiet #verse,
body.quiet #lyric{opacity:0;transform:translateY(-4px)}

/* ============ 底部控制台（常驻、可上拉） ============ */
#deck {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  background: rgba(11, 14, 19, .72);
  -webkit-backdrop-filter: blur(18px) saturate(120%);
  backdrop-filter: blur(18px) saturate(120%);
  border-top: 1px solid rgba(200, 220, 245, .07);
  transform: translateY(calc(100% - 46px));
  transition: transform .38s cubic-bezier(.23, 1, .32, 1);
  will-change: transform;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
#deck.open { transform: translateY(0); }

#grip {
  height: 46px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 22px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
#grip i {
  display: block;
  width: 26px; height: 1px;
  background: rgba(200, 220, 245, .28);
  flex: none;
}
#grip b {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .02em;
  color: rgba(206, 220, 238, .42);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color .3s ease;
}
#deck.open #grip b { color: rgba(206, 220, 238, .70); }

#panel {
  padding: 0 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#now {
  display: flex;
  align-items: baseline;
  gap: 10px;
  min-width: 0;
}
#now b {
  font-size: 13px;
  font-weight: 500;
  color: #e9eff8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#now em {
  font-size: 11px;
  font-style: normal;
  color: rgba(206, 220, 238, .34);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: none;
  max-width: 40%;
}

#progress { padding: 2px 0; }
#track {
  height: 2px;
  background: rgba(200, 220, 245, .10);
  border-radius: 2px;
  overflow: hidden;
}
#fill {
  height: 100%;
  width: 0%;
  background: rgba(233, 239, 248, .62);
  transform-origin: left center;
  transition: width .25s linear;
}

#ops {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.op {
  flex: 1 1 auto;
  min-width: 62px;
  height: 34px;
  padding: 0 12px;
  font: inherit;
  font-size: 11.5px;
  letter-spacing: .02em;
  color: rgba(206, 220, 238, .62);
  background: transparent;
  border: 1px solid rgba(200, 220, 245, .10);
  border-radius: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: color .2s ease, border-color .2s ease, background .2s ease;
}
.op:hover { color: #e9eff8; border-color: rgba(200, 220, 245, .22); }
.op:active { background: rgba(200, 220, 245, .06); }

#list{
  position:fixed;left:0;right:0;bottom:0;z-index:8;
  max-height:64vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:18px 22px max(24px,env(safe-area-inset-bottom));
  background:rgba(10,13,18,.97);
  transform:translateY(101%);
  transition:transform .4s var(--ease);
  border-top:1px solid var(--hair);
}
#list.on{transform:translateY(0)}
#list .hd{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:14px;
}
#list .hd b{
  font-size:10px;font-weight:400;letter-spacing:.26em;
  color:rgba(206,220,238,.36);text-transform:uppercase;
}
#list .hd em{
  font-style:normal;font-size:11px;letter-spacing:.10em;
  color:rgba(206,220,238,.40);cursor:pointer;padding:4px;
}
.row{
  display:flex;align-items:baseline;gap:10px;
  padding:11px 2px;
  cursor:pointer;
  border-bottom:1px solid rgba(200,222,245,.05);
}
.row .n{
  font-size:13px;font-weight:400;letter-spacing:.01em;
  color:rgba(233,239,248,.62);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1 1 auto;text-align:left;
}
.row .a{
  font-size:10.5px;color:rgba(206,220,238,.26);
  flex:0 0 auto;
}
.row.on .n{color:var(--ink)}

/* ============ 提示 ============ */
#tip{
  position:fixed;left:50%;bottom:96px;z-index:20;
  transform:translateX(-50%);
  font-size:11px;letter-spacing:.10em;
  color:rgba(206,220,238,.52);
  opacity:0;transition:opacity .3s var(--ease);
  pointer-events:none;
}
#tip.on{opacity:1}

/* ============ 竖屏窄 ==== ======== */
@media (max-width:360px){
  #time{font-size:clamp(44px,18vw,52px)}
  #ops{gap:14px}
}

/* ============ 横屏 ============ */
@media (orientation:landscape){
  #stage{padding:0 clamp(30px,6vw,80px)}
  #time{font-size:clamp(46px,13vh,104px)}
  #date{margin-top:6px}
  #verse{margin-top:clamp(14px,4vh,28px)}
  #lyric{margin-top:10px;font-size:clamp(13px,3.2vh,18px);min-height:20px}
  #grip{padding:0 clamp(30px,6vw,80px) max(8px,env(safe-area-inset-bottom))}
  #panel{padding:0 clamp(30px,6vw,80px)}
  #deck{transform:translateY(calc(100% - 40px))}
  #grip{height:40px}
  #list{max-height:78vh;padding:14px clamp(30px,6vw,80px)}
  #tip{bottom:70px}
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

</style>
</head>

</footer>

<script>
/* 雨 */
var RAIN = (function () {
  var cv, ctx, W = 0, H = 0, dpr = 1, runs = [], last = 0, live = false;

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function build() {
    runs = [];
    var n = Math.round(Math.min(340, Math.max(110, W * H / 3400)));
    for (var i = 0; i < n; i++) {
      var d = Math.random();
      var depth = d * d;
      runs.push({
        x: rnd(-W * 0.15, W * 1.15),
        y: rnd(-H, H),
        len: 8 + depth * 34,
        spd: 420 + depth * 900,
        wid: 0.5 + depth * 1.35,
        alp: 0.05 + depth * 0.26,
        tilt: 0.10 + depth * 0.05
      });
    }
  }

  function resize() {
    if (!cv) return;
    var w = window.innerWidth, h = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = w + 'px';
    cv.style.height = h + 'px';
    W = w; H = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    build();
  }

  function paint(dt) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0c111a');
    g.addColorStop(0.34, '#101725');
    g.addColorStop(0.72, '#0c1220');
    g.addColorStop(1, '#080b12');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var far = ctx.createRadialGradient(W * 0.5, H * 0.30, 0, W * 0.5, H * 0.30, Math.max(W, H) * 0.58);
    far.addColorStop(0, 'rgba(58,84,128,.16)');
    far.addColorStop(0.55, 'rgba(34,52,84,.05)');
    far.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = far;
    ctx.fillRect(0, 0, W, H);

    ctx.lineCap = 'round';
    for (var i = 0; i < runs.length; i++) {
      var p = runs[i];
      ctx.strokeStyle = 'rgba(186,210,242,' + p.alp + ')';
      ctx.lineWidth = p.wid;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.len * p.tilt, p.y + p.len);
      ctx.stroke();

      p.y += p.spd * dt;
      p.x -= p.spd * dt * p.tilt;

      if (p.y > H + 40) {
        p.y = rnd(-H * 0.3, -10);
        p.x = rnd(-W * 0.1, W * 1.2);
      }
      if (p.x < -W * 0.2) {
        p.x = W * 1.1;
        p.y = rnd(-H * 0.3, H * 0.6);
      }
    }
  }

  function loop(t) {
    if (!live) return;
    if (!last) last = t;
    var dt = Math.min((t - last) / 1000, 0.05);
    last = t;
    paint(dt);
    requestAnimationFrame(loop);
  }

  return {
    init: function (el) {
      cv = el; ctx = cv.getContext('2d');
      resize(); live = true;
      requestAnimationFrame(loop);
    },
    resize: resize
  };
})();

</script>

      elLyric.textContent = txt;
      elLyric.style.opacity = '';
    }, 140);
  }

  function syncLyric(t) {
    if (!lines.length) return;
    var target = 0;
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].t <= t + 0.12) target = i;
      else break;
    }
    if (target !== li) {
      li = target;
      showLine(lines[target].l || '');
    }
  }

  function setLyric(track) {
    lines = (track && track.ly && track.ly.length) ? track.ly : [];
    li = -2;
    blank();
  }

  /* ============ 播放 ============ */
  function allTracks() { return SITE.concat(locals); }

  function total() { return SITE.length + locals.length; }

  function load(i, autoplay) {
    var arr = allTracks();
    if (!arr.length) return;
    var n = arr.length;
    idx = ((i % n) + n) % n;
    cur = arr[idx];

    au.src = cur.src;
    var nm = cur.t || cur.name || '未命名';
    var ar = cur.a || cur.artist || '';
    var al = cur.al || cur.album || '';
    elSong.textContent = nm;
    if (elAlbum) elAlbum.textContent = ar + (al ? '　' + al : '');
    if (elGripTxt) elGripTxt.textContent = nm + (ar ? '　' + ar : '');
    setLyric(cur);
    elFill.style.width = '0%';
    renderRows();

    if (autoplay) play();
    else { bPlay.textContent = '播放'; bPlay.classList.remove('on'); }
  }

  function play() {
    var p = au.play();
    if (p && p.catch) p.catch(function () { bPlay.textContent = '播放'; bPlay.classList.remove('on'); });
  }

  au.addEventListener('play', function () { bPlay.textContent = '暂停'; bPlay.classList.add('on'); });
  au.addEventListener('pause', function () { bPlay.textContent = '播放'; bPlay.classList.remove('on'); });
  au.addEventListener('ended', function () { load(idx + 1, true); });
  au.addEventListener('error', function () { tip('无法播放此音频'); });
  au.addEventListener('timeupdate', function () {
    var d = au.duration;
    if (!dragging && isFinite(d) && d > 0) elFill.style.width = (au.currentTime / d * 100) + '%';
    if (!dragging) syncLyric(au.currentTime);
  });

  /* ============ 进度 ============ */
  function pct(x) {
    var r = elProg.getBoundingClientRect();
    var v = (x - r.left) / r.width;
    return Math.max(0, Math.min(1, v));
  }

  elProg.addEventListener('pointerdown', function (e) {
    if (!au.duration) return;
    dragging = true;
    elFill.style.width = (pct(e.clientX) * 100) + '%';
    try { elProg.setPointerCapture(e.pointerId); } catch (er) {}
    e.preventDefault();
  });
  elProg.addEventListener('pointermove', function (e) {
    if (dragging) { elFill.style.width = (pct(e.clientX) * 100) + '%'; e.preventDefault(); }
  });
  elProg.addEventListener('pointerup', function (e) {
    if (!dragging) return;
    dragging = false;
    if (au.duration) au.currentTime = pct(e.clientX) * au.duration;
    li = -2;
    syncLyric(au.currentTime);
  });
  elProg.addEventListener('pointercancel', function () { dragging = false; });

  /* ============ 歌单 ============ */
  function renderRows() {
    var arr = allTracks();
    elRows.innerHTML = '';
    arr.forEach(function (t, i) {
      var row = document.createElement('div');
      row.className = 'row' + (i === idx ? ' on' : '');
      var nm = document.createElement('div');
      nm.className = 'n';
      nm.textContent = t.t || t.name || '未命名';
      var ar = document.createElement('div');
      ar.className = 'a';
      ar.textContent = (t.a || t.artist || '') + (t.al ? '　' + t.al : '');
      row.appendChild(nm);
      row.appendChild(ar);
      row.addEventListener('click', function () {
        load(i, true);
        closeList();
        wake();
      });
      elRows.appendChild(row);
    });
  }

  function openList() {
    renderRows();
    elList.classList.add('on');
    bList.classList.add('on');
    wake();
  }
  function closeList() {
    elList.classList.remove('on');
    bList.classList.remove('on');
  }

  /* ============ 按钮 ============ */
  bPlay.addEventListener('click', function () {
    if (!total()) { tip('请先选歌或上传本地音乐'); return; }
    if (idx < 0) { load(0, true); return; }
    if (au.paused) play(); else au.pause();
    wake();
  });

  bNext.addEventListener('click', function () {
    if (!total()) { tip('请先选歌或上传本地音乐'); return; }
    load(idx + 1, true);
    wake();
  });

  bPrev.addEventListener('click', function () {
    if (!total()) { tip('请先选歌或上传本地音乐'); return; }
    if (au.currentTime > 3) { au.currentTime = 0; li = -2; }
    else load(idx - 1, true);
    wake();
  });

  bList.addEventListener('click', function () {
    if (elList.classList.contains('on')) closeList(); else openList();
  });

  lClose.addEventListener('click', function () { closeList(); wake(); });

  bFile.addEventListener('click', function () { picker.click(); wake(); });

  picker.addEventListener('change', function () {
    var fs = picker.files;
    if (!fs || !fs.length) return;
    for (var i = 0; i < fs.length; i++) {
      var f = fs[i];
      locals.push({
        t: f.name.replace(/\.[^.]+$/, ''),
        a: '本地',
        al: '',
        src: URL.createObjectURL(f),
        ly: null
      });
    }
    tip('已添加 ' + fs.length + ' 首本地音乐');
    if (idx < 0) load(SITE.length, true);
    else renderRows();
    picker.value = '';
  });

  /* ============ 全屏 ============ */
  function isFs() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement ||
      document.mozFullScreenElement || document.msFullscreenElement);
  }
  bFull.addEventListener('click', function () {
    var el = document.documentElement;
    try {
      if (isFs()) {
        var ex = document.exitFullscreen || document.webkitExitFullscreen ||
          document.mozCancelFullScreen || document.msExitFullscreen;
        if (ex) ex.call(document);
        return;
      }
      var rq = el.requestFullscreen || el.webkitRequestFullscreen ||
        el.mozRequestFullScreen || el.msRequestFullscreen;
      if (!rq) { tip('此浏览器不支持全屏'); return; }
      var r = rq.call(el);
      if (r && r.catch) r.catch(function () { tip('可“添加到主屏幕”以全屏启动'); });
    } catch (e) { tip('此浏览器不支持全屏'); }
    wake();
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(function (ev) {
    document.addEventListener(ev, function () {
      bFull.classList.toggle('on', isFs());
      bFull.textContent = isFs() ? '退出' : '全屏';
      setTimeout(function () { if (window.RAIN) RAIN.resize(); }, 140);
      wake();
    });
  });

  /* ============ 交互 ============ */
  document.addEventListener('pointerdown', function (e) {
    var t = e.target;
    if (t && t.closest && !t.closest('#list') && !t.closest('#deck')) closeList();
    wake();
  });

  var rzT = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzT);
    rzT = setTimeout(function () { if (window.RAIN) RAIN.resize(); }, 180);
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { if (window.RAIN) RAIN.resize(); }, 320);
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { clock(); if (window.RAIN) RAIN.resize(); }
  });

  /* ============ 雨声（真实录音） ============ */
  var amb = null, ambOn = false;

  function ambInit() {
    if (amb) return;
    amb = new Audio('./sfx/rain.mp3');
    amb.loop = true;
    amb.preload = 'auto';
    amb.volume = 0;
  }

  function ambFade(to, ms) {
    if (!amb) return;
    var from = amb.volume;
    var st = Date.now();
    (function step() {
      var k = Math.min(1, (Date.now() - st) / ms);
      amb.volume = from + (to - from) * k;
      if (k < 1) setTimeout(step, 40);
    })();
  }

  function ambStart() {
    ambInit();
    if (ambOn) return;
    ambOn = true;
    var p = amb.play();
    if (p && p.catch) p.catch(function () { ambOn = false; });
    ambFade(0.42, 2200);
  }

  function ambUnlock() {
    document.removeEventListener('pointerdown', ambUnlock);
    ambStart();
  }
  document.addEventListener('pointerdown', ambUnlock);

  /* ============ 控制台：上拉展开 / 下拉收起 ============ */
  deckOpen = false;
  var deckY0 = 0, deckDrag = false;
  function deckSet(open) {
    deckOpen = !!open;
    if (elDeck) elDeck.classList.toggle('open', deckOpen);
  }
  function deckBind() {
    if (!elGrip) return;
    elGrip.addEventListener('pointerdown', function (e) {
      deckDrag = true;
      deckY0 = e.clientY;
      elGrip.style.cursor = 'grabbing';
      try { elGrip.setPointerCapture(e.pointerId); } catch (x) {}
    });
    elGrip.addEventListener('pointermove', function (e) {
      if (deckDrag && Math.abs(e.clientY - deckY0) > 8) e.preventDefault();
    });
    elGrip.addEventListener('pointerup', function (e) {
      if (!deckDrag) return;
      deckDrag = false;
      elGrip.style.cursor = 'grab';
      var d = e.clientY - deckY0;
      if (d < -28) deckSet(true);
      else if (d > 28) deckSet(false);
      else deckSet(!deckOpen);
      wake();
    });
    elGrip.addEventListener('pointercancel', function () {
      deckDrag = false;
      elGrip.style.cursor = 'grab';
    });
    elGrip.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); deckSet(!deckOpen); wake(); }
    });
  }
  deckBind();

  /* ============ 启动 ============ */
  function boot() {
    if (window.RAIN) RAIN.init(id('rain'));
    if (SITE.length) load(0, false);
    renderRows();
    wake();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
