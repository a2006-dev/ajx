<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>停云 · TIME LOUNGE</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  background:#0a0e14;
  color:#e8eef8;
  font-family:'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  user-select:none; -webkit-user-select:none;
  display:flex; align-items:center; justify-content:center;
}
#dust { position:fixed; inset:0; z-index:0; }
.lounge {
  position:relative; z-index:1;
  text-align:center;
  padding:20px;
  max-width:94vw;
}
.title {
  font-size:clamp(15px, 2.4vw, 24px);
  font-weight:200;
  letter-spacing:.55em;
  text-indent:.55em;
  color:rgba(236,244,255,.82);
}
.title .en {
  display:block;
  margin-top:12px;
  font-size:.52em;
  font-weight:300;
  letter-spacing:.95em;
  text-indent:.95em;
  color:rgba(140,172,225,.42);
}
.poem {
  margin-top:18px;
  font-size:clamp(12px, 1.9vw, 16px);
  font-weight:300;
  letter-spacing:.34em;
  text-indent:.34em;
  color:rgba(160,185,225,.48);
}
.poem .dot { margin:0 .5em; opacity:.4; }
.time {
  margin-top:36px;
  font-size:clamp(62px, 15vw, 172px);
  font-weight:200;
  font-variant-numeric:tabular-nums;
  letter-spacing:.035em;
  line-height:1.05;
  color:#f4f8ff;
  text-shadow:0 0 46px rgba(110,160,255,.32), 0 0 120px rgba(110,160,255,.14);
}
.date {
  margin-top:14px;
  font-size:clamp(13px, 1.9vw, 16px);
  font-weight:300;
  letter-spacing:.32em;
  text-indent:.32em;
  color:rgba(180,202,238,.52);
}
.stay {
  margin-top:32px;
  display:inline-flex; align-items:center; gap:14px;
  padding:11px 24px;
  border-radius:999px;
  background:rgba(255,255,255,.045);
  border:1px solid rgba(122,162,255,.16);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
}
.stay .label { font-size:11px; letter-spacing:.42em; color:rgba(180,202,238,.48); }
#stay { font-size:20px; font-weight:300; letter-spacing:.13em; color:#cfe0ff; font-variant-numeric:tabular-nums; }
.controls { margin-top:36px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
.ctl {
  display:inline-flex; align-items:center; gap:9px;
  font-size:13px; font-weight:300; letter-spacing:.12em; color:#dce7ff;
  padding:12px 21px; border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(122,162,255,.18);
  cursor:pointer;
  -webkit-transition:all .35s ease; transition:all .35s ease;
}
.ctl .ic { display:inline-flex; opacity:.75; }
.ctl:hover, .ctl.on {
  background:rgba(110,160,255,.2);
  border-color:rgba(150,190,255,.55);
  box-shadow:0 0 26px rgba(110,160,255,.28);
}
.foot {
  margin-top:40px;
  font-size:11px; font-weight:300;
  letter-spacing:.5em; text-indent:.5em;
  color:rgba(160,185,225,.3);
}
/* ========== 播放器（黑胶唱片折叠卡） ========== */
.player {
  margin-top:40px;
  display:flex; flex-direction:column; align-items:stretch; gap:0;
  width:min(360px, 90vw);
  padding:14px 16px 12px;
  border-radius:20px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(122,162,255,.18);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  box-shadow:0 10px 44px rgba(0,0,0,.38);
  text-align:left;
}
.player-top {
  display:flex; align-items:center; gap:12px;
}
.discWrap {
  position:relative; flex:none;
  width:64px; height:64px;
}
.disc {
  width:100%; height:100%;
  border-radius:50%;
  background:radial-gradient(circle at 30% 30%, #262d3d, #0d1119 70%);
  border:1px solid rgba(150,180,255,.28);
  box-shadow:0 5px 24px rgba(0,0,0,.55), inset 0 0 0 6px rgba(255,255,255,.03);
  display:flex; align-items:center; justify-content:center;
  animation:spin 3s linear infinite;
}
.disc.paused { animation-play-state:paused; }
@keyframes spin { to { transform:rotate(360deg); } }
.disc .cover {
  width:54%; height:54%;
  border-radius:50%;
  object-fit:cover;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);
}
.discWrap .spindle {
  position:absolute; top:50%; left:50%;
  width:12px; height:12px;
  border-radius:50%;
  background:#eef4ff;
  transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(255,255,255,.65);
  z-index:2;
  border:3px solid rgba(0,0,0,.4);
}
.p-main { flex:1; min-width:0; }
/* ===== 歌词滚动区（上下滚动 + 当前行高亮） ===== */
.p-lyric {
  position:relative;
  margin:12px 4px 2px;
  height:104px;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent);
  mask-image:linear-gradient(to bottom, transparent, #000 26%, #000 74%, transparent);
}
.p-lyric .l-inner {
  position:absolute; left:0; right:0; top:0;
  will-change:transform;
  transition:transform .5s cubic-bezier(.19,1,.22,1);
}
.p-lyric .l-line {
  text-align:center;
  padding:5px 0;
  font-size:13px; font-weight:300; letter-spacing:.05em;
  color:rgba(170,196,236,.35);
  transition:color .35s ease, font-weight .35s ease, text-shadow .35s ease, transform .35s ease, letter-spacing .35s ease;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.p-lyric .l-line.on {
  color:#f2f6ff;
  font-weight:500;
  letter-spacing:.08em;
  transform:scale(1.06);
  text-shadow:0 0 26px rgba(140,175,255,.55), 0 0 6px rgba(140,175,255,.35);
}
.p-lyric .l-line.preview {
  color:rgba(200,220,255,.55);
  transform:scale(1.02);
}
.p-name {
  font-size:13px; font-weight:400; letter-spacing:.04em;
  color:#f2f6ff;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.p-artist {
  margin-top:2px;
  font-size:10px; font-weight:300; letter-spacing:.14em;
  color:rgba(170,196,236,.6);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.p-prog { margin-top:8px; }
.p-prog input[type=range] {
  -webkit-appearance:none; appearance:none;
  width:100%; height:4px; border-radius:999px;
  background:rgba(122,162,255,.2);
  outline:none; cursor:pointer;
}
.p-prog input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; appearance:none;
  width:12px; height:12px; border-radius:50%;
  background:#cfe0ff;
  box-shadow:0 0 10px rgba(120,165,255,.75);
  border:none;
}
.p-prog input[type=range]::-moz-range-thumb {
  width:12px; height:12px; border-radius:50%;
  background:#cfe0ff; border:none;
}
.p-time {
  margin-top:4px;
  display:flex; justify-content:space-between;
  font-size:9px; font-weight:300; letter-spacing:.1em;
  color:rgba(170,196,236,.5);
  font-variant-numeric:tabular-nums;
}
.p-ctl {
  margin-top:8px;
  display:flex; align-items:center; justify-content:space-between;
}
.pc {
  display:inline-flex; align-items:center; justify-content:center;
  padding:6px; border-radius:50%;
  background:transparent; border:none;
  color:#cfe0ff; cursor:pointer;
  -webkit-transition:all .25s ease; transition:all .25s ease;
}
.pc:hover { background:rgba(120,165,255,.18); }
.pc.act { color:#8ec2ff; }
.pc.main {
  width:36px; height:36px;
  background:linear-gradient(135deg, rgba(120,165,255,.35), rgba(120,165,255,.12));
  border:1px solid rgba(150,190,255,.4);
  box-shadow:0 0 22px rgba(120,165,255,.3);
}
.pc.main:hover { background:linear-gradient(135deg, rgba(120,165,255,.5), rgba(120,165,255,.2)); }
.pc svg { width:14px; height:14px; }
.pc.main svg { width:16px; height:16px; }
/* 入场动画（全站统一 .iUp：从下到上浮现） */
.iUp { opacity:0; transform:translate3d(0,80px,0); transition:all 2s cubic-bezier(.19,1,.22,1); }
.iUp.up { opacity:1; transform:translate3d(0,0,0); }
/* 横屏压缩布局（手机横屏/矮屏） */
@media (max-height:520px) and (orientation:landscape) {
  .title { font-size:clamp(12px, 2.6vh, 16px); }
  .title .en { margin-top:4px; }
  .time { margin-top:8px; font-size:clamp(42px, 12vh, 92px); }
  .date { margin-top:6px; }
  .stay { margin-top:10px; padding:6px 18px; }
  #stay { font-size:16px; }
  .controls { margin-top:14px; gap:8px; }
  .ctl { padding:8px 14px; font-size:12px; }
  .foot { margin-top:12px; }
  .player { margin-top:16px; padding:10px 12px; gap:10px; }
  .discWrap { width:56px; height:56px; }
  .p-name { font-size:12px; }
  .p-prog { margin-top:6px; }
  .p-ctl { margin-top:6px; }
}

</style>
</head>
<body>
<canvas id="dust"></canvas>
<div class="lounge">
  <div class="title iUp">停 云<span class="en">T I M E&nbsp;&nbsp;L O U N G E</span></div>
  <div class="poem iUp">霭霭停云<span class="dot">·</span>濛濛时雨</div>
  <div class="time iUp" id="clock">--:--:--</div>
  <div class="date iUp" id="date">----</div>
  <div class="stay iUp"><span class="label">HANGING</span><span id="stay">00:00:00</span></div>
  <div class="controls iUp">
    <button class="ctl" id="btnFs"><span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg></span>全屏</button>
    <button class="ctl" id="btnLand"><span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></span>横屏</button>
  </div>
  <div class="player iUp">
    <div class="player-top">
      <div class="discWrap">
        <div class="disc" id="disc">
          <img class="cover" id="cover" src="./images/savoir.jpg" alt="cover">
        </div>
        <div class="spindle"></div>
      </div>
      <div class="p-main">
        <div class="p-name" id="pName">Savoir Adore</div>
        <div class="p-artist" id="pArtist">When the Summer Ends</div>
        <div class="p-prog">
          <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        </div>
        <div class="p-time">
          <span id="cur">0:00</span><span id="dur">0:00</span>
        </div>
      </div>
    </div>
    <div class="p-lyric" id="pLyric">
      <div class="l-inner" id="lInner"></div>
    </div>
    <div class="p-ctl">
      <button class="pc act" id="btnRepeat" title="循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
      <button class="pc" id="btnPrev" title="上一首"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg></button>
      <button class="pc main" id="btnPlay" title="播放/暂停"><svg id="icPlay" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg><svg id="icPause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
      <button class="pc" id="btnNext" title="下一首"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
      <button class="pc act" id="btnShuffle" title="随机"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg></button>
    </div>
  </div>
  <div class="foot iUp">任时光流淌 · L O U N G E   M O D E</div>
</div>
<script>
/* ========== 1. 星尘粒子循环动画 ========== */
(function () {
  var c = document.getElementById('dust');
  if (!c) return;
  var x = c.getContext('2d');
  var w = 0, h = 0, ps = [];
  function size() { w = c.width = innerWidth; h = c.height = innerHeight; }
  size();
  var N = Math.max(40, Math.min(150, Math.floor(w * h / 11000)));
  for (var i = 0; i < N; i++) {
    ps.push({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.2 + 0.5,
      vx: (Math.random() - 0.5) * 0.22,
      vy: -(Math.random() * 0.5 + 0.12),
      a: Math.random() * 0.5 + 0.12,
      ph: Math.random() * Math.PI * 2
    });
  }
  var mx = -1, my = -1;
  addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; });
  addEventListener('touchmove', function (e) { if (e.touches && e.touches[0]) { mx = e.touches[0].clientX; my = e.touches[0].clientY; } }, { passive: true });
  var t = 0;
  function frame() {
    t += 0.016;
    x.clearRect(0, 0, w, h);
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#080c14');
    g.addColorStop(0.55, '#0a101e');
    g.addColorStop(1, '#101426');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    for (var i = 0; i < ps.length; i++) {
      var p = ps[i];
      p.x += p.vx; p.y += p.vy;
      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10; else if (p.x > w + 10) p.x = -10;
      if (mx > 0) {
        var dx = mx - p.x, dy = my - p.y, d2 = dx * dx + dy * dy;
        if (d2 < 14400 && d2 > 1) { var d = Math.sqrt(d2); p.x -= dx / d * 0.4; p.y -= dy / d * 0.4; }
      }
      var al = p.a * (0.55 + 0.45 * Math.sin(t * 1.4 + p.ph));
      x.beginPath();
      x.arc(p.x, p.y, p.r, 0, 6.2832);
      x.fillStyle = 'rgba(182,206,255,' + al.toFixed(3) + ')';
      x.fill();
    }
    var cg = x.createRadialGradient(w / 2, h * 0.42, 10, w / 2, h * 0.42, w * 0.55);
    cg.addColorStop(0, 'rgba(96,142,255,' + (0.05 + 0.02 * Math.sin(t)).toFixed(3) + ')');
    cg.addColorStop(1, 'rgba(96,142,255,0)');
    x.fillStyle = cg; x.fillRect(0, 0, w, h);
    requestAnimationFrame(frame);
  }
  frame();
  addEventListener('resize', size);
})();

/* ========== 2. 大号时钟 + 挂机时长 ========== */
(function () {
  var clock = document.getElementById('clock');
  var dateEl = document.getElementById('date');
  var stayEl = document.getElementById('stay');
  var start = Date.now();
  var week = ['日', '一', '二', '三', '四', '五', '六'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function tick() {
    var d = new Date();
    clock.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    dateEl.textContent = d.getFullYear() + ' · ' + (d.getMonth() + 1) + '月' + d.getDate() + '日 · 星期' + week[d.getDay()];
    var s = Math.floor((Date.now() - start) / 1000);
    stayEl.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  tick();
  setInterval(tick, 1000);
})();

/* ========== 3. 全屏 / 横屏 ========== */
(function () {
  var btnFs = document.getElementById('btnFs');
  var btnLand = document.getElementById('btnLand');
  function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function enterFs() {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) { var r = fn.call(el); if (r && r.catch) r.catch(function () { }); }
  }
  function exitFs() {
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) fn.call(document);
  }
  btnFs.addEventListener('click', function () {
    if (isFs()) exitFs(); else enterFs();
  });
  btnLand.addEventListener('click', function () {
    if (!isFs()) enterFs();
    var so = screen.orientation;
    if (so && so.lock) {
      so.lock('landscape').catch(function () { });
    } else {
      try {
        var el = document.documentElement;
        var fn = el.requestFullscreen || el.webkitRequestFullscreen;
        if (fn) { var r = fn.call(el); if (r && r.catch) r.catch(function () { }); }
      } catch (e) { }
    }
  });
})();

/* ========== 4. 音乐播放器（黑胶唱片 + 专辑封面） ========== */
(function () {
  var lyricWaiting = [
    { t: 17.13, l: 'Come on let\u2019s go sailing' },
    { t: 21.37, l: 'I don\u2019t really know how' },
    { t: 25.15, l: 'Set the sun to daydream' },
    { t: 28.82, l: 'We don\u2019t got much time now' },
    { t: 32.72, l: 'I\u2019m fading faster lately' },
    { t: 36.08, l: 'Don\u2019t make me sit here waiting' },
    { t: 40.49, l: 'So long, so long, so long, so long' },
    { t: 62.80, l: 'Locked in when there\u2019s no sound' },
    { t: 65.93, l: 'Put my headphones loud' },
    { t: 70.86, l: 'Hit the spacebar hard now' },
    { t: 74.47, l: 'Taking off jump around' },
    { t: 78.29, l: 'I can\u2019t remember lately' },
    { t: 81.92, l: 'I fall apart it\u2019s daily' },
    { t: 85.78, l: 'I\u2019m fading faster take me' },
    { t: 89.49, l: 'Don\u2019t make me sit here waiting' },
    { t: 93.57, l: 'So long, so long, so long, so long' }
  ];
  var tracks = [
    { src: './music/savoir-adore-summer-ends.mp3', name: 'When the Summer Ends', artist: 'Savoir Adore', cover: './images/savoir.jpg' },
    { src: './music/boa-duvet.mp3', name: 'Duvet', artist: 'bôa', cover: './images/boa.jpg' },
    { src: './music/cafune-tek-it.mp3', name: 'Tek It', artist: 'Cafuné', cover: './images/cafune.jpg' },
    { src: './music/juliana-chahayed-waiting.mp3', name: 'waiting...', artist: 'Juliana Chahayed', cover: './images/juliana.jpg', lyric: lyricWaiting }
  ];
  var idx = 0, on = false, repeat = true, shuffle = false;
  var audio = new Audio();
  audio.volume = 0.22;
  audio.preload = 'auto';

  var elCover = document.getElementById('cover');
  var elName = document.getElementById('pName');
  var elArtist = document.getElementById('pArtist');
  var elSeek = document.getElementById('seek');
  var elCur = document.getElementById('cur');
  var elDur = document.getElementById('dur');
  var elDisc = document.getElementById('disc');
  var elPlay = document.getElementById('btnPlay');
  var icPlay = document.getElementById('icPlay');
  var icPause = document.getElementById('icPause');
  var elPrev = document.getElementById('btnPrev');
  var elNext = document.getElementById('btnNext');
  var elRepeat = document.getElementById('btnRepeat');
  var elShuffle = document.getElementById('btnShuffle');
  var elLyric = document.getElementById('lInner');

  function fmt(s) {
    if (!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60);
    var sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function setMeta() {
    var t = tracks[idx];
    elCover.src = t.cover;
    elCover.alt = t.name;
    elName.textContent = t.name;
    elArtist.textContent = t.artist;
    renderLyric();
  }

  function renderLyric() {
    var t = tracks[idx];
    if (!elLyric) return;
    elLyric.innerHTML = '';
    var lines = t.lyric;
    if (!lines || !lines.length) {
      var pre = document.createElement('div');
      pre.className = 'l-line';
      pre.textContent = '· · ·';
      elLyric.appendChild(pre);
      return;
    }
    for (var i = 0; i < lines.length; i++) {
      var li = document.createElement('div');
      li.className = 'l-line';
      li.textContent = lines[i].l;
      elLyric.appendChild(li);
    }
  }

  function updateLyric(tm) {
    var t = tracks[idx];
    if (!elLyric || !t.lyric || !t.lyric.length) return;
    var lines = elLyric.querySelectorAll('.l-line');
    if (!lines.length) return;
    var idxLine = 0;
    for (var i = 0; i < t.lyric.length; i++) {
      if (tm >= t.lyric[i].t) idxLine = i; else break;
    }
    for (var k = 0; k < lines.length; k++) {
      lines[k].classList.remove('on', 'preview');
      if (k === idxLine) lines[k].classList.add('on');
      else if (k === idxLine + 1) lines[k].classList.add('preview');
    }
    var lineH = 27; // 歌词行高近似值
    var off = lineH * 2.6; // 使当前行居中（约视口104px / 2 = 52px，行高27 → 偏移约 52 - 27/2 = 38）
    var y = -idxLine * lineH + off;
    elLyric.style.transform = 'translateY(' + y + 'px)';
  }

  function playState() {
    elDisc.classList.toggle('paused', !on);
    icPlay.style.display = on ? 'none' : 'block';
    icPause.style.display = on ? 'block' : 'none';
  }

  function load(n) {
    idx = ((n % tracks.length) + tracks.length) % tracks.length;
    setMeta();
    audio.src = tracks[idx].src;
    audio.load();
    if (on) audio.play().catch(function () { on = false; playState(); });
  }

  function next() {
    if (shuffle) {
      var r;
      do { r = Math.floor(Math.random() * tracks.length); } while (r === idx && tracks.length > 1);
      load(r);
    } else {
      load(idx + 1);
    }
  }

  setMeta();
  load(0);

  audio.addEventListener('loadedmetadata', function () {
    elDur.textContent = fmt(audio.duration);
    elSeek.max = audio.duration || 100;
  });
  audio.addEventListener('timeupdate', function () {
    if (!audio.duration) return;
    elCur.textContent = fmt(audio.currentTime);
    var pct = (audio.currentTime / audio.duration) * 100;
    elSeek.value = pct;
    updateLyric(audio.currentTime);
  });
  audio.addEventListener('ended', function () {
    if (repeat) { audio.currentTime = 0; audio.play().catch(function () { }); }
    else { next(); }
  });
  audio.addEventListener('error', function () { if (on) next(); });

  elPlay.addEventListener('click', function () {
    on = !on;
    if (on) {
      var p = audio.play();
      if (p && p.catch) p.catch(function () { on = false; playState(); });
    } else { audio.pause(); }
    playState();
  });
  elNext.addEventListener('click', function () { next(); });
  elPrev.addEventListener('click', function () { load(idx - 1); });

  elRepeat.addEventListener('click', function () {
    repeat = !repeat;
    elRepeat.classList.toggle('act', repeat);
  });
  elShuffle.addEventListener('click', function () {
    shuffle = !shuffle;
    elShuffle.classList.toggle('act', shuffle);
  });

  elSeek.addEventListener('input', function () {
    if (audio.duration) {
      audio.currentTime = (elSeek.value / 100) * audio.duration;
    }
  });

  // 首次进入不自动播放，等待用户点击
  on = false;
  playState();
})();

/* ========== 5. 入场动画（全站统一 .iUp） ========== */
(function () {
  var els = Array.prototype.slice.call(document.querySelectorAll('.iUp'));
  var t = 0, d = 150;
  els.forEach(function (e) {
    setTimeout(function () { e.classList.add('up'); }, t);
    t += d;
  });
})();
</script>
</body>
