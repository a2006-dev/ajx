<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="AJX 入口">
    <title>AJX · 入口</title>
    <link rel="stylesheet" type="text/css" href="./css/style.css">
    <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
    <link rel="icon" href="./favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Comfortaa', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            position: relative;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(3,169,244,0.14) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 30%, rgba(244,65,165,0.12) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 85%, rgba(0,255,157,0.12) 0%, transparent 55%),
                linear-gradient(160deg, #0d1117 0%, #14213d 55%, #1b1b2f 100%);
            -webkit-tap-highlight-color: transparent;
        }

        /* 背景星点 */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(1px 1px at 15% 25%, rgba(255,255,255,0.6) 50%, transparent 51%),
                radial-gradient(1.5px 1.5px at 75% 35%, rgba(255,255,255,0.4) 50%, transparent 51%),
                radial-gradient(1px 1px at 45% 60%, rgba(0,255,157,0.5) 50%, transparent 51%),
                radial-gradient(1px 1px at 85% 75%, rgba(255,255,255,0.3) 50%, transparent 51%),
                radial-gradient(1.5px 1.5px at 30% 88%, rgba(255,255,255,0.4) 50%, transparent 51%);
            background-size: 100% 100%;
            animation: twinkle 6s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* 3D 舞台 */
        .stage {
            position: relative;
            z-index: 5;
            perspective: 1200px;
            margin: 0;
        }

        .card-3d {
            position: relative;
            width: 640px;
            height: 340px;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            will-change: transform;
            transition: transform 0.35s ease;
            cursor: grab;
            -webkit-user-select: none;
            user-select: none;
        }

        .card-3d:active {
            cursor: grabbing;
        }

        /* 指向卡片时提亮，明确「这里可以点」 */
        .card-3d .cube-card:hover {
            border-color: rgba(255, 255, 255, 0.55);
            box-shadow:
                0 18px 46px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 34px rgba(255, 255, 255, 0.18);
        }
        .card-3d .cube-card:active {
            transform-origin: 50% 50%;
            filter: brightness(1.18);
        }

        /* 卡片 —— 磨砂玻璃 + 主题渐变描边 + 内部光斑 */
        .card-3d .cube-card {
            position: absolute;
            width: 190px;
            height: 250px;
            top: 50%;
            left: 50%;
            margin-top: -125px;
            margin-left: -95px;
            border-radius: 20px;
            transform-origin: 50% 50%;
            transform-style: preserve-3d;
            backface-visibility: visible;
            -webkit-backface-visibility: visible;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            cursor: pointer;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,0.18);
            box-shadow:
                0 15px 40px rgba(0,0,0,0.4),
                inset 0 1px 0 rgba(255,255,255,0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            will-change: transform;
        }

        /* 每张卡片主题描边 + 光晕 */
        .card-1 { border-color: rgba(255,95,109,0.45); box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 24px rgba(255,95,109,0.25); }
        .card-2 { border-color: rgba(0,198,255,0.45); box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1), 0 0 24px rgba(0,198,255,0.25); }
        .card-3 { border-color: rgba(255,125,165,0.45); box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12), 0 0 24px rgba(255,125,165,0.28); }
        .card-4 { border-color: rgba(61,220,132,0.45); box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12), 0 0 24px rgba(61,220,132,0.28); }
        .card-5 { border-color: rgba(167,139,250,0.45); box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12), 0 0 24px rgba(167,139,250,0.28); }

        /* 卡片内部光斑（右上角白色高光） */
        .cube-card::before {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            top: -45px;
            right: -45px;
            background: radial-gradient(circle, rgba(255,255,255,0.22) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* 卡片主题色光斑（左下角） */
        .card-1::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            bottom: -35px;
            left: -35px;
            background: radial-gradient(circle, rgba(255,95,109,0.5) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .card-2::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            bottom: -35px;
            left: -35px;
            background: radial-gradient(circle, rgba(0,198,255,0.5) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .card-3::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            bottom: -35px;
            left: -35px;
            background: radial-gradient(circle, rgba(255,125,165,0.55) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .card-4::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            bottom: -35px;
            left: -35px;
            background: radial-gradient(circle, rgba(61,220,132,0.55) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        .card-5::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            bottom: -35px;
            left: -35px;
            background: radial-gradient(circle, rgba(167,139,250,0.55) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .card-inner {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .cube-card:hover {
            border-color: rgba(255,255,255,0.5);
            box-shadow:
                0 25px 60px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.15),
                0 0 40px rgba(0,0,0,0.3);
            transform: translateZ(20px);
        }

        .cube-card:hover .card-icon {
            transform: scale(1.15);
            filter: brightness(1.1);
        }

        .cube-card:hover .card-name {
            text-shadow: 0 0 18px currentColor;
        }

        /* 卡片图标容器 —— 玻璃圆角方块 */
        .card-icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            transition: transform 0.3s ease, filter 0.3s ease;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.1);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
            overflow: hidden;
        }

        .card-icon svg {
            width: 28px;
            height: 28px;
        }

        .card-name {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            transition: text-shadow 0.3s ease;
        }

        .card-desc {
            font-size: 0.66rem;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.32em;
            text-transform: uppercase;
        }

        /* 主题色文字 */
        .card-1 .card-icon { color: #ff8a80; }
        .card-1 .card-name { color: #ff8a80; }
        .card-2 .card-icon { color: #80d8ff; }
        .card-2 .card-name { color: #80d8ff; }
        .card-3 .card-icon { color: #ff9db9; }
        .card-3 .card-name { color: #ff9db9; }
        .card-4 .card-icon { color: #8ef0b5; }
        .card-4 .card-name { color: #8ef0b5; }
        .card-5 .card-icon { color: #c4b5fd; }
        .card-5 .card-name { color: #c4b5fd; }

        /* 方位 */
        .card-3d .c1 { transform: rotateY(0deg) translateZ(260px); }
        .card-3d .c2 { transform: rotateY(72deg) translateZ(260px); }
        .card-3d .c3 { transform: rotateY(144deg) translateZ(260px); }
        .card-3d .c4 { transform: rotateY(216deg) translateZ(260px); }
        .card-3d .c5 { transform: rotateY(288deg) translateZ(260px); }

        /* 控制按钮 */
        .controls {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 26px;
            margin-top: 34px;
        }

        .ctrl-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .ctrl-btn:hover {
            background: rgba(255,255,255,0.2);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
            transform: scale(1.08);
        }

        .ctrl-btn.active {
            background: rgba(0,255,157,0.2);
            border-color: #00ff9d;
            color: #00ff9d;
            box-shadow: 0 0 20px rgba(0,255,157,0.4);
        }

        /* 返回主页 —— 磨砂玻璃按钮 */
        .back-home {
            position: relative;
            z-index: 5;
            margin-top: 30px;
        }

        .back-home a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: rgba(255,255,255,0.85);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            padding: 12px 32px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .back-home a:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.5);
            box-shadow: 0 0 24px rgba(255,255,255,0.2);
            color: #fff;
        }

        .back-home a .arrow {
            font-size: 1.1rem;
            line-height: 1;
        }

        /* 底部提示 */
        .hint {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.4);
            letter-spacing: 0.2em;
            animation: fadeUp 1s 0.6s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        @media (max-width: 560px) {
            .card-3d { width: 500px; height: 300px; }
            .card-3d .cube-card { width: 150px; height: 210px; }
            .card-3d .c1 { transform: rotateY(0deg) translateZ(210px); }
            .card-3d .c2 { transform: rotateY(72deg) translateZ(210px); }
            .card-3d .c3 { transform: rotateY(144deg) translateZ(210px); }
            .card-3d .c4 { transform: rotateY(216deg) translateZ(210px); }
            .card-3d .c5 { transform: rotateY(288deg) translateZ(210px); }
        }

        /* 从下到上入场动画（与主页 .iUp 一致） */
        .iUp {
            opacity: 0;
            -webkit-transform: translate3d(0, 80px, 0);
            -moz-transform: translate3d(0, 80px, 0);
            -ms-transform: translate3d(0, 80px, 0);
            -o-transform: translate3d(0, 80px, 0);
            transform: translate3d(0, 80px, 0);
            -webkit-transition: all 2s cubic-bezier(0.19, 1, 0.22, 1);
            -moz-transition: all 2s cubic-bezier(0.19, 1, 0.22, 1);
            transition: all 2s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .iUp.up {
            opacity: 1;
            -webkit-transform: translate3d(0, 0, 0);
            -moz-transform: translate3d(0, 0, 0);
            -ms-transform: translate3d(0, 0, 0);
            -o-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }
    </style>
</head>
<body>
    <div class="stage iUp">

                            <circle cx="18.5" cy="18" r="1.8" fill="currentColor"/>

    <div class="controls iUp">
        <button class="ctrl-btn" id="prevBtn" title="向左旋转">◀</button>
        <button class="ctrl-btn" id="nextBtn" title="向右旋转">▶</button>

    <div class="hint iUp">拖动卡片手动旋转 · 点击卡片进入</div>

    <script>
(function () {
    'use strict';

    var card3d = document.getElementById('card3d');
    if (!card3d) return;

    /* ---------- 入场动画（从下到上逐步浮现） ---------- */
    (function iUpAnim() {
        var els = Array.prototype.slice.call(document.querySelectorAll('.iUp'));
        var t = 0, d = 150;
        els.forEach(function (e) {
            setTimeout(function () { e.classList.add('up'); }, t);
            t += d;
        });
    })();

    /* ---------- 状态 ---------- */
    var rotY = 0;
    var SPEED = 0.15;
    var ANGLE_STEP = 72;
    var mode = 'auto';            // auto | drag | inertia | settle
    var velocity = -SPEED;

    var settleFrom = 0, settleTarget = 0, settleElapsed = 0, settleDur = 320;
    var dragSeen = 0;              // 最后一次收到拖拽事件的时间，用于看门狗

    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');

    function apply() {
        card3d.style.transform = 'perspective(1200px) rotateY(' + rotY + 'deg)';
    }

    function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

    /* 把角度吸附到最近的整格 */
    function nearestSlot() {
        return Math.round(rotY / ANGLE_STEP) * ANGLE_STEP;
    }

    function settleTo(target) {
        mode = 'settle';
        settleFrom = rotY;
        settleTarget = target;
        settleElapsed = 0;
        settleDur = 360;
    }

    /* 任何中断都走这里：一定回到 settle，动画不会停 */
    function recover() {
        if (mode === 'settle') return;
        settleTo(nearestSlot());
    }

    /* ---------- 动画循环 ---------- */
    var last = performance.now();
    function tick(now) {
        var dt = Math.min(now - last, 50) / 16.7;
        last = now;
        card3d.style.transition = 'none';

        if (mode === 'auto') {
            rotY -= SPEED * dt;
        } else if (mode === 'settle') {
            settleElapsed = Math.min(settleElapsed + dt * 16.7, settleDur);
            var p = easeOut(settleElapsed / settleDur);
            rotY = settleFrom + (settleTarget - settleFrom) * p;
            if (settleElapsed >= settleDur) {
                rotY = settleTarget;
                mode = 'auto';
                velocity = -SPEED;
            }
        } else if (mode === 'inertia') {
            velocity *= Math.pow(0.92, dt);
            rotY += velocity * dt;
            if (Math.abs(velocity) < 0.06) {
                velocity = -SPEED;
                settleTo(nearestSlot());
            }
        } else if (mode === 'drag') {
            /* 拖拽中由 pointermove 直接改 rotY。
               看门狗：若 1.2 秒内没有新的拖拽事件，说明 up/cancel 事件丢了
               （常见于手指滑出窗口、切后台再回来），强制退出 drag 恢复旋转。 */
            if (dragSeen && now - dragSeen > 1200) {
                active = false;
                activeKind = null;
                downLink = null;
                justDragged = true;
                settleTo(nearestSlot());
            }
        } else {
            /* 兜底：未知状态一律回到自动旋转，避免动画卡死 */
            mode = 'auto';
            velocity = -SPEED;
        }

        apply();
        requestAnimationFrame(tick);
    }

    apply();
    requestAnimationFrame(tick);

    /* ---------- 按钮 ---------- */
    if (prevBtn) prevBtn.addEventListener('click', function () {
        settleTo(Math.round(rotY / ANGLE_STEP) * ANGLE_STEP + ANGLE_STEP);
    });
    if (nextBtn) nextBtn.addEventListener('click', function () {
        settleTo(Math.round(rotY / ANGLE_STEP) * ANGLE_STEP - ANGLE_STEP);
    });

    /* ---------- 拖拽 + 点击 ---------- */
    var CLICK_SLOP = 10;          // 位移小于此值判定为点击
    var active = false;           // 是否正在拖拽
    var activeKind = null;        // 'pointer' | 'touch'
    var downLink = null;
    var downX = 0, downY = 0;
    var startRot = 0;
    var lastX = 0, lastT = 0;
    var moved = 0;
    var justDragged = false;      // 用来压制拖拽后浏览器补发的 click

    /* 从某元素向上找 <a href>；不限边界，因为卡片可能溢出容器 */
    function findLink(el) {
        var guard = 0;
        while (el && guard++ < 40) {
            if (el.tagName === 'A' && el.getAttribute('href')) return el;
            el = el.parentNode;
        }
        return null;
    }

    /* 按坐标找卡片链接：优先 elementFromPoint，失败则用事件 target */
    function linkAt(x, y, fallback) {
        var el = null;
        try { el = document.elementFromPoint(x, y); } catch (e) { el = null; }
        var hit = findLink(el);
        if (hit) return hit;
        return findLink(fallback);
    }

    function startDrag(x, y, link) {
        active = true;
        downLink = link;
        downX = x; downY = y;
        startRot = rotY;
        lastX = x;
        lastT = performance.now();
        moved = 0;
        justDragged = false;
        mode = 'drag';
        dragSeen = performance.now();
        card3d.style.cursor = 'grabbing';
    }

    function moveDrag(x) {
        if (!active) return;
        var dx = x - downX;
        if (Math.abs(dx) > moved) moved = Math.abs(dx);
        rotY = startRot + dx * 0.5;
        apply();
        var now = performance.now();
        var dt = now - lastT;
        if (dt > 0) velocity = ((x - lastX) * 0.5) / (dt / 16.7);
        lastX = x;
        lastT = now;
        last = now;
        dragSeen = now;
    }

    /* 结束：先决定是点击还是拖拽，然后无论哪条路都保证 mode 回到 auto */
    function endDrag(x, y) {
        if (!active) {
            recover();
            return;
        }
        active = false;
        activeKind = null;
        card3d.style.cursor = 'grab';

        var link = downLink;
        downLink = null;

        var dist = Math.abs(x - downX) + Math.abs(y - downY);
        if (moved < CLICK_SLOP && dist < CLICK_SLOP + 6 && link) {
            var href = link.getAttribute('href');
            if (href) {
                mode = 'auto';           // 跳转前先复原，防止返回后卡住
                velocity = -SPEED;
                window.location.href = href;
                return;
            }
        }

        if (moved >= CLICK_SLOP) {
            justDragged = true;
            if (Math.abs(velocity) > 0.08) {
                mode = 'inertia';
            } else {
                settleTo(nearestSlot());
            }
        } else {
            /* 点了空白处：吸附回最近正面 */
            settleTo(nearestSlot());
        }
    }

    /* ---- Pointer Events（现代浏览器统一处理鼠标/触摸/笔） ---- */
    if (window.PointerEvent) {
        window.addEventListener('pointerdown', function (e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            var link = linkAt(e.clientX, e.clientY, e.target);
            if (!link) { recover(); return; }
            activeKind = 'pointer';
            startDrag(e.clientX, e.clientY, link);
        }, true);

        window.addEventListener('pointermove', function (e) {
            if (!active || activeKind !== 'pointer') return;
            moveDrag(e.clientX);
        }, true);

        window.addEventListener('pointerup', function (e) {
            if (!active || activeKind !== 'pointer') { recover(); return; }
            endDrag(e.clientX, e.clientY);
        }, true);

        window.addEventListener('pointercancel', function () {
            if (!active) { recover(); return; }
            active = false;
            activeKind = null;
            downLink = null;
            card3d.style.cursor = 'grab';
            recover();
        }, true);
    } else {
        /* ---- 老浏览器兜底：鼠标 ---- */
        window.addEventListener('mousedown', function (e) {
            if (e.button !== 0) return;
            var link = linkAt(e.clientX, e.clientY, e.target);
            if (!link) { recover(); return; }
            activeKind = 'pointer';
            startDrag(e.clientX, e.clientY, link);
        }, true);
        window.addEventListener('mousemove', function (e) {
            if (!active || activeKind !== 'pointer') return;
            moveDrag(e.clientX);
        }, true);
        window.addEventListener('mouseup', function (e) {
            if (!active) { recover(); return; }
            endDrag(e.clientX, e.clientY);
        }, true);
    }

    /* ---- 触摸兜底（部分安卓 WebView 的 pointer 事件不可靠） ---- */
    window.addEventListener('touchstart', function (e) {
        if (active) return;                 // pointer 已处理
        if (e.touches.length !== 1) return;
        var t = e.touches[0];
        var link = linkAt(t.clientX, t.clientY, e.target);
        if (!link) { recover(); return; }
        activeKind = 'touch';
        startDrag(t.clientX, t.clientY, link);
    }, { passive: true, capture: true });

    window.addEventListener('touchmove', function (e) {
        if (!active || activeKind !== 'touch' || e.touches.length !== 1) return;
        var t = e.touches[0];
        moveDrag(t.clientX);
        if (moved >= CLICK_SLOP) {
            justDragged = true;
            if (e.cancelable) e.preventDefault();
        }
    }, { passive: false, capture: true });

    window.addEventListener('touchend', function (e) {
        if (!active || activeKind !== 'touch') { recover(); return; }
        var t = (e.changedTouches && e.changedTouches[0]) || { clientX: lastX, clientY: downY };
        endDrag(t.clientX, t.clientY);
    }, { capture: true });

    window.addEventListener('touchcancel', function () {
        if (!active) { recover(); return; }
        active = false;
        activeKind = null;
        downLink = null;
        card3d.style.cursor = 'grab';
        recover();
    }, { capture: true });

    /* 拖拽后浏览器可能补发 click，压掉避免二次跳转 */
    window.addEventListener('click', function (e) {
        if (justDragged) {
            justDragged = false;
            e.preventDefault();
            e.stopPropagation();
        }
    }, true);

    /* 键盘 */
    window.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') settleTo(Math.round(rotY / ANGLE_STEP) * ANGLE_STEP + ANGLE_STEP);
        else if (e.key === 'ArrowRight') settleTo(Math.round(rotY / ANGLE_STEP) * ANGLE_STEP - ANGLE_STEP);
    });

    /* 页面从后台返回时强制复位，避免回来发现不转了 */
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
            last = performance.now();
            if (!active) recover();
        }
    });
})();
</script>
</body>
</html>
